name: cibuildmp
description: "Installs and runs cibuildmp on the current runner"
inputs:
  package-dir:
    description: 'Input directory, defaults to "."'
    required: false
    default: .
  output-dir:
    description: 'Folder to place the outputs in, defaults to "mpyhouse"'
    required: false
    default: ""
  config-file:
    description: "File containing the config, defaults to {package-dir}/cibuildmp.toml"
    required: false
    default: ""
  only:
    description: >
      Build exactly this one identifier (e.g. mpy6.3-natmod-armv7emsp),
      ignoring the config's own build/skip selectors. This is what a matrix
      leg passes back in -- see the cibuildmp-matrix action, which generates
      the list.
    required: false
    default: ""
  extras:
    description: "Comma-separated list of cibuildmp extras to install"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        python-version: "3.14"

    - id: cibmp
      shell: bash
      run: |
        set -euo pipefail

        # Install cibuildmp from this action's own checkout, so the version
        # that runs is exactly the ref the caller pinned -- no separate
        # package index to keep in sync with the action tag, and no way for
        # the two to disagree. github.action_path is where the runner put
        # this repo at that ref.
        SPEC="${{ github.action_path }}"
        if [ -n "${{ inputs.extras }}" ]; then
          SPEC="${SPEC}[${{ inputs.extras }}]"
        fi
        uv tool install "$SPEC"

        # `if` blocks, not `[ -n x ] && ARGS+=(...)`: under `set -e` a
        # false test makes the whole && list return non-zero and kills the
        # step, since it is not in a condition context.
        ARGS=("${{ inputs.package-dir }}")
        if [ -n "${{ inputs.output-dir }}" ]; then
          ARGS+=(--output-dir "${{ inputs.output-dir }}")
        fi
        if [ -n "${{ inputs.config-file }}" ]; then
          ARGS+=(--config-file "${{ inputs.config-file }}")
        fi
        if [ -n "${{ inputs.only }}" ]; then
          ARGS+=(--only "${{ inputs.only }}")
        fi

        cibuildmp "${ARGS[@]}"
