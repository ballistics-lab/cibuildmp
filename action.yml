name: cibuildmp
description: "Installs and runs cibuildmp on the current runner"
branding:
  icon: cpu
  color: blue
inputs:
  package-dir:
    description: 'Input directory, defaults to "."'
    required: false
    default: .
  output-dir:
    description: 'Folder to place the outputs in, defaults to "mpyhouse"'
    required: false
    default: ""
  config-file:
    description: "File containing the config, defaults to {package-dir}/cibuildmp.toml"
    required: false
    default: ""
  only:
    description: >
      Build exactly this one identifier (e.g. mpy6.3-natmod-armv7emsp),
      ignoring the config's own build/skip selectors. This is what a matrix
      leg passes back in -- see the cibuildmp-matrix action, which generates
      the list.
    required: false
    default: ""
  extras:
    description: "Comma-separated list of cibuildmp extras to install"
    required: false
    default: ""

# Docker, not composite: cibuildmp's own toolchain provisioning needs real
# apt packages on the runner (gcc-multilib for x86, gcc-mingw-w64 for
# windows/x64/x86, libusb1 for esp32 -- .github/docker/action.Dockerfile's
# own comment has the full per-package reasoning, shared with the root
# Dockerfile). A composite action can only apt-install those as a step
# that runs, and re-runs, on every single job -- a Docker action bakes
# them into the image once, at build/cache time, instead. Inputs become
# INPUT_<NAME> env vars in the container; entrypoint.sh (in the image)
# reads them and builds the exact same cibuildmp command line the old
# composite step's own bash did.
runs:
  using: "docker"
  image: ".github/docker/action.Dockerfile"
