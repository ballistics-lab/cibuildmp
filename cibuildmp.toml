# cibuildmp.toml — example config, in the spirit of cibuildwheel's
# [tool.cibuildwheel] section: one declarative file in a module's own repo
# drives its whole target matrix, resolved by the `cibuildmp` CLI instead of
# hand-wired GitHub Actions per repo.
#
# This particular file is a reference example, not a live config — this
# repository ships the tool, it is not itself a MicroPython C module and has
# no natmod/ directory. The values below are drawn from micropython-bclibc,
# the most demanding of the three consuming repos.
#
# See docs/BACKLOG.md for the decisions behind this schema (D1-D8) and for
# what is and is not implemented yet.
#
# Location: cibuildmp.toml at the repo root. If the project also has a
# pyproject.toml, the same tree is accepted under [tool.cibuildmp]; this
# file wins when both exist. (MicroPython C-module repos generally have no
# pyproject.toml — it is not their convention — hence the standalone file.)
#
# Every option below is overridable by a CIBMP_-prefixed environment
# variable (CIBMP_BUILD, CIBMP_SKIP, CIBMP_MICROPYTHON, CIBMP_OUTPUT_DIR,
# CIBMP_EXTRA_MAKE_ARGS, ...). Precedence, lowest to highest:
#   defaults -> this file -> matching [[overrides]] -> environment -> CLI

# ── Global ────────────────────────────────────────────────────────────────
# No micropython/mpy-abi key here (record 0052, A2 -- this repo has no
# usermod module either, so there is genuinely nothing left in [Global]
# that would pin a release tag for natmod): the .mpy ABI axis is a
# statically known domain now, resources/build-platforms.toml recording
# every ABI this project has actually verified against a real MicroPython
# tag, each resolved to its own newest known tag automatically. An
# unconfigured `build` selector below narrows it to the single newest known
# ABI by itself; naming an older one explicitly (`build = "mpy6.2-*"`) opens
# it up instead of pinning a tag directly -- there is currently no way to
# pin an explicit tag for a given ABI, a known, undesigned gap.
# (`micropython` stays a real key for usermod's own [[unix]]/[esp32]/...
# tables, unrelated to natmod -- see examples/template/cibuildmp.toml.)

# Where built .mpy files are collected. cibuildwheel's "wheelhouse".
output-dir = "mpyhouse"

# Submodules to initialise in the MicroPython checkout. Almost always empty:
# a release tag is fetched as its release tarball, which already vendors
# every lib/ submodule. This only takes effect on the fallback path -- a
# preview tag or a branch publishes no tarball and is shallow-cloned
# instead, and a --depth 1 clone vendors none of them. Most natmods need
# nothing here (py/ and tools/mpy_ld.py are in-tree), but upstream's own
# examples/natmod/btree builds against lib/berkeley-db-1.xx, which is a
# submodule.
# micropython-submodules = ["lib/berkeley-db-1.xx"]

# ── Build selectors ───────────────────────────────────────────────────────
# Globs over the flat build identifier, which is shaped after
# cibuildwheel's cp311-manylinux_x86_64 = {ABI}_{arch} -- no literal
# "natmod" segment (record 0052, A2): natmod is one platform among six
# sharing this same identifier shape now, not a mode spelled into the
# string.
#
#     mpy6.3-x64
#     mpy6.3-armv7emsp
#
# Space-separated, `skip` applied after `build`. Examples:
#     build = "mpy6.3-*"          # everything at this ABI (today's default)
#     build = "mpy6.2-* mpy6.3-*" # two ABIs in one invocation
#     build = "*-armv7em*"        # both Cortex-M4F/M7 variants
#     skip  = "*-xtensawin"       # temporarily drop one arch
#
# There is deliberately no precision/float field in the identifier: it is
# already encoded in the arch itself (MP_NATIVE_ARCH_ARMV7EMSP and
# ...ARMV7EMDP are distinct values, selected from __ARM_FP in
# py/persistentcode.h). A project-level precision define is an override, not
# an axis — see [[overrides]] below.
#
# Left unset here on purpose: an unconfigured `build` already narrows to
# the single newest known ABI (record 0052, A2), which is the sensible
# default for a project like this one that only wants its current release
# built. Writing `build = "*"` explicitly would widen it to every ABI
# resources/build-platforms.toml has ever verified, back to MicroPython
# v1.12 -- rarely what a real project wants.
skip = ""

# ── natmod: one build per dynruntime.mk ARCH ──────────────────────────────
# The build itself is delegated: cibuildmp invokes this project's own
# natmod/Makefile (which includes py/dynruntime.mk and takes ARCH=/MPY_DIR=).
# What cibuildmp owns is everything around it — fetching MicroPython,
# building mpy-cross, resolving the cross toolchain per arch, installing
# mpy_ld.py's host deps, and collecting the outputs.
[natmod]
archs = ["x64", "x86", "armv6m", "armv7m", "armv7emsp", "armv7emdp",
         "rv32imc", "rv64imc", "xtensa", "xtensawin"]

# No aarch64: dynruntime.mk has no ARCH=aarch64 branch at all as of
# MicroPython v1.28, so natmod cannot target it. Cover it via usermod.

module-dir = "natmod"       # directory containing the Makefile.
                            # a7p passes "micropython/natmod".
make-target = "dist"
extra-make-args = []

# Optional shell command run once inside module-dir, after mpy-cross is
# built and before the make target — e.g. a7p's `make fetch-nanopb`, which
# vendors a dependency the natmod Makefile needs for every ARCH.
pre-build-command = ""

# ── Overrides ─────────────────────────────────────────────────────────────
# One mechanism, cibuildwheel-shaped: a list of tables, each with a `select`
# glob over the same identifier the build/skip selectors use. First match
# wins per option. Everything settable above is settable here.
#
# The example below is real: bclibc's natmod/Makefile already derives
# MP_BCLIBC_PRECISION from ARCH on its own, so this override is redundant
# there — it is written out to show the mechanism, and to show where a
# project-level define belongs (here, not in the identifier).
[[overrides]]
select = "*-armv7emsp"
extra-make-args = ["MP_BCLIBC_PRECISION=single"]

# usermod itself is fully implemented -- this repo's own cibuildmp.toml
# just doesn't build a usermod module, so nothing above uses it. A real,
# live usermod config -- [unix]/[windows]/[qemu]/[webassembly]/[esp32],
# each its own top-level table sibling to [natmod] above (Phase F, record
# 0051 points 4/6), e.g.:
#
#     [unix]
#     archs = ["x64", "x86", "aarch64", "armhf", "mipsel"]
#
#     [esp32.ESP32_GENERIC]
#
# -- is examples/template/cibuildmp.toml, not sketched here. `esp32`'s own
# boards are tree-node presence now, not a `boards = [...]` list (record
# 0052, Track B, B4.2) -- one `[esp32.<BOARD_NAME>]` table per board.
# ("rp2040" was never a real port -- targets.py's own KNOWN_PORTS has no
# such name; esp32 above is the closest board-axis port that exists.)
#
# ── Not implemented yet ───────────────────────────────────────────────────
# Sketched here so the intended shape is on record, but genuinely NOT
# parsed by cibuildmp today -- unlike the real, working keys just above,
# nothing below has a config surface at all yet. Do not rely on any of it.
# See docs/BACKLOG.md.
#
#     [webassembly]
#     variant = "pyscript"     # standard's ASYNCIFY is broken on modern
#                               # emsdk -- WebassemblyBuildOptions has a
#                               # variant field with this exact default,
#                               # but no config key reads into it yet
#
#     [esp32]
#     idf-target = "esp32"     # chip family, deliberately separate from
#                               # board, but not a real key either
#     idf-ver = "v5.5.1"
#
# tests (D6) — deferred outright. The axis is an explicit runner
# (native / qemu-user / qemu-system / node / rp2040py / mpremote / none),
# not a bare command string, because these substrates differ in more than
# what they invoke.
#
#     [test]
#     runner = "qemu-system"
#     command = "python3 -m ci.run_tests {build_dir}"
