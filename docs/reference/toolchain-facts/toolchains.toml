# The per-tag, per-port compiler-toolchain fact table -- what MicroPython
# itself builds each tag with, and which compiler versions each tag is
# known not to build with at all.
#
# Generated, never hand-written:
#
#     bin/refresh_toolchains.py --repo <micropython clone> --resolve-apt \
#         > src/cibuildmp/resources/toolchains.toml   # then re-add this header
#
# Nothing loads this yet -- it is the evidence behind a toolchain choice
# (which `gcc-toolset`/tarball version an image can carry without dropping
# a supported tag), not an input `resources.py` resolves against. That is
# the same order `pinned_docker_images.toml` came in: table first, then a
# consumer.
#
# Every row is read out of a real tag's own build machinery. Port
# `README.md` prose is deliberately not a source: `ports/nrf/README.md`
# still recommends a 7.2.1/4Q17-era toolchain at v1.30.0-preview,
# `docs/develop/gettingstarted.rst` still prints a gcc 9.3.0 transcript on
# every tag since v1.20.0, and `ports/psoc-edge/README.md`'s "minimum
# required version is 14.2.1" is enforced by no build step. A claim
# nothing executes goes stale silently (record 0077's own subject).
#
# `kind` says which machine-readable source the row came from:
#
#   guard-error   a port's makefile stops the build on the compiler's own
#                 reported version -- `ports/stm32/stm32.mk`'s `$(error
#                 ... upgrade to GCC 14.3+ ...)` under MCU_SERIES=n6.
#                 `value` is the threshold.
#   guard-branch  same question, different consumer: flags change instead
#                 of the build stopping (`ports/qemu/Makefile` picks
#                 `rv32imac` over `rv32imac_zicsr` at gcc <= 10), which is
#                 why a too-old RISC-V gcc miscompiles rather than complains.
#   ci-runner     the `runs-on:` image of that port's own workflow.
#                 `pinned = false` means `ubuntu-latest`, which fixes no
#                 version -- left unresolved rather than guessed from the
#                 tag's date, since which image that label meant on a given
#                 day is GitHub's fact, not MicroPython's.
#   ci-apt        a compiler package `tools/ci.sh` installs for that port,
#                 followed through the real call chain
#                 (`ci_stm32_setup>ci_gcc_arm_setup`).
#   ci-tarball    a pinned toolchain tarball instead of a distro package --
#                 e.g. from v1.27.0 stm32 stops using apt and fetches Arm
#                 GNU 14.3.rel1, because the Cortex-M55 guard above rejects
#                 jammy's gcc 10.
#   ci-idf        esp32's ESP-IDF pin (which in turn pins its own
#                 xtensa/riscv gcc). Three shapes across the range, all
#                 parsed: `ci_esp32_setup_helper v4.0.2`, a literal
#                 `IDF_VER=v5.2.2`, and the v1.28.0+ workflow `env:` block's
#                 supported range (`IDF_OLDEST_VER`/`IDF_NEWEST_VER`).
#   apt-resolved  the number behind a ci-apt row: what that suite really
#                 publishes, asked of Launchpad. `value` is the major
#                 version, `detail` the full package version with its
#                 Debian epoch (`15:10.3-2021.07-4` is gcc 10, not 15).
#   breaks-with   the ceiling, from git ancestry rather than any file: an
#                 upstream commit that exists because a compiler got
#                 stricter, and this tag does not contain it. `source`
#                 names the commit and the tag that first shipped it.
#
# Cross-checked against record 0082, which reached the same boundary the
# other way round: 0082 bisected it by actually running `make -C
# mpy-cross` inside `docker/natmod_host.Dockerfile` (gcc 15.2.0) per tag
# and found v1.25.0 FAIL / v1.26.0 OK; this table derives v1.26.0 from
# upstream's own fix commits without building anything. Two independent
# methods, one answer -- which is the reason to trust the rows here that
# nobody has built, not just the ones somebody has.
#
# The three findings that decide an image's compiler, in short: nothing
# before v1.26.0 builds with gcc >= 15.1 (`-Wunterminated-string-literal`
# on py/emitinlinethumb.c, extmod/moductypes.c and lib/littlefs -- which
# includes every natmod build, since mpy-cross is a host build); stm32's
# n6 boards need gcc >= 14.3 from v1.26.0 on; and mimxrt before v1.21.0
# does not build with gcc >= 13.
#
[toolchains]
requirements = [
    { tag = "v1.12", scope = "any", tool = "runner-image", kind = "ci-runner", value = "travis:xenial", pinned = true, source = ".travis.yml" },
