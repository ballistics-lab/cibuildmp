[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "cibuildmp"
authors = [{ name = "o-murphy", email = "thehelixpg@gmail.com" }]
description = "Build MicroPython native C extensions for every target, from one config — cibuildwheel for MicroPython"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "micropython",
    "natmod",
    "usermod",
    "mpy",
    "cross-compile",
    "ci",
    "build",
    "embedded",
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Environment :: Console",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Embedded Systems",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]
# Standard library otherwise, deliberately: a build tool that has to resolve
# its own dependency tree before it can fetch anything is harder to trust,
# and `wget` not being everywhere is the exact class of problem this
# replaces. pyelftools is the one exception ([0012]): it is pure Python and
# it is what tools/mpy_ld.py itself needs to link a native .mpy.
#
# `ar` used to sit here beside it and was removed 2026-08-28 -- see [0012]'s
# own addendum. MicroPython imports no such module at any tag natmod
# supports (v1.12 through v1.28.0, checked by `grep` against real
# checkouts): `tools/ar_util.py` uses only `os`/`re`/`hashlib`/`functools`/
# `pickle`/`collections` plus `elftools.elf.elffile`. The PyPI package was
# never a dependency of anything.
dependencies = [
    "pyelftools>=0.29",
]
dynamic = ["version"]

[project.scripts]
cibuildmp = "cibuildmp:main"

[project.urls]
"Homepage" = "https://github.com/ballistics-lab/cibuildmp"
"Bug Reports" = "https://github.com/ballistics-lab/cibuildmp/issues"
"Source" = "https://github.com/ballistics-lab/cibuildmp"
"Changelog" = "https://github.com/ballistics-lab/cibuildmp/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cibuildmp*"]

# Explicit rather than relying on include-package-data: resources/natmod.toml
# holds every pinned toolchain URL, checksum and arch table, so a wheel that
# silently omits it is a wheel that fails at import.
#
# The per-port Dockerfiles used to ship here too (resources/docker/*, D28),
# back when an installed cibuildmp with no image registered would build one
# itself from a vendored copy. No longer: the user's own call -- cibuildmp
# should behave like cibuildwheel's own container runtime (oci_container.py),
# which never builds an image at all, only ever pulls an already-published,
# pinned one. Building is now a repo-only, CI-only concern
# (docker/*.Dockerfile at the repo root, published by
# publish-docker-images.yml, mirroring pypa/manylinux's own top-level
# docker/ -- that repo has no pyproject.toml either, since it is pure
# image-building infrastructure, never something `pip install`s), so
# nothing under docker/ needs to ship inside the wheel any more.
[tool.setuptools.package-data]
cibuildmp = ["resources/*.toml"]

[tool.setuptools_scm]
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
