name: cibuildmp matrix
description: >
  Resolves a cibuildmp.toml into a GitHub Actions matrix -- one {only, os}
  entry per build target -- for a job-per-target CI layout.

  Optional. The default cibuildmp layout is one job that loops over every
  selected target (see D9 in docs/BACKLOG.md), which is cheaper for natmod:
  all ten arches cross-compile on the same runner, so fanning out pays for
  fetching MicroPython and building mpy-cross once per leg instead of once
  in total. Use this action when you specifically want per-target failure
  isolation or wall-clock parallelism -- or, later, when usermod targets
  genuinely need different runners, which is the case this exists for.

  Needs no MicroPython checkout and no toolchain: resolving a config is pure
  computation, so this runs in seconds on a plain runner.

inputs:
  package-dir:
    description: 'Directory containing the config, defaults to "."'
    required: false
    default: .
  config-file:
    description: "File containing the config, defaults to {package-dir}/cibuildmp.toml"
    required: false
    default: ""

outputs:
  include:
    description: >
      JSON array of {only, os} objects, e.g.
      [{"only":"mpy6.3-natmod-x64","os":"ubuntu-latest"}]. In the consuming
      workflow, feed it to a matrix `include:` via
      fromJSON(needs.<job>.outputs.include), pass matrix.only to the
      cibuildmp action's `only` input, and matrix.os to the job's
      `runs-on` -- see .github/workflows/build-examples.yml for a real
      caller, written with the expression delimiters this description
      cannot contain. Carrying the runner in the matrix entry is what lets a
      target choose its own runner at all: a composite action cannot set
      `runs-on` for the job that calls it.

      Deliberately written without expression delimiters. GitHub evaluates
      them inside action.yml metadata too, not just in workflow steps, so
      an example here is parsed as a real expression -- and
      `needs` is not a valid named value in a composite action's context.
      This action shipped with such an example in its own description and
      failed to load the first time anything called it (it had none from
      D20 until build-examples.yml fanned out), with
      "Unrecognized named-value: 'needs'" pointing at this very line.
    value: ${{ steps.resolve.outputs.include }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        python-version: "3.14"

    - id: resolve
      shell: bash
      run: |
        set -euo pipefail

        # This action lives at .github/actions/cibuildmp-matrix/ inside the
        # cibuildmp repo, so the package root is three levels up from
        # github.action_path. Resolved rather than passed through with ../
        # so uv sees a clean path. Once the package has a released name this
        # becomes a plain `uv tool install cibuildmp==<version>` (D8).
        REPO_ROOT=$(cd "${{ github.action_path }}/../../.." && pwd)
        uv tool install "$REPO_ROOT"

        ARGS=("${{ inputs.package-dir }}" --print-build-matrix)
        if [ -n "${{ inputs.config-file }}" ]; then
          ARGS+=(--config-file "${{ inputs.config-file }}")
        fi

        INCLUDE=$(cibuildmp "${ARGS[@]}")
        echo "include=$INCLUDE" >> "$GITHUB_OUTPUT"

        echo "$INCLUDE" | python3 -c '
        import json, sys
        entries = json.load(sys.stdin)
        print(f"Resolved {len(entries)} target(s):")
        for entry in entries:
            print(f"  {entry[\"only\"]:<32} runs-on: {entry[\"os\"]}")
        '
