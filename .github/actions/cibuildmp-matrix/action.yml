name: cibuildmp matrix
description: >
  Resolves a cibuildmp.toml into a GitHub Actions matrix -- one {only, os}
  entry per build target -- for a job-per-target CI layout.

  Optional. The default cibuildmp layout is one job that loops over every
  selected target (see D9 in docs/BACKLOG.md), which is cheaper for natmod:
  all ten arches cross-compile on the same runner, so fanning out pays for
  fetching MicroPython and building mpy-cross once per leg instead of once
  in total. Use this action when you specifically want per-target failure
  isolation or wall-clock parallelism -- or, later, when usermod targets
  genuinely need different runners, which is the case this exists for.

  Needs no MicroPython checkout and no toolchain: resolving a config is pure
  computation, so this runs in seconds on a plain runner.

inputs:
  package-dir:
    description: 'Directory containing the config, defaults to "."'
    required: false
    default: .
  config-file:
    description: "File containing the config, defaults to {package-dir}/cibuildmp.toml"
    required: false
    default: ""
  only:
    description: >
      Newline- or comma-separated build identifiers to resolve *instead of*
      the config's own selection. Each one goes through cibuildmp's own
      --only, which overrides the config's build/skip selectors and its
      per-port axis alike, so this reaches targets a cibuildmp.toml does not
      select -- the opt-in half of a matrix, without a second config file or
      a second copy of the axis in YAML.

      The point of routing it through the tool rather than writing the
      entries by hand is the runner. Each entry's `os` comes from
      UsermodTarget.default_runner, which is arch-aware since records
      0043/0044 -- an aarch64 or armv7l cell names an arm64 runner and
      builds natively instead of emulated. Hardcoding {only, os} pairs in a
      workflow would copy that decision into a second place and let it drift
      the first time a floor or an arch moves.

      Unknown identifiers are an error from cibuildmp itself, not a silently
      empty matrix.
    required: false
    default: ""

outputs:
  include:
    description: >
      JSON array of {only, os} objects, e.g.
      [{"only":"mpy6.3-natmod-x64","os":"ubuntu-latest"}]. In the consuming
      workflow, feed it to a matrix `include:` via
      fromJSON(needs.<job>.outputs.include), pass matrix.only to the
      cibuildmp action's `only` input, and matrix.os to the job's
      `runs-on` -- see .github/workflows/build-examples.yml for a real
      caller, written with the expression delimiters this description
      cannot contain. Carrying the runner in the matrix entry is what lets a
      target choose its own runner at all: a composite action cannot set
      `runs-on` for the job that calls it.

      Deliberately written without expression delimiters. GitHub evaluates
      them inside action.yml metadata too, not just in workflow steps, so
      an example here is parsed as a real expression -- and
      `needs` is not a valid named value in a composite action's context.
      This action shipped with such an example in its own description and
      failed to load the first time anything called it (it had none from
      D20 until build-examples.yml fanned out), with
      "Unrecognized named-value: 'needs'" pointing at this very line.
    value: ${{ steps.resolve.outputs.include }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        python-version: "3.14"

    - id: resolve
      shell: bash
      # Inputs reach the script through `env:`, never interpolated into
      # the body -- the pattern the root action.yml already uses and
      # documents ("Confirmed against pypa/cibuildwheel's own real
      # action.yml, which does exactly this"), and which this action
      # skipped. That omission cost three failed runs in a row the first
      # time anything called it, all of them templating rather than logic:
      #
      #   1. an expression-delimiter example inside the `include` output's
      #      own description -- metadata is templated too, and `needs` is
      #      not a valid named value in a composite action's context;
      #   2. `python3 -c '...'` with hand-escaped double quotes, which a
      #      single-quoted shell string passes through verbatim, so Python
      #      saw a backslash inside an f-string expression;
      #   3. a comment *explaining* (1), written with the delimiters in it
      #      -- a `run:` block is one template string, comments included.
      #
      # All three are structural, and this shape removes them rather than
      # dodging them. Inputs live in `env:`, so the only expressions in
      # this file sit where the templating engine is meant to see them. The
      # heredoc delimiter is quoted (`<< "PY"`), so the shell expands
      # nothing inside it and Python's own quoting -- single quotes in
      # f-strings included -- needs no escaping at all. It is also the
      # standard mitigation for script injection: an input interpolated
      # into a shell body is executable, an input read from `os.environ` is
      # a string.
      env:
        ACTION_PATH: ${{ github.action_path }}
        ACTION_PACKAGE_DIR: ${{ inputs.package-dir }}
        ACTION_CONFIG_FILE: ${{ inputs.config-file }}
        ACTION_ONLY: ${{ inputs.only }}
      run: |
        set -euo pipefail

        # This action lives at .github/actions/cibuildmp-matrix/ inside the
        # cibuildmp repo, so the package root is three levels up. Resolved
        # rather than passed through with ../ so uv sees a clean path. Once
        # the package has a released name this becomes a plain
        # `uv tool install cibuildmp==<version>` (D8).
        REPO_ROOT=$(cd "$ACTION_PATH/../../.." && pwd)
        uv tool install "$REPO_ROOT"

        python3 -u << "PY"
        import json
        import os
        import subprocess

        args = [os.environ["ACTION_PACKAGE_DIR"], "--print-build-matrix"]
        if config_file := os.environ.get("ACTION_CONFIG_FILE"):
            args += ["--config-file", config_file]


        def resolve(extra=()):
            out = subprocess.run(
                ["cibuildmp", *args, *extra],
                check=True,
                capture_output=True,
                text=True,
            )
            return json.loads(out.stdout.strip())


        # One invocation per identifier, because --only takes exactly one.
        # Concatenated in the order given rather than merged with the
        # config's own selection: when `only` is set it *replaces* the
        # selection, so a caller asking for four opt-in cells gets four
        # legs, not four plus the defaults it did not ask for.
        raw = os.environ.get("ACTION_ONLY", "")
        wanted = [part.strip() for part in raw.replace(",", "\n").split("\n")]
        wanted = [part for part in wanted if part]

        if wanted:
            entries = [entry for one in wanted for entry in resolve(["--only", one])]
        else:
            entries = resolve()
        include = json.dumps(entries)
        print(f"Resolved {len(entries)} target(s):")
        for entry in entries:
            print(f"  {entry['only']:<34} runs-on: {entry['os']}")

        with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
            handle.write(f"include={include}\n")
        PY
