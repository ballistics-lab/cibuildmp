version: 2
updates:
  # Dependabot's github-actions ecosystem only scans one directory's worth
  # of `uses:` references per entry -- it does not recurse into
  # subdirectories on its own. `directories:` (plural, glob-capable) is the
  # one entry that covers the root workflow files and every composite
  # action's own subdirectory at once, so a newly added `.github/actions/*`
  # folder is picked up automatically instead of needing its own entry
  # here too. None of today's composite actions have a `uses:` step
  # (they're pure `run:` shell), so this has nothing to bump yet; it's here
  # so a future `uses:` step (or a `.github/workflows/*.yml` this repo
  # doesn't have today) gets picked up automatically instead of silently
  # going stale.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    # Without this, `directories:` still opens one PR per directory/
    # dependency combination -- the same fan-out the old five-entry file
    # already had, just re-introduced one level down instead of fixed.
    # One group across every directory this entry scans means one bump
    # lands as one PR regardless of how many `uses:` pins moved or which
    # of the covered directories they were in.
    groups:
      github-actions:
        patterns:
          - "*"

  # [0046]'s own gap ("nothing notices when a pin goes stale, except
  # container images") for the pypa half of it: five of the fifteen `unix`
  # Dockerfiles already carry a real, digest-pinned `FROM
  # quay.io/pypa/...@sha256:...` and get scanned here for free.
  # `docker/pypa-tracker.Dockerfile` is not a build step -- it exists so
  # the other nine `unix` cells, which have no Dockerfile of their own
  # (record 0044/0058: bare `FROM` and nothing else, so publishing a
  # cibuildmp copy would be pure overhead), still have something with a
  # `FROM` line for this scan to read. A PR here bumps that tracker file's
  # own digest, not `resources/pinned_pypa_images.toml` -- moving the real
  # pin stays `bin/update_docker.py --pypa`'s own reviewed job (record
  # 0033), since a new base can mean a new libc floor, not just routine
  # hygiene.
  #
  # `ubuntu:24.04` was assumed out of scope here -- a floating tag, and
  # Dependabot's docker ecosystem "has nothing to compare a floating tag
  # against" was this comment's own reasoning until 2026-08-29. Wrong:
  # Dependabot proposed `ubuntu:24.04` -> `26.04` in its very first grouped
  # bump (PR #16), and CI caught the reason this needed a human first --
  # the mipsel Dockerfile's apt-based cross-toolchain doesn't exist on
  # 26.04's archive at all (Debian dropped the mipsel port in Trixie).
  # See docs/records/0068 for the full incident. That file is
  # `docker/manylinux_2_41_mipsel.Dockerfile` now, and no longer apt-based
  # at all -- its toolchain is a pinned Bootlin tarball, which is what
  # closed this particular hole. The reasoning above stands regardless:
  # `ubuntu` stays out of the group because a base-OS major bump is not
  # routine hygiene, not because of this one arch.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    # Six of the Dockerfiles under here pin a real digest (five
    # `manylinux_2_28_*` arches + `pypa-tracker`), each under a differently
    # named `quay.io/pypa/...` image -- to Dependabot that's six distinct
    # dependencies, so without a group a single upstream pypa bump opened
    # six separate PRs instead of landing as one. Same fix as the
    # github-actions entry above: one group, one PR per scan regardless of
    # how many of the pinned images moved.
    #
    # `ubuntu` is deliberately excluded from that group (record 0068): a
    # base-OS major-version bump is not routine hygiene the way a same-name
    # pypa digest republish is, and grouping the two together is exactly
    # what let a real break (see above) ride in on the back of nine safe
    # bumps in one PR with no way to accept one without the other. Excluded
    # from the group, not ignored outright -- `ubuntu` still gets its own
    # PR (one, since every Dockerfile referencing it collapses onto the one
    # dependency name already), just never sharing one with pypa's own.
    groups:
      docker-images:
        patterns:
          - "*"
        exclude-patterns:
          - "ubuntu"
