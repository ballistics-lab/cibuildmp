name: Build template

# cibuildmp's own integration test: examples/template is a real, minimal
# natmod module, built here with this repo's own root action.yml -- the
# same `uses:` a consumer like bclibc or a7p would write. Green here means
# the actual build path (M3: make, collect, verify) works end to end, not
# just that --dry-run prints a plausible plan.

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # x86 cannot self-provision (docs/BACKLOG.md M2): the host gcc is
      # always there but ubuntu-latest ships no 32-bit glibc headers/libs
      # by default. Same package .github/actions/build-natmod's own "Install
      # cross-compiler" step already apt-installs for ARCH=x86 -- this repo
      # just doesn't go through that action here, so it needs its own copy.
      - run: sudo apt-get update -q && sudo apt-get install -y gcc-multilib

      - uses: ./
        with:
          package-dir: examples/template

      - name: List built artifacts
        run: ls -la examples/template/mpyhouse
