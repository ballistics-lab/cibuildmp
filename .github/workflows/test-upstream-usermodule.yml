name: Test upstream usercmodule

# Builds MicroPython's own `examples/usercmodule/` (cexample, cppexample,
# subpackage) through cibuildmp's real usermod path -- docs/records/0054
# scoped why this fixture matters (it tests upstream's own module contract,
# not one this project wrote for itself); docs/records/0069 is the mechanism
# actually landed here and explains every choice below in full.
#
# Six jobs, one per port cibuildmp drives a usermod build for -- widened
# from the original narrow unix+rp2 slice ([0054]'s own "one Make port and
# one CMake port is enough to answer the three questions above") once that
# slice came back green, per [0054]'s own "widen only if it finds
# something." Still nowhere near build-examples.yml's much broader
# examples/template matrix: one representative identifier per port, not
# each port's own full arch/board matrix.
#
# No job here sets `CIBMP_USER_C_MODULES`/`CIBMP_EXTRA_MAKE_ARGS`/
# `CIBMP_EXTRA_CMAKE_ARGS`, and none of them ever resolves the pinned
# checkout itself. Both used to be true: every job called
# `sources.fetch_micropython()` directly, in its own pre-fetch step, then
# exported the real checkout path by hand -- necessary back when this
# project had no way to name "a path inside whatever checkout cibuildmp
# itself is about to fetch" from outside cibuildmp, and no way to say "this
# one identifier needs this one extra flag" from inside a config file
# meant to be shared by all six. `examples/usercmodule/cibuildmp.toml` now
# carries all of it -- no `user-c-modules =` at all any more, for any
# port: the built-in "." default is already right on both sides once
# each side has its own real entry point (`micropython.cmake` for the two
# CMake ports, `{cexample,cppexample,subpackage}/micropython.mk` for the
# four Make ports -- see that toml's own header comment), plus
# `[override."*-wasm32"]`'s own `extra-make-args` -- so a bare
# `cibuildmp examples/usercmodule --build <identifier>` run, CI or local,
# resolves identically to what a job here does. `build` stays out of that
# file on purpose (see its own header comment): each job below still wants
# exactly one identifier per push, not this fixture's full six-port sweep,
# and that is the one thing a shared config file cannot express per-job.
#
# An even leaner shape was tried before any of this and reverted: pin
# `CIBMP_CACHE_PATH` to a fixed, known directory so the checkout's
# eventual path becomes computable without fetching it at all. That broke
# the workflow file outright, twice, for a GitHub Actions job-level-`env:`
# scoping rule this session could not conclusively pin down live -- see
# docs/records/0069 for the full account, kept for whoever revisits it
# rather than guessed away.
#
# push: (no branches: filter), same reasoning build-examples.yml's own header
# already documents -- this needs to run on every push to a dev branch too.

on:
  push:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: test-upstream-usermodule-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for every job below -- bump here, not six
  # times, when this fixture moves to a newer tag.
  CIBMP_UPSTREAM_TAG: v1.29.0

jobs:
  # ── unix: the Make side ─────────────────────────────────────────────
  #
  # py/py.mk's own `<USER_C_MODULES>/*/micropython.mk` glob finds
  # `examples/usercmodule/{cexample,cppexample,subpackage}/micropython.mk`
  # -- this fixture's own thin wrappers, each `include`ing upstream's real
  # file via `$(TOP)` (see `cexample/micropython.mk`'s own header comment)
  # -- with `user-c-modules` at its built-in "." default, no override
  # needed. Never vendored (0054): the real content still comes from the
  # pinned checkout, only three one-line `include` shims live in this repo.
  build-unix:
    runs-on: ubuntu-latest
    env:
      CIBMP_VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@v7

      - name: Build upstream examples/usercmodule (unix, native)
        uses: ./
        with:
          package-dir: examples/usercmodule
          build: ${{ env.CIBMP_UPSTREAM_TAG }}-manylinux_2_28_x86_64

      - name: List built artifacts
        run: ls -laR examples/usercmodule/mpyhouse

      # A linked binary is not the same claim as one whose modules actually
      # run -- unix is the one port here whose own output this runner can
      # simply execute (a real manylinux_2_28 binary runs unmodified on a
      # newer-glibc host, the whole point of the manylinux floor), unlike
      # rp2's own firmware.uf2, which needs real hardware. See
      # smoke_test.py's own header for what it actually exercises.
      - name: "Smoke test (unix): run the built binary against smoke_test.py"
        run: |
          set -euo pipefail
          identifier="${CIBMP_UPSTREAM_TAG}-manylinux_2_28_x86_64"
          bin="examples/usercmodule/mpyhouse/${identifier}/micropython-${identifier}"
          "$bin" examples/usercmodule/smoke_test.py

  # ── rp2: the CMake side ──────────────────────────────────────────────
  #
  # Chosen over esp32 purely on cost -- usermod/build_rp2.py's own docstring:
  # the Pico SDK arrives as `lib/` submodules of the MicroPython checkout
  # itself, no separate host-side toolchain resolver the way esp32's
  # ESP-IDF needs. Nothing here is rp2-specific; widening to esp32/windows/
  # webassembly/qemu is exactly [0054]'s own "widen only if it finds
  # something" (docs/records/0069).
  #
  # This is also the leg that actually answers [0054]'s biggest open
  # question for one real toolchain: whether cppexample's `-lstdc++` is
  # satisfiable on a bare-metal cross target. Deliberately not skipped --
  # a red leg here is a real finding to record, not a bug in this workflow.
  #
  # examples/usercmodule/micropython.cmake resolves the pinned checkout
  # itself, via MICROPY_DIR -- a CMake variable every CMake port already
  # sets before it ever include()s a user module (rp2/CMakeLists.txt's own
  # `get_filename_component(MICROPY_DIR "../.." ABSOLUTE)`, well before its
  # own `include(${MICROPY_DIR}/py/usermod.cmake)`) -- with `user-c-modules`
  # at its built-in "." default, same as every other port here now.
  build-rp2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CIBMP_VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4

      - name: Build upstream examples/usercmodule (rp2)
        uses: ./
        with:
          package-dir: examples/usercmodule
          build: ${{ env.CIBMP_UPSTREAM_TAG }}-rp2-RPI_PICO

      - name: List built artifacts
        run: ls -laR examples/usercmodule/mpyhouse

  # ── esp32: the second CMake port, and the second bare-metal toolchain ──
  #
  # [0054]'s own list of unanswered families after [0069]: esp32 is the
  # ESP-IDF one -- a cmake-driven port like rp2, but a materially different
  # toolchain (Xtensa/RISC-V via idf.py, not arm-none-eabi via the Pico
  # SDK). Fully containerized since [0028] (no host-side ESP-IDF resolver
  # left).
  #
  # Same MICROPY_DIR mechanism as build-rp2 above: MICROPY_DIR is set at
  # the very top of ports/esp32/main/CMakeLists.txt
  # (`if(NOT MICROPY_DIR) get_filename_component(...)`), well before it --
  # via ports/esp32/CMakeLists.txt -- reaches `include(${MICROPY_DIR}/py/
  # usermod.cmake)`.
  build-esp32:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CIBMP_VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4

      - name: Build upstream examples/usercmodule (esp32)
        uses: ./
        with:
          package-dir: examples/usercmodule
          build: ${{ env.CIBMP_UPSTREAM_TAG }}-esp32-ESP32_GENERIC

      - name: List built artifacts
        run: ls -laR examples/usercmodule/mpyhouse

  # ── windows, webassembly, qemu: the remaining three Make ports ──────────
  #
  # Same mechanism as build-unix above (the same three wrapper files,
  # already discovered by py.mk's own glob), one representative identifier
  # per port rather than each port's own full arch matrix -- [0054]'s own
  # "widen only if it finds something", not a cost-blind repeat of
  # build-examples.yml's broader coverage. No smoke test for `windows` or
  # `qemu`: a .exe needs wine and a qemu ELF needs qemu-system-arm, neither
  # of which this runner has without a setup step (record 0069's own
  # reasoning for why rp2 has none either -- its .uf2 needs hardware or a
  # board emulator).
  #
  # `webassembly` was on that list too, and should not have been: node is
  # preinstalled here, and its own smoke step now runs below. Record 0079
  # is what that omission cost -- a collected artifact missing more than
  # half its bytes, green in CI for as long as nothing ran it.
  build-windows:
    runs-on: ubuntu-latest
    env:
      CIBMP_VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@v7

      - name: Build upstream examples/usercmodule (windows)
        uses: ./
        with:
          package-dir: examples/usercmodule
          build: ${{ env.CIBMP_UPSTREAM_TAG }}-win_amd64

      - name: List built artifacts
        run: ls -laR examples/usercmodule/mpyhouse

  # `examples/usercmodule/cibuildmp.toml`'s own `[override."*-wasm32"]`
  # carries this identifier's own `extra-make-args` (CXX=em++ plus the
  # CXXFLAGS_MOD fix for two real, separate upstream ports/webassembly/
  # Makefile bugs -- see that file's own comment for both). Nothing
  # webassembly-specific is set here any more.
  build-webassembly:
    runs-on: ubuntu-latest
    env:
      CIBMP_VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@v7

      - name: Build upstream examples/usercmodule (webassembly)
        uses: ./
        with:
          package-dir: examples/usercmodule
          build: ${{ env.CIBMP_UPSTREAM_TAG }}-wasm32

      - name: List built artifacts
        run: ls -laR examples/usercmodule/mpyhouse

      # The same smoke_test.py the unix job runs, unmodified -- the wasm
      # build's own CLI takes a .py path exactly like the unix binary
      # does. `node` is preinstalled on ubuntu-latest, and every consuming
      # repo already runs its own wasm tests this way, so this needs no
      # setup step of its own.
      #
      # This job used to stop at `ls`, on the premise (this file's own
      # earlier comment) that "none of their outputs (a .exe, a .wasm, a
      # qemu ELF) runs directly on this runner the way unix's manylinux
      # binary does". For .wasm that was simply wrong, and it is the
      # reason record 0079's bug lived as long as it did: the collected
      # artifact was missing `micropython.wasm` entirely, and nothing
      # anywhere ran the collected artifact to find out. It runs from
      # `mpyhouse/` deliberately -- executing it from the port's own build
      # directory is what hid the same class of bug for `unix` until
      # record 0070.
      - name: "Smoke test (webassembly): run the built .mjs against smoke_test.py"
        run: |
          set -euo pipefail
          identifier="${CIBMP_UPSTREAM_TAG}-wasm32"
          mjs="examples/usercmodule/mpyhouse/${identifier}/micropython-${identifier}.mjs"
          node "$mjs" examples/usercmodule/smoke_test.py

  build-qemu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CIBMP_VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4

      - name: Build upstream examples/usercmodule (qemu)
        uses: ./
        with:
          package-dir: examples/usercmodule
          build: ${{ env.CIBMP_UPSTREAM_TAG }}-qemu-MPS2_AN385

      - name: List built artifacts
        run: ls -laR examples/usercmodule/mpyhouse
