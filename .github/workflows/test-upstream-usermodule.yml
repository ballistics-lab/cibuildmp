name: Test upstream usercmodule

# Builds MicroPython's own `examples/usercmodule/` (cexample, cppexample,
# subpackage) through cibuildmp's real usermod path -- docs/records/0054
# scoped why this fixture matters (it tests upstream's own module contract,
# not one this project wrote for itself); docs/records/0069 is the mechanism
# actually landed here and explains every choice below in full.
#
# Six jobs, one per port cibuildmp drives a usermod build for -- widened
# from the original narrow unix+rp2 slice ([0054]'s own "one Make port and
# one CMake port is enough to answer the three questions above") once that
# slice came back green, per [0054]'s own "widen only if it finds
# something." Still nowhere near build-examples.yml's much broader
# examples/template matrix: one representative identifier per port, not
# each port's own full arch/board matrix.
#
# No job here resolves the pinned checkout itself any more. It used to:
# every job called `sources.fetch_micropython()` directly, in its own
# pre-fetch step, so the real checkout path could be threaded into
# `CIBMP_USER_C_MODULES`/`CIBMP_EXTRA_CMAKE_ARGS` by hand -- necessary back
# when this project had no way to name "a path inside whatever checkout
# cibuildmp itself is about to fetch" from outside cibuildmp. Two
# mechanisms replaced that, both landing after the original narrow
# unix+rp2 slice came back green (per [0054]'s own "widen only if it finds
# something"):
#
#   - The two CMake ports (build-rp2/build-esp32) read `MICROPY_DIR`
#     directly inside `examples/usercmodule/micropython.cmake` -- every
#     CMake port already sets that variable before it `include()`s a user
#     module at all, so no external input is needed.
#   - The four Make ports (build-unix/build-windows/build-webassembly/
#     build-qemu) set `CIBMP_USER_C_MODULES="{micropython}/examples/
#     usercmodule"` literally; cibuildmp's own `orchestrate.py`
#     (`_port_build_options()`) substitutes `{micropython}` with the real,
#     already-fetched checkout itself, before anything reaches Docker or a
#     bind mount -- see that function's own comment and docs/records/0069's
#     own addendum for why this had to be cibuildmp's own job rather than
#     something the CMake-side `$(TOP)`/`MICROPY_DIR` trick could cover:
#     a Make port's `USER_C_MODULES` is also bind-mounted as a real host
#     `Path` (`usermod_mounts()`), not just forwarded as a `make` variable,
#     so it has to already be a real path by the time cibuildmp gets there
#     -- which `{micropython}` now guarantees, uniformly, before either
#     port family's own build machinery ever runs.
#
# An even leaner shape was tried before either of these and reverted: pin
# `CIBMP_CACHE_PATH` to a fixed, known directory so the checkout's
# eventual path becomes computable without fetching it at all. That broke
# the workflow file outright, twice, for a GitHub Actions job-level-`env:`
# scoping rule this session could not conclusively pin down live -- see
# docs/records/0069 for the full account, kept for whoever revisits it
# rather than guessed away.
#
# push: (no branches: filter), same reasoning build-examples.yml's own header
# already documents -- this needs to run on every push to a dev branch too.

on:
  push:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: test-upstream-usermodule-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for both jobs below -- bump here, not in two
  # places, when this fixture moves to a newer tag.
  CIBMP_UPSTREAM_TAG: v1.29.0

jobs:
  # ── unix: the Make side ─────────────────────────────────────────────
  #
  # py/py.mk's own `<USER_C_MODULES>/*/micropython.mk` glob finds all three
  # of upstream's own subdirectories with nothing extra to arrange -- no
  # wrapper file needed on this side (see examples/usercmodule/
  # micropython.cmake's own header comment for why the CMake side below
  # needs one). USER_C_MODULES points straight at the pinned checkout's own
  # examples/usercmodule/, never copied into this repo (0054: no vendoring).
  build-unix:
    runs-on: ubuntu-latest
    env:
      CIBMP_VERSION: 0.0.0-ci
      # {micropython} -- cibuildmp's own placeholder (orchestrate.py's
      # _port_build_options(), record 0069's own addendum), substituted
      # internally with the pinned checkout it already fetches before
      # ever reaching Docker/mount. No pre-fetch step needed here any
      # more: cibuildmp resolves this itself, the same way build-rp2/
      # build-esp32 resolve MICROPY_DIR on the CMake side.
      CIBMP_USER_C_MODULES: "{micropython}/examples/usercmodule"
    steps:
      - uses: actions/checkout@v7

      - name: Build upstream examples/usercmodule (unix, native)
        uses: ./
        with:
          package-dir: examples/usercmodule
          build: ${{ env.CIBMP_UPSTREAM_TAG }}-manylinux_2_28_x86_64

      - name: List built artifacts
        run: ls -laR examples/usercmodule/mpyhouse

      # A linked binary is not the same claim as one whose modules actually
      # run -- unix is the one port here whose own output this runner can
      # simply execute (a real manylinux_2_28 binary runs unmodified on a
      # newer-glibc host, the whole point of the manylinux floor), unlike
      # rp2's own firmware.uf2, which needs real hardware. See
      # smoke_test.py's own header for what it actually exercises.
      - name: "Smoke test (unix): run the built binary against smoke_test.py"
        run: |
          set -euo pipefail
          identifier="${CIBMP_UPSTREAM_TAG}-manylinux_2_28_x86_64"
          bin="examples/usercmodule/mpyhouse/${identifier}/micropython-${identifier}"
          "$bin" examples/usercmodule/smoke_test.py

  # ── rp2: the CMake side ──────────────────────────────────────────────
  #
  # Chosen over esp32 purely on cost -- usermod/build_rp2.py's own docstring:
  # the Pico SDK arrives as `lib/` submodules of the MicroPython checkout
  # itself, no separate host-side toolchain resolver the way esp32's
  # ESP-IDF needs. Nothing here is rp2-specific; widening to esp32/windows/
  # webassembly/qemu is exactly [0054]'s own "widen only if it finds
  # something" (docs/records/0069).
  #
  # This is also the leg that actually answers [0054]'s biggest open
  # question for one real toolchain: whether cppexample's `-lstdc++` is
  # satisfiable on a bare-metal cross target. Deliberately not skipped --
  # a red leg here is a real finding to record, not a bug in this workflow.
  #
  # No pre-fetch step, unlike build-unix above: examples/usercmodule/
  # micropython.cmake resolves the pinned checkout itself, via MICROPY_DIR
  # -- a CMake variable every CMake port already sets before it ever
  # include()s a user module (rp2/CMakeLists.txt's own
  # `get_filename_component(MICROPY_DIR "../.." ABSOLUTE)`, well before its
  # own `include(${MICROPY_DIR}/py/usermod.cmake)`). No CIBMP_EXTRA_CMAKE_ARGS
  # needed either -- record 0069's original mechanism, replaced now that
  # this fixture's own micropython.cmake reads MICROPY_DIR directly. This
  # does NOT extend to the Make ports below: `usermod_mounts()`
  # (build_common.py) bind-mounts a Make port's own USER_C_MODULES as a
  # real host `Path` in addition to passing it as a `make` variable, so it
  # cannot be a `$(TOP)`-style Makefile expression the way a CMake
  # variable reference can -- CMake ports keep USER_C_MODULES="." (this
  # fixture's own small, real, mountable directory) and defer the actual
  # upstream reference to MICROPY_DIR entirely inside the already-mounted
  # checkout, which is the asymmetry that makes this simplification
  # CMake-only.
  build-rp2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CIBMP_VERSION: 0.0.0-ci
      # "." -- examples/usercmodule/ itself, which holds this fixture's own
      # micropython.cmake (not upstream's), same job-level-env reasoning
      # test-platforms.yml's own header comment already gives: a composite
      # action's inner steps only reliably see env set at job/workflow
      # level, not on the specific step that calls `uses: ./`.
      CIBMP_USER_C_MODULES: "."
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4

      - name: Build upstream examples/usercmodule (rp2)
        uses: ./
        with:
          package-dir: examples/usercmodule
          build: ${{ env.CIBMP_UPSTREAM_TAG }}-rp2-RPI_PICO

      - name: List built artifacts
        run: ls -laR examples/usercmodule/mpyhouse

  # ── esp32: the second CMake port, and the second bare-metal toolchain ──
  #
  # [0054]'s own list of unanswered families after [0069]: esp32 is the
  # ESP-IDF one -- a cmake-driven port like rp2, but a materially different
  # toolchain (Xtensa/RISC-V via idf.py, not arm-none-eabi via the Pico
  # SDK). Fully containerized since [0028] (no host-side ESP-IDF resolver
  # left).
  #
  # No pre-fetch step, same reasoning as build-rp2 above: MICROPY_DIR is
  # set at the very top of ports/esp32/main/CMakeLists.txt
  # (`if(NOT MICROPY_DIR) get_filename_component(...)`), well before it
  # -- via ports/esp32/CMakeLists.txt -- reaches `include(${MICROPY_DIR}/
  # py/usermod.cmake)`, so examples/usercmodule/micropython.cmake resolves
  # the checkout itself; no CIBMP_EXTRA_CMAKE_ARGS needed here either.
  build-esp32:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CIBMP_VERSION: 0.0.0-ci
      CIBMP_USER_C_MODULES: "."
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4

      - name: Build upstream examples/usercmodule (esp32)
        uses: ./
        with:
          package-dir: examples/usercmodule
          build: ${{ env.CIBMP_UPSTREAM_TAG }}-esp32-ESP32_GENERIC

      - name: List built artifacts
        run: ls -laR examples/usercmodule/mpyhouse

  # ── windows, webassembly, qemu: the remaining three Make ports ──────────
  #
  # Same mechanism as build-unix above (USER_C_MODULES points straight at
  # the pinned checkout's own examples/usercmodule/, no wrapper file), one
  # representative identifier per port rather than each port's own full
  # arch matrix -- [0054]'s own "widen only if it finds something", not a
  # cost-blind repeat of build-examples.yml's broader coverage. No smoke
  # test for any of the three: none of their outputs (a .exe, a .wasm, a
  # qemu ELF) runs directly on this runner the way unix's manylinux binary
  # does (record 0069's own reasoning for why rp2 has none either).
  build-windows:
    runs-on: ubuntu-latest
    env:
      CIBMP_VERSION: 0.0.0-ci
      CIBMP_USER_C_MODULES: "{micropython}/examples/usercmodule"
    steps:
      - uses: actions/checkout@v7

      - name: Build upstream examples/usercmodule (windows)
        uses: ./
        with:
          package-dir: examples/usercmodule
          build: ${{ env.CIBMP_UPSTREAM_TAG }}-win_amd64

      - name: List built artifacts
        run: ls -laR examples/usercmodule/mpyhouse

  build-webassembly:
    runs-on: ubuntu-latest
    env:
      CIBMP_VERSION: 0.0.0-ci
      CIBMP_USER_C_MODULES: "{micropython}/examples/usercmodule"
      # cppexample.cpp fails here otherwise: upstream's own
      # ports/webassembly/mpconfigport.h unconditionally `#define
      # _GNU_SOURCE`, which emcc/clang already predefines by itself in
      # C++ mode (-std=c++11), tripping -Werror -Wmacro-redefined. Not an
      # upstream bug this project can fix without vendoring that header
      # (0054's own "no vendoring" call) -- but py/mkrules.mk's own
      # CXXFLAGS composition already reaches into a `CXXFLAGS_MOD`
      # variable nothing in the tree ever assigns ("Add default C++
      # compiler flags based on CFLAGS. For use with C++ user modules" --
      # that comment's own words), a real, upstream-sanctioned hook for
      # exactly this. Reached through extra-make-args, already supported
      # by every Make port -- no new cibuildmp option needed, and no
      # existing-accumulation-clobbering risk either ([0066]'s own
      # CMAKE_ARGS/IDFPY_FLAGS trap): nothing ever assigns CXXFLAGS_MOD
      # first, so this command-line assignment has nothing to replace.
      CIBMP_EXTRA_MAKE_ARGS: "CXXFLAGS_MOD=-Wno-macro-redefined"
    steps:
      - uses: actions/checkout@v7

      - name: Build upstream examples/usercmodule (webassembly)
        uses: ./
        with:
          package-dir: examples/usercmodule
          build: ${{ env.CIBMP_UPSTREAM_TAG }}-wasm32

      - name: List built artifacts
        run: ls -laR examples/usercmodule/mpyhouse

  build-qemu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CIBMP_VERSION: 0.0.0-ci
      CIBMP_USER_C_MODULES: "{micropython}/examples/usercmodule"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4

      - name: Build upstream examples/usercmodule (qemu)
        uses: ./
        with:
          package-dir: examples/usercmodule
          build: ${{ env.CIBMP_UPSTREAM_TAG }}-qemu-MPS2_AN385

      - name: List built artifacts
        run: ls -laR examples/usercmodule/mpyhouse
