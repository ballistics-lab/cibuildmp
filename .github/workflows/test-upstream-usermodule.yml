name: Test upstream usercmodule

# Builds MicroPython's own `examples/usercmodule/` (cexample, cppexample,
# subpackage) through cibuildmp's real usermod path -- docs/records/0054
# scoped why this fixture matters (it tests upstream's own module contract,
# not one this project wrote for itself); docs/records/0069 is the mechanism
# actually landed here and explains every choice below in full.
#
# Two jobs, one Make port and one CMake port -- [0054]'s own "one Make port
# and one CMake port is enough to answer the three questions above", not
# build-examples.yml's much broader examples/template matrix.
#
# Neither job fetches MicroPython itself: CIBMP_CACHE_PATH below pins
# `sources.cache_root()` to a fixed, known directory, which makes the
# checkout's own eventual path (`<CIBMP_CACHE_PATH>/micropython/<tag>`,
# `sources.micropython_dir()`) computable in this workflow *before it
# exists* -- cibuildmp's own real `fetch_micropython()` call, already made
# from inside `orchestrate.build()` for every usermod build, is what
# actually populates it, once, when the real build step below runs. A
# separate pre-fetch step was tried first and dropped: it only duplicated
# that same call for no reason other than learning its own return value,
# which pinning CIBMP_CACHE_PATH makes unnecessary to ask for at all.
#
# Not set in examples/usercmodule/cibuildmp.toml, on purpose (see that
# file's own header comment): the checkout's path is a fact about *this
# run's own environment* (wherever CIBMP_CACHE_PATH/the default cache root
# resolves), not about the project, and `cache_root()` reads
# CIBMP_CACHE_PATH straight from the environment -- it is not a
# cibuildmp.toml key at all, so there is nothing to hand this project's own
# config schema even if that were otherwise desirable.
#
# push: (no branches: filter), same reasoning build-examples.yml's own header
# already documents -- this needs to run on every push to a dev branch too.

on:
  push:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: test-upstream-usermodule-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for both jobs below -- bump here, not in two
  # places, when this fixture moves to a newer tag.
  CIBMP_UPSTREAM_TAG: v1.29.0

jobs:
  # ── unix: the Make side ─────────────────────────────────────────────
  #
  # py/py.mk's own `<USER_C_MODULES>/*/micropython.mk` glob finds all three
  # of upstream's own subdirectories with nothing extra to arrange -- no
  # wrapper file needed on this side (see examples/usercmodule/
  # micropython.cmake's own header comment for why the CMake side below
  # needs one). USER_C_MODULES points straight at the pinned checkout's own
  # examples/usercmodule/, never copied into this repo (0054: no vendoring).
  build-unix:
    runs-on: ubuntu-latest
    env:
      CIBMP_VERSION: 0.0.0-ci
      # github.workspace, not runner.temp: the `runner` context is only
      # available in `jobs.<job_id>.steps`, not in job-level `env:` at all
      # -- confirmed live, the hard way (a real "invalid workflow file"
      # failure, zero jobs, before either job here ever started). Needs to
      # be job-level, not step-level, regardless: test-platforms.yml's own
      # header comment already found the reason live -- a composite
      # action's inner steps (this includes `uses: ./`'s own real "Run
      # cibuildmp" step) only reliably see env set at job/workflow level.
      CIBMP_CACHE_PATH: ${{ github.workspace }}/.cibmp-cache
      CIBMP_USER_C_MODULES: ${{ github.workspace }}/.cibmp-cache/micropython/${{ env.CIBMP_UPSTREAM_TAG }}/examples/usercmodule
    steps:
      - uses: actions/checkout@v7

      - name: Build upstream examples/usercmodule (unix, native)
        uses: ./
        with:
          package-dir: examples/usercmodule
          build: ${{ env.CIBMP_UPSTREAM_TAG }}-manylinux_2_28_x86_64

      - name: List built artifacts
        run: ls -laR examples/usercmodule/mpyhouse

      # A linked binary is not the same claim as one whose modules actually
      # run -- unix is the one port here whose own output this runner can
      # simply execute (a real manylinux_2_28 binary runs unmodified on a
      # newer-glibc host, the whole point of the manylinux floor), unlike
      # rp2's own firmware.uf2, which needs real hardware. See
      # smoke_test.py's own header for what it actually exercises.
      - name: "Smoke test (unix): run the built binary against smoke_test.py"
        run: |
          set -euo pipefail
          identifier="${CIBMP_UPSTREAM_TAG}-manylinux_2_28_x86_64"
          bin="examples/usercmodule/mpyhouse/${identifier}/micropython-${identifier}"
          "$bin" examples/usercmodule/smoke_test.py

  # ── rp2: the CMake side ──────────────────────────────────────────────
  #
  # Chosen over esp32 purely on cost -- usermod/build_rp2.py's own docstring:
  # the Pico SDK arrives as `lib/` submodules of the MicroPython checkout
  # itself, no separate host-side toolchain resolver the way esp32's
  # ESP-IDF needs. Nothing here is rp2-specific; widening to esp32/windows/
  # webassembly/qemu is exactly [0054]'s own "widen only if it finds
  # something" (docs/records/0069).
  #
  # This is also the leg that actually answers [0054]'s biggest open
  # question for one real toolchain: whether cppexample's `-lstdc++` is
  # satisfiable on a bare-metal cross target. Deliberately not skipped --
  # a red leg here is a real finding to record, not a bug in this workflow.
  build-rp2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CIBMP_VERSION: 0.0.0-ci
      CIBMP_CACHE_PATH: ${{ github.workspace }}/.cibmp-cache
      # "." -- examples/usercmodule/ itself, which holds this fixture's own
      # micropython.cmake (not upstream's).
      CIBMP_USER_C_MODULES: "."
      # Reaches this fixture's own micropython.cmake as the plain CMake
      # cache variable CIBMP_UPSTREAM_USERCMODULE_DIR
      # (build_common.cmake_extra_args_env() -> CMAKE_ARGS, record 0066's
      # own mechanism, unextended here) -- see that file for why it needs
      # this at all rather than including upstream's own aggregator
      # directly.
      CIBMP_EXTRA_CMAKE_ARGS: -DCIBMP_UPSTREAM_USERCMODULE_DIR=${{ github.workspace }}/.cibmp-cache/micropython/${{ env.CIBMP_UPSTREAM_TAG }}/examples/usercmodule
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4

      - name: Build upstream examples/usercmodule (rp2)
        uses: ./
        with:
          package-dir: examples/usercmodule
          build: ${{ env.CIBMP_UPSTREAM_TAG }}-rp2-RPI_PICO

      - name: List built artifacts
        run: ls -laR examples/usercmodule/mpyhouse
