name: Test upstream natmod

# Builds MicroPython's own `examples/natmod/features0` through cibuildmp's
# real natmod path -- docs/records/0055 scoped why this fixture matters (it
# tests upstream's own natmod contract, not the one this project wrote for
# itself in `examples/template/natmod`) and found that contract does not fit
# unmodified; docs/records/0072 is the mechanism actually landed here and
# explains every choice below in full.
#
# One job, deliberately building *two* arches for the same tag in a single
# invocation, not two separate single-arch jobs: [0055]'s own guard survey
# is entirely about what happens when cibuildmp builds several arches back
# to back in one checkout (a stale `$(MOD).mpy`, or an unscoped `build/`,
# silently carrying the *previous* arch's binary into the next one's output)
# -- a job that only ever builds one arch at a time would never actually
# exercise that risk. `verify_output()` (build.py, already part of every
# real build) is the check that would catch it: a wrong arch code in the
# .mpy header fails the build outright rather than shipping silently wrong.
#
# `examples/natmod/cibuildmp.toml` carries the whole mechanism -- `module-dir`
# pointing straight at `{micropython}/examples/natmod/features0` (no vendored
# copy), `make-target = "all"` (upstream's examples define no `dist` target
# at all), and its own `pre-build-command` clearing `features0.mpy`/`build`/
# `build-*` before every single arch's build in this same tree. No job here
# sets any of those directly -- a bare `cibuildmp examples/natmod --build
# <identifier>` run, CI or local, resolves identically to what this job does.
#
# No `docker/setup-qemu-action` needed, unlike test-upstream-usermodule.yml's
# rp2/esp32/qemu legs: `dockerrun.platform_for()` resolves every non-`unix`
# port -- natmod included -- to a flat `linux/amd64`, confirmed directly
# against that function's own source, so every natmod image already runs
# native on a `ubuntu-latest` runner regardless of which arch's toolchain it
# carries.
#
# push: (no branches: filter), same reasoning build-examples.yml's own header
# already documents -- this needs to run on every push to a dev branch too.

on:
  push:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: test-upstream-natmod-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth for this job -- bump here, not by hand in the
  # `build` line below, when this fixture moves to a newer tag. `mpy6.3`
  # is that tag's own natmod ABI (`identifier_format = "mpy{mpy}-{tag}-
  # {arch}"`, resources/build-platforms.toml), not an independent value --
  # a tag bump that also changes ABI needs this updated too.
  CIBMP_UPSTREAM_ABI_TAG: mpy6.3-v1.29.0

jobs:
  # x64: a plain native arch, no cross-compiler at all (`images.x64 =
  # "natmod_host"`) -- the cheapest possible leg.
  #
  # armv7emsp: a real cross-compiled arch (`arm-none-eabi-`, `images.
  # armv7emsp = "arm_embedded"`) sharing this same checkout and this same
  # `cibuildmp` invocation with x64 above -- the leg that actually exercises
  # [0055]'s own finding, not just a second easy arch for breadth's sake.
  build-features0:
    runs-on: ubuntu-latest
    env:
      CIBMP_VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@v7

      - name: Build upstream examples/natmod/features0 (x64 + armv7emsp)
        uses: ./
        with:
          package-dir: examples/natmod
          build: "${{ env.CIBMP_UPSTREAM_ABI_TAG }}-x64 ${{ env.CIBMP_UPSTREAM_ABI_TAG }}-armv7emsp"

      - name: List built artifacts
        run: ls -laR examples/natmod/mpyhouse
