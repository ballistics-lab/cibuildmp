name: Test platforms

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      build:
        description: "--build override (default: TEST_PLATFORMS_BUILD below)"
        required: false
        type: string
      skip:
        description: "--skip override (default: TEST_PLATFORMS_SKIP below)"
        required: false
        type: string

# Not CIBMP_BUILD -- cibuildmp itself already reads that name as its own
# generic config-override (options.py's own `opt()`); action.yml's own
# ACTION_* vs CIBMP_* comment documents the real collision this project hit
# once from reusing a CIBMP_-prefixed name for unrelated plumbing.
#
# 219 of the 738 identifiers `--build "*"` would otherwise select --
# matrix.yml's own 256-configuration cap (see the job below).
env:
  TEST_PLATFORMS_BUILD: "v1.29.0-* v1.28.0-* mpy6.3-v1.29.0-* mpy6.3-v1.28.0-*"
  # `esp32` no longer skipped -- [0028]'s own closing addenda: `build_esp32()`
  # went Docker (`esp_idf_base`, [0058]), closing the venv-conflict that
  # made every esp32 leg fail (live-caught 2026-08-28: 83 of 94 real
  # failures in one run were this one cause), and `idf_version`/`idf_target`
  # are now threaded from each target's own real row instead of always
  # resolving `Esp32BuildOptions`' dataclass defaults. Both halves
  # live-verified for one board each of Xtensa (`ESP32_GENERIC`) and
  # RISC-V (`ESP32_GENERIC_C3`) -- this workflow's own broad sweep is what
  # proves the rest of the ~40-board matrix for real.
  #
  # `ppc64le`/`s390x`/`riscv64` are *not* skipped either -- native to no
  # GitHub-hosted runner (record 0044's own descope), they route to
  # `test-emulated` below instead of being dropped outright.
  TEST_PLATFORMS_SKIP: ""

# Same pattern publish.yml's own concurrency block already uses. A real,
# live-caught gap this session: without this, several rapid-fire pushes to
# the same branch left multiple runs of this workflow racing each other,
# all sharing the identical apt-archives-<hash> GHA cache key (D28's own
# apt-cache step) -- every one of them failed to save it ("Failed to save:
# Unable to reserve cache with key ..., another job may be creating this
# cache"), confirmed directly from real job logs, not guessed. Cancelling
# a superseded run outright (rather than merely serializing them) means
# only the latest commit's own run ever gets to actually save that cache.
concurrency:
  group: test-platforms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Its only output is the two matrices `test-amd64`/`test-arm64` below fan
  # out over -- see
  # targets.py's own docstring ("nothing here touches the filesystem or the
  # network", kept fast enough to run as its own CI job for exactly this).
  # Not run through `uses: ./` (action.yml's own apt-prerequisites step
  # installs cross-compilers this job never needs) -- just enough of
  # action.yml's own "Install cibuildmp" step (astral-sh/setup-uv, `uv tool
  # install`) to get the `cibuildmp` binary on PATH.
  build-matrix:
    runs-on: ubuntu-latest
    # Advisory, not a required check -- see `test-amd64`'s own
    # continue-on-error below for why.
    continue-on-error: true
    outputs:
      build_amd64: ${{ steps.build-matrix.outputs.build_amd64 }}
      build_arm64: ${{ steps.build-matrix.outputs.build_arm64 }}
      build_emulated: ${{ steps.build-matrix.outputs.build_emulated }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install cibuildmp
        run: uv tool install .

      - name: Build matrix
        id: build-matrix
        env:
          BUILD_INPUT: ${{ inputs.build }}
          SKIP_INPUT: ${{ inputs.skip }}
        run: |
          set -euo pipefail
          build="${BUILD_INPUT:-$TEST_PLATFORMS_BUILD}"
          skip="${SKIP_INPUT:-$TEST_PLATFORMS_SKIP}"
          identifiers=$(cibuildmp examples/template --print-build-identifiers --json --build "$build" --skip "$skip")
          # Three groups, by what each identifier is native to:
          # - unix aarch64/armv7l (both libc floors) -> ubuntu-24.04-arm,
          #   record 0044's own measurement that GitHub's arm64 runners run
          #   AArch32-at-EL0 natively too.
          # - unix ppc64le/s390x/riscv64 (both libc floors) -> native to no
          #   GitHub-hosted runner at all (record 0044's own descope) ->
          #   test-emulated, under QEMU, on a schedule rather than every
          #   push (see that job's own comment for the cost argument).
          # - everything else (every natmod/usermod toolchain image, plus
          #   unix x86_64/i686/mipsel) is `linux/amd64` regardless of what
          #   target arch it cross-compiles for (record 0058) -> ubuntu-latest.
          # Split by these regexes, not by guessing from the port name, so
          # this stays correct as ports are added.
          build_amd64=$(echo "$identifiers" | jq -c '[.[] | select(test("_aarch64$|_armv7l$|_ppc64le$|_s390x$|_riscv64$") | not)]')
          build_arm64=$(echo "$identifiers" | jq -c '[.[] | select(test("_aarch64$|_armv7l$"))]')
          build_emulated=$(echo "$identifiers" | jq -c '[.[] | select(test("_ppc64le$|_s390x$|_riscv64$"))]')
          echo "build_amd64=$build_amd64" >> "$GITHUB_OUTPUT"
          echo "build_arm64=$build_arm64" >> "$GITHUB_OUTPUT"
          echo "build_emulated=$build_emulated" >> "$GITHUB_OUTPUT"
          {
            echo "### Selected \`$build\`"
            echo "$(echo "$identifiers" | jq length) identifiers"
            echo "-- $(echo "$build_amd64" | jq length) on ubuntu-latest, $(echo "$build_arm64" | jq length) on ubuntu-24.04-arm, $(echo "$build_emulated" | jq length) emulated"
          } >> "$GITHUB_STEP_SUMMARY"

  # One job per runner, each building what that runner is native to --
  # the same shape build-examples.yml's own build-usermod job uses, fanned
  # out one identifier per leg instead of one batched `build:` string,
  # since this workflow's own per-identifier result.md/summary mechanism
  # (below) needs a leg per identifier to attribute a failure to. Neither
  # of these two jobs runs docker/setup-qemu-action -- deliberately: every
  # identifier build-matrix hands each one is already native to it, so
  # there is nothing here for QEMU to do. `test-emulated` below is the
  # one job in this file that does need it.
  test-amd64:
    needs: build-matrix
    runs-on: ubuntu-latest
    # This workflow is meant to run on every PR and surface real breakage,
    # but not gate merging on it -- continue-on-error reports the job's
    # conclusion as success to the Checks API (and to any `needs:`) even
    # when its steps fail, so a real failure still shows up (a step in the
    # log, a warning triangle on the job) without turning the PR check red.
    # fail-fast: false alongside it: fail-fast cancellation is driven by a
    # matrix job's real (pre-override) result, not the reported one, so
    # without this one failing leg would still cancel every other leg.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.build-matrix.outputs.build_amd64) }}
    steps:
      - uses: actions/checkout@v7

      - name: Build examples/template (natmod)
        id: build
        uses: ./
        env:
          CIBMP_VERSION: 0.0.0-ci
          # Disables cibuildmp's own native per-target step summary
          # (stepsummary.py) -- 219 legs each writing their own table would
          # bury the one aggregate table `aggregate-results` below builds
          # instead.
          CIBMP_DISABLE_GITHUB_STEP_SUMMARY: "1"
        with:
          package-dir: examples/template
          build: ${{ matrix.build }}

      - name: Record result
        if: always()
        run: |
          icon="✅"
          [ "${{ steps.build.outcome }}" = "success" ] || icon="❌"
          echo "| \`${{ matrix.build }}\` | $icon ${{ steps.build.outcome }} |" > "result-${{ matrix.build }}.md"

      # The file inside each artifact must itself carry the identifier, not
      # just the artifact's own name -- `aggregate-results`'s own `merge-multiple:
      # true` below flattens every one of these ~150 artifacts into one
      # directory by *filename*. A plain `result.md` in every one of them
      # collided there (live-caught 2026-08-28: 146 artifacts uploaded,
      # `results/*.md` resolved to exactly 1 after the merge, so the final
      # table showed only the very last leg written) -- each leg's own file
      # needs a name no other leg can produce.
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.build }}
          path: result-${{ matrix.build }}.md
          retention-days: 1

  # Same job, same steps, on GitHub's own arm64 runner -- see the comment
  # above `test-amd64` for why there are two of these instead of one job
  # with a runner axis.
  test-arm64:
    needs: build-matrix
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.build-matrix.outputs.build_arm64) }}
    steps:
      - uses: actions/checkout@v7

      - name: Build examples/template (natmod)
        id: build
        uses: ./
        env:
          CIBMP_VERSION: 0.0.0-ci
          CIBMP_DISABLE_GITHUB_STEP_SUMMARY: "1"
        with:
          package-dir: examples/template
          build: ${{ matrix.build }}

      - name: Record result
        if: always()
        run: |
          icon="✅"
          [ "${{ steps.build.outcome }}" = "success" ] || icon="❌"
          echo "| \`${{ matrix.build }}\` | $icon ${{ steps.build.outcome }} |" > "result-${{ matrix.build }}.md"

      # The file inside each artifact must itself carry the identifier, not
      # just the artifact's own name -- `aggregate-results`'s own `merge-multiple:
      # true` below flattens every one of these ~150 artifacts into one
      # directory by *filename*. A plain `result.md` in every one of them
      # collided there (live-caught 2026-08-28: 146 artifacts uploaded,
      # `results/*.md` resolved to exactly 1 after the merge, so the final
      # table showed only the very last leg written) -- each leg's own file
      # needs a name no other leg can produce.
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.build }}
          path: result-${{ matrix.build }}.md
          retention-days: 1

  # `ppc64le`/`s390x`/`riscv64` (both libc floors) -- native to no
  # GitHub-hosted runner GitHub offers at all (record 0044's own descope).
  # The same pattern build-examples.yml's own `build-usermod-foreign-host`
  # job already argues for: **not** on `pull_request`, only
  # `workflow_dispatch` -- that job's own measurement was one emulated leg
  # costing ~18 minutes against ~3 for everything else in the workflow
  # combined, and this one is up to six such legs per version tag. Proving
  # these still build is worth doing on demand; it is the wrong trade to
  # pay on every PR push, which is exactly the emulation cost the
  # `test-amd64`/`test-arm64` split above exists to avoid for the common
  # case.
  test-emulated:
    needs: build-matrix
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.build-matrix.outputs.build_emulated) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - name: Build examples/template (natmod)
        id: build
        uses: ./
        env:
          CIBMP_VERSION: 0.0.0-ci
          CIBMP_DISABLE_GITHUB_STEP_SUMMARY: "1"
        with:
          package-dir: examples/template
          build: ${{ matrix.build }}

      - name: Record result
        if: always()
        run: |
          icon="✅"
          [ "${{ steps.build.outcome }}" = "success" ] || icon="❌"
          echo "| \`${{ matrix.build }}\` | $icon ${{ steps.build.outcome }} |" > "result-${{ matrix.build }}.md"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.build }}
          path: result-${{ matrix.build }}.md
          retention-days: 1

  # Aggregates every test-amd64/test-arm64/test-emulated leg's own
  # result-*.md into one table on this workflow run's own Summary page --
  # no single job can:
  # a matrix job's outputs: only ever keep the *last* leg to finish, and
  # continue-on-error means none of the 219 legs turning the PR check red
  # either, so without this a real failure is visible only by opening that
  # one leg's own log.
  #
  # Job id `aggregate-results`, not `summary` -- GitHub's own Summary page
  # headers each job's section "<job id> summary" (live-caught 2026-08-28:
  # a job literally id'd `summary` renders as "summary summary" there).
  aggregate-results:
    needs: [test-amd64, test-arm64, test-emulated]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results
          merge-multiple: true

      - name: Build summary
        run: |
          rows=$(cat results/*.md | sort)
          total=$(echo "$rows" | wc -l)
          failed=$(echo "$rows" | grep -c '❌' || true)
          {
            echo "### Test platforms (\`$TEST_PLATFORMS_BUILD\`)"
            echo
            echo "$((total - failed))/$total passed"
            echo
            echo "| Identifier | Result |"
            echo "| --- | --- |"
            echo "$rows"
          } >> "$GITHUB_STEP_SUMMARY"
