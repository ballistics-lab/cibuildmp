name: Test target set

# Reusable (`workflow_call`) and directly dispatchable: builds every
# identifier `build`/`skip` selects on the given runner, with
# `--keep-going` ([0063]) so one target's own failure never stops the
# rest, and uploads the resulting JSON build report as this job's own
# artifact. `test-all-platforms.yml` is the only real caller -- one call
# per bucket `bin/plan_test_matrix.py` planned, each already sized and
# runner-assigned so no run ever queues more than `--max-buckets`
# concurrent jobs against the account's own shared concurrency budget
# (docs/records/0065).
#
# This file used to be the per-port orchestration layer itself (record
# 0062): one `workflow_call` per port, each fanning out into its own
# build-matrix/test-amd64/test-arm64/test-emulated jobs, because at the
# time the only lever this project had against a real 211/256-identifier
# matrix ceiling was giving each port its own independent 256 budget.
# [0065] replaces the ceiling this was solving for with a different one
# (an account-wide concurrent-job cap, measured live: 30/238 legs
# finished in a real run's first eight minutes, then nothing progressed
# for 35+ more) -- the fix for *that* ceiling is bucketing by estimated
# time across every port at once, not per port, so the per-port fan-out
# this file used to do is gone with it. What is left is the one thing
# every bucket still needs done identically: run a `--build` selection
# with `--keep-going`, on the right runner, and hand back a report.

on:
  workflow_call:
    inputs:
      label:
        description: "Short name for this bucket, used in its own artifact name"
        required: true
        type: string
      build:
        description: "--build value -- normally an exact, space-separated identifier list from bin/plan_test_matrix.py, not a glob"
        required: true
        type: string
      skip:
        required: false
        type: string
        default: ""
      runner:
        description: "runs-on value -- ubuntu-latest or ubuntu-24.04-arm"
        required: false
        type: string
        default: ubuntu-latest
  # Kept alongside `workflow_call`, deliberately -- lets a maintainer
  # dispatch this file directly against one target set (e.g. just a
  # handful of rp2 boards) without going through the full plan/aggregate
  # pipeline in test-all-platforms.yml.
  workflow_dispatch:
    inputs:
      label:
        description: "Short name shown in this run's own artifact name"
        required: false
        type: string
        default: manual
      build:
        description: "--build glob to test"
        required: true
        type: string
      skip:
        description: "--skip glob"
        required: false
        type: string
        default: ""
      runner:
        required: false
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04-arm
        default: ubuntu-latest

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    # Advisory, not a required check -- a real failure inside the batch
    # is still visible (a step in the log, the report this job uploads),
    # `test-all-platforms.yml`'s own aggregate-results is what actually
    # renders it. Without this, one bucket containing a real, expected
    # failure would turn this whole job -- and by extension the run --
    # red, which is exactly what `--keep-going`'s own report exists to
    # make unnecessary.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # Cheap and unconditional -- only the small handful of identifiers
      # this bucket might contain that are genuinely non-native to this
      # runner (unix's own ppc64le/s390x/riscv64 cells, always on
      # ubuntu-latest) need it; registering it for a bucket that turns
      # out to need none of that costs a couple of seconds, and knowing
      # in advance which buckets need it would mean threading the same
      # per-identifier classification `bin/plan_test_matrix.py` already
      # did back through the matrix, for no real saving.
      - uses: docker/setup-qemu-action@v4

      - name: Build this bucket
        uses: ./
        env:
          CIBMP_VERSION: 0.0.0-ci
          # Every bucket writes into the same job's own workspace-relative
          # path -- fine, since each bucket is a separate job/runner/
          # checkout; nothing shares this directory across buckets.
          CIBMP_REPORT_PATH: ${{ github.workspace }}/.cibmp-report
          # Disables cibuildmp's own native per-target GitHub step summary
          # (stepsummary.py) -- every bucket writing its own table would
          # bury aggregate-results's own single combined one.
          CIBMP_DISABLE_GITHUB_STEP_SUMMARY: "1"
        with:
          package-dir: examples/template
          build: ${{ inputs.build }}
          skip: ${{ inputs.skip }}
          keep-going: "1"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ inputs.label }}
          path: .cibmp-report/*.json
          retention-days: 1
          if-no-files-found: warn
