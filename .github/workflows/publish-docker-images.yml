name: Publish Docker images

# The "separate workflow" the user's own direction called for, checked
# against cibuildwheel's real model before shaping it: cibuildwheel never
# builds its own manylinux/musllinux images as part of a consumer's
# build at all -- publishing one is a rare, out-of-band maintainer task
# (its own bin/update_docker.py), and the pinned digest that results
# (resources/pinned_docker_images.cfg) is the only thing a real build
# ever touches (a plain `docker pull`, see cibuildwheel's own
# oci_container.py). This workflow is cibuildmp's own equivalent of that
# maintainer task -- it does not run on every push (build-examples.yml's
# own verify-docker-images job already build-checks every Dockerfile on
# every push/PR, catching breakage fast); it runs when docker/ actually
# changes on main, or on demand, and its own job is publishing, not
# verifying.
#
# docker/*.Dockerfile lives at the repo root, not inside
# src/cibuildmp/resources/ -- pyproject.toml's own comment has the full
# reasoning (mirrors pypa/manylinux's own top-level docker/, since
# neither repo needs these files to ship inside an installed package any
# more now that cibuildmp never builds one itself).
#
# **Record 0043 reshaped this matrix.** It used to be eight names with no
# `platforms:` key at all, which meant every image was built as
# `linux/amd64` by accident of the runner rather than by decision -- fine
# while `unix` cross-compiled from amd64, and the direct cause of the
# `exec format error` an `ubuntu-24.04-arm` consumer hit. Now each entry
# carries the platform it is *for*, and for the `unix` cells that platform
# is the build target itself: `manylinux_2_28_aarch64` is an arm64 image
# holding a native aarch64 toolchain, not an amd64 image holding a cross
# one. Nothing here is a manifest list, deliberately -- one image, one
# platform, exactly as pypa publishes its own and for the same reason
# (a list would put host-dependent resolution back in).
#
# Names are pypa's, with no `cibuildmp-` prefix:
# `docker/<tag>.Dockerfile` -> `ghcr.io/<owner>/<tag>`, where `<tag>` is a
# real PEP 600 / PEP 656 platform tag. The three cross-compiling ports keep
# plain port names -- there is no upstream `manylinux`-shaped name to reuse
# for a mingw-w64 or emsdk host.
#
# Digest-pinned, not `:latest` -- the user's own explicit call: GHCR
# supports pinning by digest exactly the way quay.io does for
# cibuildwheel's own pins, so there is no need to trade the immutability
# a `:sha-<gitsha>` tag already gave build-examples.yml's own dev-branch
# testing for a floating tag here. After this workflow runs, a
# maintainer records the digest GitHub prints for each pushed image
# (`docker/build-push-action`'s own `digest` output, printed to the job
# summary below) into `resources/pinned_docker_images.toml`, in a real PR
# -- the same manual-but-deliberate cadence cibuildwheel's own
# `bin/update_docker.py` has for its own pins, not something this workflow
# does to source on its own. cibuildmp now has that script too:
# `bin/update_docker.py --images` re-reads every digest straight off GHCR
# and fills the whole table in one pass, which beats copying eighteen of
# them out of a job summary by hand.

on:
  push:
    branches: [main] # temporary
    paths:
      - "docker/**"
      - ".github/workflows/publish-docker-images.yml"
  workflow_dispatch:

concurrency:
  group: publish-docker-images-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # fail-fast off: fifteen of these are emulated builds of unrelated
      # architectures, and one arch's base going missing upstream should
      # not cancel the fourteen cells that are fine.
      fail-fast: false
      matrix:
        include:
          - { image: manylinux_2_28_x86_64, platform: linux/amd64 }
          - { image: musllinux_1_2_x86_64, platform: linux/amd64 }
          - { image: manylinux_2_28_i686, platform: linux/386 }
          - { image: musllinux_1_2_i686, platform: linux/386 }
          - { image: manylinux_2_28_aarch64, platform: linux/arm64 }
          - { image: musllinux_1_2_aarch64, platform: linux/arm64 }
          - { image: manylinux_2_28_ppc64le, platform: linux/ppc64le }
          - { image: musllinux_1_2_ppc64le, platform: linux/ppc64le }
          - { image: manylinux_2_28_s390x, platform: linux/s390x }
          - { image: musllinux_1_2_s390x, platform: linux/s390x }
          - { image: manylinux_2_31_armv7l, platform: linux/arm/v7 }
          - { image: musllinux_1_2_armv7l, platform: linux/arm/v7 }
          - { image: manylinux_2_39_riscv64, platform: linux/riscv64 }
          - { image: musllinux_1_2_riscv64, platform: linux/riscv64 }
          # mipsel is the one `unix` cell that is still a cross-compile,
          # so its platform is the amd64 *host*, not its build target --
          # there is no 32-bit mipsel image to be native to (record 0043's
          # own documented exception).
          - { image: manylinux_2_39_mipsel, platform: linux/amd64 }
          # Cross-compile hosts targeting Windows, bare metal and wasm.
          - { image: windows, platform: linux/amd64 }
          - { image: qemu, platform: linux/amd64 }
          - { image: webassembly, platform: linux/amd64 }
    steps:
      - uses: actions/checkout@v7

      # Required, not optional: every non-amd64 entry above runs foreign
      # binaries at image-build time (`dnf install` inside an arm64 or
      # s390x base). cibuildmp itself never installs emulation -- parity
      # with cibuildwheel, which pushes exactly this onto the caller --
      # so the workflow that needs it sets it up for itself.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push docker/${{ matrix.image }}.Dockerfile
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Make the package public
        # Record 0033 found this the hard way: the first real publish run
        # pushed eight images and every one of them came out **private**,
        # so an unauthenticated `docker pull` of a digest this repo had
        # just pinned returned `401 unauthorized`. That was the one thing
        # standing between the pin table and a credential-less consumer
        # being able to use it at all, and it was fixed by hand. Doing it
        # here is what stops the next new image -- and record 0043 adds
        # fifteen of them at once -- from landing in the same state.
        #
        # `|| true`, and deliberately not a failure: `github.token` often
        # **cannot** do this. The packages visibility endpoint wants
        # `write:packages` on a token with admin rights over the package,
        # which the default workflow token generally does not have, and a
        # newly-created package is owned by the actor rather than by the
        # workflow. When it fails the publish itself is still correct --
        # the image is pushed and its digest is recorded below -- and the
        # visibility flip stays the manual step it already was. To make it
        # actually automatic, give the repo a PAT with `write:packages`
        # and swap `github.token` for it here.
        #
        # The owner check picks the right endpoint: personal accounts use
        # `/user/packages/...`, organisations `/orgs/<owner>/packages/...`
        # -- there is no single path that works for both.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.repository_owner_id }}" = "${{ github.actor_id }}" ]; then
            ENDPOINT="user/packages/container/${{ matrix.image }}/visibility"
          else
            ENDPOINT="orgs/${{ github.repository_owner }}/packages/container/${{ matrix.image }}/visibility"
          fi
          gh api -X PATCH "$ENDPOINT" -f visibility=public || \
            echo "::warning::could not set ${{ matrix.image }} public -- flip it by hand, or give this workflow a PAT with write:packages"

      - name: Record the pinned digest
        # The `:latest` tag above is only what makes this image easy to
        # find by hand -- nothing in cibuildmp itself is ever pointed at a
        # mutable tag (resources/pinned_docker_images.toml's own header
        # has why). This is the value that ends up in that file, either
        # copied from here or read back by `bin/update_docker.py --images`.
        run: |
          echo "### ${{ matrix.image }} (${{ matrix.platform }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
