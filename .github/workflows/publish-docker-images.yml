name: Publish Docker images

# The "separate workflow" the user's own direction called for, checked
# against cibuildwheel's real model before shaping it: cibuildwheel never
# builds its own manylinux/musllinux images as part of a consumer's
# build at all -- publishing one is a rare, out-of-band maintainer task
# (its own bin/update_docker.py), and the pinned digest that results
# (resources/pinned_docker_images.cfg) is the only thing a real build
# ever touches (a plain `docker pull`, see cibuildwheel's own
# oci_container.py). This workflow is cibuildmp's own equivalent of that
# maintainer task -- it does not run on push at all (build-examples.yml's
# own verify-docker-images job already build-checks every Dockerfile on
# every push/PR, catching breakage fast); it runs on manual dispatch and
# nothing else, and its own job is publishing, not verifying.
#
# docker/*.Dockerfile lives at the repo root, not inside
# src/cibuildmp/resources/ -- pyproject.toml's own comment has the full
# reasoning (mirrors pypa/manylinux's own top-level docker/, since
# neither repo needs these files to ship inside an installed package any
# more now that cibuildmp never builds one itself).
#
# **Record 0043 reshaped this matrix.** It used to be eight names with no
# `platforms:` key at all, which meant every image was built as
# `linux/amd64` by accident of the runner rather than by decision -- fine
# while `unix` cross-compiled from amd64, and the direct cause of the
# `exec format error` an `ubuntu-24.04-arm` consumer hit. Now each entry
# carries the platform it is *for*, and for the `unix` cells that platform
# is the build target itself: `manylinux_2_28_aarch64` is an arm64 image
# holding a native aarch64 toolchain, not an amd64 image holding a cross
# one. Nothing here is a manifest list, deliberately -- one image, one
# platform, exactly as pypa publishes its own and for the same reason
# (a list would put host-dependent resolution back in).
#
# Names are pypa's, with no `cibuildmp-` prefix:
# `docker/<tag>.Dockerfile` -> `ghcr.io/<owner>/<tag>`, where `<tag>` is a
# real PEP 600 / PEP 656 platform tag. The three cross-compiling ports keep
# plain port names -- there is no upstream `manylinux`-shaped name to reuse
# for a mingw-w64 or emsdk host.
#
# Digest-pinned, not `:latest` -- the user's own explicit call: GHCR
# supports pinning by digest exactly the way quay.io does for
# cibuildwheel's own pins, so there is no need to trade the immutability
# a `:sha-<gitsha>` tag already gave build-examples.yml's own dev-branch
# testing for a floating tag here. After this workflow runs, a
# maintainer records the digest GitHub prints for each pushed image
# (`docker/build-push-action`'s own `digest` output, printed to the job
# summary below) into `resources/pinned_docker_images.toml`, in a real PR
# -- the same manual-but-deliberate cadence cibuildwheel's own
# `bin/update_docker.py` has for its own pins, not something this workflow
# does to source on its own. cibuildmp now has that script too:
# `bin/update_docker.py --images` re-reads every digest straight off GHCR
# and fills the whole table in one pass, which beats copying ten of
# them out of a job summary by hand.

# **Dispatch only, deliberately.** This used to also carry `push:
# branches: [main], paths: docker/**` (marked `# temporary` from the day
# it was written). The `only` filter lives on the *steps*, and a `push`
# event leaves `github.event.inputs.only` empty, so every such push
# republished **all fifteen** images -- hours of runner time, three of
# them emulated -- for a one-Dockerfile change, and moved fifteen
# `:latest` tags, opening [0059]'s own untagged-cleanup window fifteen
# times over, to publish fourteen images nobody had touched.
#
# It also made a merge do something a merge should not: a Dockerfile
# change would publish itself the moment it landed, before anyone
# decided the image was ready to be published under that name. That is
# not hypothetical -- record 0068's own mipsel toolchain change is a
# Dockerfile whose *name* has to change before its next publish, and
# merging it with this trigger in place would have published glibc 2.41
# under a tag claiming 2.39, automatically.
#
# Publishing stays what the header above says it is: rare, deliberate,
# maintainer-triggered, followed by a real repinning PR. Nothing is lost
# by dropping the trigger -- `verify-docker-images.yml` still
# build-checks every Dockerfile on every push and PR, which is the part
# that actually catches breakage.
on:
  workflow_dispatch:
    inputs:
      only:
        description: >
          Republish just these images -- comma-separated with no spaces,
          matched against this job's own matrix `image` values, e.g.
          "webassembly" or "windows,natmod_host". Empty rebuilds all
          fifteen, which is hours: three of them (aarch64, ppc64le,
          s390x) are emulated on this runner's amd64 host. The example
          used to read "natmod" and "qemu" -- neither has been a matrix
          entry since record 0058 split them into the six toolchain-group
          images, so both silently matched nothing.
        required: false
        default: ""

concurrency:
  group: publish-docker-images-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # fail-fast off: one arch's base going missing upstream should not
      # cancel the other cells that are fine.
      fail-fast: false
      matrix:
        include:
          # Only the cells that actually add a cibuildmp layer on top of
          # pypa's own base get built and published here. `armv7l`'s
          # `manylinux_2_31`, `riscv64`'s `manylinux_2_39`, every
          # `musllinux_1_2` cell (all seven arches), and -- once
          # `MICROPY_STANDALONE=1` went universal for `unix` and the
          # `libffi-devel` layer stopped being read by anything, verified
          # live against a bare pypa image -- the five `manylinux_2_28_*`
          # cells too, were all verified to need nothing over a bare
          # `FROM`. Their Dockerfiles are deleted, and
          # `resources/pinned_docker_images.toml` points all fourteen
          # cells straight at `pinned_pypa_images.toml`'s own digest
          # instead of a `ghcr.io/ballistics-lab/...` copy of it.
          # mipsel is the one `unix` cell that is still a cross-compile,
          # so its platform is the amd64 *host*, not its build target --
          # there is no 32-bit mipsel image to be native to (record 0043's
          # own documented exception).
          - { image: manylinux_2_41_mipsel, platform: linux/amd64 }
          # Cross-compile hosts targeting Windows, bare metal and wasm.
          - { image: windows, platform: linux/amd64 }
          - { image: webassembly, platform: linux/amd64 }

          # The five toolchain-group images record 0058 splits
          # `natmod.Dockerfile`/`qemu.Dockerfile` into -- keyed by which
          # compiler(s) a build needs, not by which port or arch. All
          # `linux/amd64`, the same reason `natmod`/`qemu` were: a `.mpy`
          # or a bare-metal `.elf` is relocatable output with nothing to be
          # native *to*, every toolchain in each of these is a
          # cross-compiler, and the pinned tarballs each ship an x86_64
          # build and no other. `arm_embedded`/`riscv_embedded` were two
          # entries here through record 0087; record 0096 merged them into
          # one (`embedded_base`) once neither baked a cross compiler any
          # more and their own apt-package sets had nothing left to
          # distinguish them.
          - { image: embedded_base, platform: linux/amd64 }
          - { image: xtensa_lx106, platform: linux/amd64 }
          - { image: xtensa_esp, platform: linux/amd64 }
          - { image: natmod_host, platform: linux/amd64 }
          - { image: ppc64le_linux, platform: linux/amd64 }
          - { image: esp_idf_base, platform: linux/amd64 }
    steps:
      - uses: actions/checkout@v7

      # No `docker/setup-qemu-action` here any more: every remaining
      # matrix entry is `linux/amd64` (the five `manylinux_2_28_*` rows
      # were the only non-amd64 ones, and they're gone -- see the matrix's
      # own comment). Re-add it if a future group ever needs foreign
      # binaries at image-build time again; it is not defensive scaffolding
      # kept for a case nothing here hits any more.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # [0059]'s own incident, made preventable rather than just documented:
      # the build-push step below always pushes `:latest`, so the instant it
      # lands, whatever `:latest` pointed to before becomes untagged -- an
      # OCI index with no tag of its own is exactly what GHCR's "delete
      # untagged versions" cleanup cannot tell apart from real garbage, and
      # that cleanup already deleted seven of fifteen published images once
      # (record 0059), the pin itself never touched. Retagging the digest
      # `resources/pinned_docker_images.toml` still names -- the one a real
      # build still depends on until a maintainer's own PR repoints it --
      # under a name derived from that same digest closes the window: it
      # keeps its own tag no matter where `:latest` moves next, so a cleanup
      # run in between publishing and repinning has nothing untagged to find.
      # No-op (imagetools create is idempotent) if this tag already exists,
      # and non-fatal if there is nothing pinned yet for a brand-new group.
      - name: Preserve the digest :latest is about to leave behind
        if: >-
          github.event.inputs.only == ''
          || contains(
            format(',{0},', github.event.inputs.only),
            format(',{0},', matrix.image)
          )
        run: |
          set -euo pipefail
          CURRENT=$(python3 -c "
          import tomllib
          with open('src/cibuildmp/resources/pinned_docker_images.toml', 'rb') as f:
              data = tomllib.load(f)
          print(data.get('image_group', {}).get('${{ matrix.image }}', ''))
          ")
          if [[ "$CURRENT" != ghcr.io/* ]]; then
            echo "No existing ghcr.io pin for ${{ matrix.image }} yet -- nothing to preserve."
            exit 0
          fi
          DIGEST="${CURRENT#*@sha256:}"
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:pre-${DIGEST:0:12}" \
            "$CURRENT" \
          || echo "::warning::could not preserve the previous digest for ${{ matrix.image }} -- it may already be gone"

      - name: Build and push docker/${{ matrix.image }}.Dockerfile
        id: push
        # The `only` input, on each step rather than on the job.
        # A job-level `if` is evaluated *before* the matrix is expanded,
        # so `matrix` is not in scope there -- putting it there made the
        # whole file invalid ("Unrecognized named-value: 'matrix'"), which
        # is a failure mode worth one line: a broken workflow file does
        # not fail a run, it fails the *parse*, so nothing runs at all and
        # nothing in the Actions tab explains why.
        if: >-
          github.event.inputs.only == ''
          || contains(
            format(',{0},', github.event.inputs.only),
            format(',{0},', matrix.image)
          )
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Check the package is publicly pullable
        if: >-
          github.event.inputs.only == ''
          || contains(
            format(',{0},', github.event.inputs.only),
            format(',{0},', matrix.image)
          )
        # Checks, deliberately -- it does not try to change anything.
        #
        # This step first tried `gh api -X PATCH
        # .../packages/container/<name>/visibility`, on the theory
        # (record 0033) that a freshly-published package lands private and
        # an anonymous pull of a digest this repo just pinned would answer
        # `401`. Both halves of that turned out wrong, and the run that
        # published record 0044's eighteen images is the evidence:
        #
        #   * **The PATCH 404s**, in the workflow and from a local `gh`
        #     login carrying `write:packages` + `delete:packages` alike.
        #     There is no REST resource for changing a container
        #     package's visibility; the package settings UI is the only
        #     way. So the old step was aiming at a URL that does not
        #     exist and then blaming the token.
        #   * **The packages were already public** before it fired -- the
        #     same job log shows `"visibility": "public"` above the PATCH.
        #     A package published by Actions into a public repository
        #     comes out public.
        #
        # What is left is worth keeping, because 0033's failure was real
        # once: read the visibility back and say so if it is not public.
        # That turns "the pins are unusable anonymously" into a warning at
        # publish time instead of a `401` in some consumer's build, and it
        # names the one action that actually fixes it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.repository_owner_id }}" = "${{ github.actor_id }}" ]; then
            ENDPOINT="user/packages/container/${{ matrix.image }}"
          else
            ENDPOINT="orgs/${{ github.repository_owner }}/packages/container/${{ matrix.image }}"
          fi
          VISIBILITY=$(gh api "$ENDPOINT" --jq .visibility 2>/dev/null || echo unknown)
          echo "${{ matrix.image }}: $VISIBILITY"
          if [ "$VISIBILITY" != "public" ]; then
            echo "::warning::${{ matrix.image }} is '$VISIBILITY' -- an anonymous pull of the digest below will fail. Make it public in the package settings UI (there is no API for this)."
          fi

      - name: Record the pinned digest
        if: >-
          github.event.inputs.only == ''
          || contains(
            format(',{0},', github.event.inputs.only),
            format(',{0},', matrix.image)
          )
        # The `:latest` tag above is only what makes this image easy to
        # find by hand -- nothing in cibuildmp itself is ever pointed at a
        # mutable tag (resources/pinned_docker_images.toml's own header
        # has why). This is the value that ends up in that file, either
        # copied from here or read back by `bin/update_docker.py --images`.
        run: |
          echo "### ${{ matrix.image }} (${{ matrix.platform }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
