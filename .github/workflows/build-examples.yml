name: Build examples

# cibuildmp's own integration tests: examples/* are real natmod/usermod
# modules, built here with this repo's own root action.yml -- the same
# `uses:` a consumer like bclibc or a7p would write. Green here means the
# actual build path works end to end, not just that --dry-run prints a
# plausible plan. This is also the only real feedback loop for action.yml
# itself: `uses: ./` below runs it for real, something no amount of
# YAML-syntax checking or local shell testing can substitute for. action.yml
# is a composite action (docs/BACKLOG.md's own D28/D30 -- moved off being a
# Docker action so cibuildmp itself can launch sibling per-port containers
# for usermod builds without Docker-in-Docker); its own apt-prerequisites
# step below runs directly on this job's own bare runner now, not inside a
# separate container image.
#
#   template     -- natmod's own C, the minimal case.
#   wasm2mpy     -- native source is WebAssembly, compiled to C via wasm2c
#                   before the normal dynruntime.mk flow takes over (see
#                   examples/wasm2mpy/cibuildmp.toml). Proves the natmod
#                   contract (D2) is genuinely source-language-agnostic.
#   usermod-unix -- usermod's own build path (M9b), all five real unix
#                   arches (x64/x86/aarch64/armhf/mipsel, D20/D24) --
#                   this is what actually proves action.yml's own apt
#                   prerequisites (the ports.ubuntu.com mirror fix,
#                   gcc-aarch64-linux-gnu, gcc-arm-linux-gnueabihf,
#                   gcc-mipsel-linux-gnu, libltdl-dev, libtool) work
#                   through the real composite action, not just in a bare
#                   dev sandbox.
#
# push: (no branches: filter) rather than push: branches: [main] -- this
# needs to run on every push to a dev branch too, not just main, the same
# "no PR without explicit permission" reasoning usermod-dev.yml's own
# header already documents.

on:
  push:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

jobs:
  # D28's own per-(port, arch) Docker images
  # (resources/docker/*.Dockerfile) -- build-only, no push, no GHCR
  # credentials needed at all: this proves each Dockerfile actually
  # builds (the still-open gap every one of these files' own header
  # comments flags -- "not yet built for real via docker build") on
  # every push, independent of publish.yml's own publish-docker job,
  # which is deliberately gated behind a real `v*` release tag and
  # stays that way (image *publishing* is a maintainer decision; image
  # *building* is not, and shouldn't wait on one). `unix` is one image
  # per arch (D26/D31 -- no combined image any more, manylinux only so
  # far); `windows` stays one combined x64+x86 image (no
  # manylinux/musllinux-shaped axis for this port at all).
  verify-docker-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile:
          - unix-manylinux-x64
          - unix-manylinux-x86
          - unix-manylinux-aarch64
          - unix-manylinux-armhf
          - unix-manylinux-mipsel
          - windows
    steps:
      - uses: actions/checkout@v7

      - name: docker build resources/docker/${{ matrix.dockerfile }}.Dockerfile
        run: |
          docker build \
            -t cibuildmp-${{ matrix.dockerfile }}:ci \
            -f src/cibuildmp/resources/docker/${{ matrix.dockerfile }}.Dockerfile \
            .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build examples/template
        uses: ./
        env:
          # Exercises D14's packaging step (extra-files + package.json) on
          # every push -- no real release tag needed for that, this repo
          # ships no module of its own to version.
          CIBMP_VERSION: 0.0.0-ci
        with:
          package-dir: examples/template

      - name: Build examples/wasm2mpy
        uses: ./
        env:
          CIBMP_VERSION: 0.0.0-ci
        with:
          package-dir: examples/wasm2mpy

      - name: Build examples/usermod-unix
        # No CIBMP_VERSION here -- usermod output has no package.json to
        # version at all (D23: it's a full port binary, not a
        # mip.install()-able .mpy), so the env var would just be unused.
        uses: ./
        with:
          package-dir: examples/usermod-unix

      - name: List built artifacts
        run: |
          ls -laR examples/template/mpyhouse
          ls -laR examples/wasm2mpy/mpyhouse
          ls -laR examples/usermod-unix/mpyhouse
          cat examples/template/mpyhouse/*/package.json
