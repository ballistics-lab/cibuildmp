name: Build examples

# cibuildmp's own integration tests: examples/* are real natmod/usermod
# modules, built here with this repo's own root action.yml -- the same
# `uses:` a consumer like bclibc or a7p would write. Green here means the
# actual build path works end to end, not just that --dry-run prints a
# plausible plan. This is also the only real feedback loop for action.yml
# itself: `uses: ./` below runs it for real, something no amount of
# YAML-syntax checking or local shell testing can substitute for. action.yml
# is a composite action (docs/BACKLOG.md's own D28/D30 -- moved off being a
# Docker action so cibuildmp itself can launch sibling per-port containers
# for usermod builds without Docker-in-Docker); its own apt-prerequisites
# step below runs directly on this job's own bare runner now, not inside a
# separate container image.
#
#   template     -- natmod's own C, the minimal case.
#   wasm2mpy     -- native source is WebAssembly, compiled to C via wasm2c
#                   before the normal dynruntime.mk flow takes over (see
#                   examples/wasm2mpy/cibuildmp.toml). Proves the natmod
#                   contract (D2) is genuinely source-language-agnostic.
#   usermod-unix -- usermod's own build path (M9b), all five real unix
#                   arches (x64/x86/aarch64/armhf/mipsel, D20/D24) --
#                   this is what actually proves action.yml's own apt
#                   prerequisites (the ports.ubuntu.com mirror fix,
#                   gcc-aarch64-linux-gnu, gcc-arm-linux-gnueabihf,
#                   gcc-mipsel-linux-gnu, libltdl-dev, libtool) work
#                   through the real composite action, not just in a bare
#                   dev sandbox.
#   usermod-webassembly -- the second usermod port wired to
#                   ensure_image()'s Docker path (D26/D30). No arch axis
#                   at all (one combined image, emsdk baked in), and
#                   Docker-only with no bare-host fallback, unlike unix.
#
# push: (no branches: filter) rather than push: branches: [main] -- this
# needs to run on every push to a dev branch too, not just main, the same
# "no PR without explicit permission" reasoning usermod-dev.yml's own
# header already documents.

on:
  push:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

# Same pattern publish.yml's own concurrency block already uses. A real,
# live-caught gap this session: without this, several rapid-fire pushes to
# the same branch left multiple runs of this workflow racing each other,
# all sharing the identical apt-archives-<hash> GHA cache key (D28's own
# apt-cache step) -- every one of them failed to save it ("Failed to save:
# Unable to reserve cache with key ..., another job may be creating this
# cache"), confirmed directly from real job logs, not guessed. Cancelling
# a superseded run outright (rather than merely serializing them) means
# only the latest commit's own run ever gets to actually save that cache.
concurrency:
  group: build-examples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # D28's own per-(port, arch) Docker images
  # (resources/docker/*.Dockerfile). Builds every one of them on every
  # push (PR too, but never pushes there -- a fork's own PR gets no
  # registry credentials, and shouldn't); on a direct push, a
  # successful build is also pushed to GHCR, tagged by this exact
  # commit's own sha -- immutable, and reachable the moment a build
  # goes green, not gated behind a real `v*` release tag the way
  # publish.yml's own publish-docker job is. The user's own call,
  # revising an earlier "leave this as a TODO" answer: without a real,
  # currently-pullable image, PORT_IMAGES can never actually be
  # exercised end to end on a dev branch -- waiting for a release just
  # to test the mechanism this decision exists to prove isn't
  # reasonable. Deliberately `:sha-<sha>` only, no `:latest` -- a
  # shared mutable tag across arbitrary branches would let one branch's
  # push silently clobber what another branch (or a real release)
  # expects `:latest` to mean; a real stable alias belongs to
  # publish.yml's own release-tag-gated job instead (D28 step 5), not
  # here.
  verify-docker-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        dockerfile:
          - unix-manylinux-x64
          - unix-manylinux-x86
          - unix-manylinux-aarch64
          - unix-manylinux-armhf
          - unix-manylinux-mipsel
          - windows
          - qemu
          - webassembly
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: ${{ github.event_name == 'push' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: docker build resources/docker/${{ matrix.dockerfile }}.Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/cibuildmp/resources/docker/${{ matrix.dockerfile }}.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/cibuildmp-${{ matrix.dockerfile }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build examples/template
        uses: ./
        env:
          # Exercises D14's packaging step (extra-files + package.json) on
          # every push -- no real release tag needed for that, this repo
          # ships no module of its own to version.
          CIBMP_VERSION: 0.0.0-ci
        with:
          package-dir: examples/template

      - name: Build examples/wasm2mpy
        uses: ./
        env:
          CIBMP_VERSION: 0.0.0-ci
        with:
          package-dir: examples/wasm2mpy

      - name: List built artifacts
        run: |
          ls -laR examples/template/mpyhouse
          ls -laR examples/wasm2mpy/mpyhouse
          cat examples/template/mpyhouse/*/package.json

  # Split from `build` above rather than added as one more step there:
  # dockerrun.ensure_image() (D28's own next step) now backs
  # usermod-unix's Docker path by default, so this needs verify-docker-images
  # to actually be worth anything -- without that dependency, this job's
  # own five docker builds would just redo, uncached, on a second GitHub
  # runner with no shared Docker daemon, the exact work verify-docker-images
  # already did *with* a real cache (type=gha) and already pushed to GHCR.
  # template/wasm2mpy above have nothing to do with any of that, so they
  # stay in their own job rather than getting pulled into this wait too.
  build-usermod-unix:
    runs-on: ubuntu-latest
    needs: verify-docker-images
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # verify-docker-images pushes these as private GHCR packages by
      # default (an unauthenticated `docker pull` -- what `docker run
      # --pull missing` does inside dockerrun.run() -- fails "unauthorized"
      # even for a package this same repo owns, caught live: the very
      # first run through this job's own override wiring). Only needed on
      # a push event, matching the env vars below that are the only thing
      # that could ever trigger a real pull here.
      - uses: docker/login-action@v3
        if: ${{ github.event_name == 'push' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build examples/usermod-unix
        # No CIBMP_VERSION here -- usermod output has no package.json to
        # version at all (D23: it's a full port binary, not a
        # mip.install()-able .mpy), so the env var would just be unused.
        #
        # The five overrides below only have a real value to point at on
        # a push event -- verify-docker-images only pushes to GHCR there
        # (a fork's own pull_request gets no registry credentials, by
        # design). On a pull_request run these stay unset (empty-string
        # env vars, correctly ignored: image_for()'s own `if override:`
        # check is truthiness-based, not the `is not None` check that bit
        # ACTION_OUTPUT_DIR under this exact "GHA always sets a step's
        # own env:, even empty" shape -- D28's own ninth bug), so
        # ensure_image() falls through to its own local-build fallback
        # instead -- slower (no gha cache reachable outside that job),
        # but correct, and exactly the same path a consumer with no
        # published image of their own would take.
        uses: ./
        env:
          CIBMP_UNIX_X64_MANYLINUX_DOCKER_IMAGE: ${{ github.event_name == 'push' && format('ghcr.io/{0}/cibuildmp-unix-manylinux-x64:sha-{1}', github.repository_owner, github.sha) || '' }}
          CIBMP_UNIX_X86_MANYLINUX_DOCKER_IMAGE: ${{ github.event_name == 'push' && format('ghcr.io/{0}/cibuildmp-unix-manylinux-x86:sha-{1}', github.repository_owner, github.sha) || '' }}
          CIBMP_UNIX_AARCH64_MANYLINUX_DOCKER_IMAGE: ${{ github.event_name == 'push' && format('ghcr.io/{0}/cibuildmp-unix-manylinux-aarch64:sha-{1}', github.repository_owner, github.sha) || '' }}
          CIBMP_UNIX_ARMHF_MANYLINUX_DOCKER_IMAGE: ${{ github.event_name == 'push' && format('ghcr.io/{0}/cibuildmp-unix-manylinux-armhf:sha-{1}', github.repository_owner, github.sha) || '' }}
          CIBMP_UNIX_MIPSEL_MANYLINUX_DOCKER_IMAGE: ${{ github.event_name == 'push' && format('ghcr.io/{0}/cibuildmp-unix-manylinux-mipsel:sha-{1}', github.repository_owner, github.sha) || '' }}
        with:
          package-dir: examples/usermod-unix

      - name: List built artifacts
        run: ls -laR examples/usermod-unix/mpyhouse

  # webassembly is the second usermod port wired to ensure_image()'s
  # Docker path (D26's own "one port, proven live, before the next" --
  # unix was the first slice, above). Docker-only (docs/BACKLOG.md's
  # D30): unlike unix there is no bare-host fallback to fall back to at
  # all here, so this job is what proves build_webassembly() actually
  # works end to end against a real pushed image, not just that the
  # Dockerfile builds.
  build-usermod-webassembly:
    runs-on: ubuntu-latest
    needs: verify-docker-images
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # Same reasoning as build-usermod-unix's own login step: GHCR
      # packages are private by default, even to this same repo's own
      # pull.
      - uses: docker/login-action@v3
        if: ${{ github.event_name == 'push' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build examples/usermod-webassembly
        # Same reasoning as build-usermod-unix's own step: only has a
        # real value to point at on a push event (verify-docker-images
        # only pushes to GHCR there); on a pull_request run this stays
        # unset and ensure_image() falls through to its own local-build
        # fallback instead.
        uses: ./
        env:
          CIBMP_WEBASSEMBLY_DOCKER_IMAGE: ${{ github.event_name == 'push' && format('ghcr.io/{0}/cibuildmp-webassembly:sha-{1}', github.repository_owner, github.sha) || '' }}
        with:
          package-dir: examples/usermod-webassembly

      - name: List built artifacts
        run: ls -laR examples/usermod-webassembly/mpyhouse
