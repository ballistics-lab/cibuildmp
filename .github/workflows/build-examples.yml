name: Build examples

# cibuildmp's own integration tests: examples/* are real natmod/usermod
# modules, built here with this repo's own root action.yml -- the same
# `uses:` a consumer like bclibc or a7p would write. Green here means the
# actual build path works end to end, not just that --dry-run prints a
# plausible plan. This is also the only real feedback loop for action.yml
# itself: `uses: ./` below runs it for real, something no amount of
# YAML-syntax checking or local shell testing can substitute for. action.yml
# is a composite action (docs/BACKLOG.md's own D28/D30 -- moved off being a
# Docker action so cibuildmp itself can launch sibling per-port containers
# for usermod builds without Docker-in-Docker); its own apt-prerequisites
# step below runs directly on this job's own bare runner now, not inside a
# separate container image.
#
#   template -- natmod/, usermod/ and src/ as siblings under one project,
#               the real downstream layout (micropython-bclibc's and
#               a7p/micropython's own cibuildmp.toml), not a separate
#               example directory per mode. natmod/template.c and
#               usermod/template/template.c both wrap the exact same
#               src/template_core.c (see that file's own header comment)
#               instead of two independent implementations that happen to
#               agree, and src/facade.py is the shared Python-level API
#               above it -- copied alongside template.mpy on the natmod
#               side ([publish] extra-files), frozen into the firmware
#               image on the usermod side (usermod/manifest.py). Built
#               twice, `CIBMP_PLATFORM=natmod` then `=usermod` (the
#               config now has both tables, so detect_mode() cannot infer
#               which one alone) -- natmod's own five bare-host arches
#               below, usermod's own five real unix arches
#               (x64/x86/aarch64/armhf/mipsel, D20/D24) plus webassembly
#               (D26/D30's Docker-only path) in build-usermod, which is
#               what actually proves action.yml's own apt prerequisites
#               (the ports.ubuntu.com mirror fix, gcc-aarch64-linux-gnu,
#               gcc-arm-linux-gnueabihf, gcc-mipsel-linux-gnu, libltdl-dev,
#               libtool) work through the real composite action, not just
#               in a bare dev sandbox.
#   wasm2mpy -- native source is WebAssembly, compiled to C via wasm2c
#               before the normal dynruntime.mk flow takes over (see
#               examples/wasm2mpy/cibuildmp.toml). Proves the natmod
#               contract (D2) is genuinely source-language-agnostic.
#
# push: (no branches: filter) rather than push: branches: [main] -- this
# needs to run on every push to a dev branch too, not just main, the same
# "no PR without explicit permission" reasoning usermod-dev.yml's own
# header already documents.

on:
  push:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

# Same pattern publish.yml's own concurrency block already uses. A real,
# live-caught gap this session: without this, several rapid-fire pushes to
# the same branch left multiple runs of this workflow racing each other,
# all sharing the identical apt-archives-<hash> GHA cache key (D28's own
# apt-cache step) -- every one of them failed to save it ("Failed to save:
# Unable to reserve cache with key ..., another job may be creating this
# cache"), confirmed directly from real job logs, not guessed. Cancelling
# a superseded run outright (rather than merely serializing them) means
# only the latest commit's own run ever gets to actually save that cache.
concurrency:
  group: build-examples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # D28's own per-(port, arch) Docker images (docker/*.Dockerfile, repo
  # root -- see pyproject.toml's own comment for why they moved out of
  # src/cibuildmp/resources/). Build-only, on every push AND pull_request
  # (a fork's own PR included -- no registry credentials needed for a
  # build that never pushes), catching a broken Dockerfile fast, on the
  # PR itself, the same "surfaces before release time, not after" split
  # publish.yml's own build job already documents for the same reason.
  #
  # Publishing is a genuinely separate concern now, not this job's own
  # `push: true` branch any more: .github/workflows/publish-docker-images.yml
  # is the "real, out-of-band maintainer task" cibuildwheel's own
  # bin/update_docker.py is for quay.io's manylinux/musllinux pins --
  # triggered by a push to main, not every push to every branch, and
  # pins by digest, not `:sha-<gitsha>`/`:latest`. `usermod/dockerrun.py`'s
  # own PORT_IMAGES is what a maintainer updates from that workflow's own
  # output; nothing here feeds it any more (the CIBMP_*_DOCKER_IMAGE
  # override dance that used to point build-usermod at this job's own
  # per-push GHCR pushes is gone -- a real end user was never going to
  # think about that env var, and cibuildwheel's own container runtime
  # never builds an image to begin with, only ever pulls a pin).
  verify-docker-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One arch's upstream base going missing should not cancel the
      # seventeen cells that are fine -- and with emulated builds in the
      # matrix, a cancelled run wastes far more than it saves.
      fail-fast: false
      matrix:
        # Record 0043: same eighteen (image, platform) pairs
        # publish-docker-images.yml pushes, build-checked here on every
        # push instead. The platform matters as much as the file does now
        # -- a `manylinux_2_28_aarch64` that only builds as amd64 is not
        # the image that cell means, and without `platforms:` that is
        # silently what a build on an amd64 runner would produce.
        include:
          - { image: manylinux_2_28_x86_64, platform: linux/amd64 }
          - { image: musllinux_1_2_x86_64, platform: linux/amd64 }
          - { image: manylinux_2_28_i686, platform: linux/386 }
          - { image: musllinux_1_2_i686, platform: linux/386 }
          - { image: manylinux_2_28_aarch64, platform: linux/arm64 }
          - { image: musllinux_1_2_aarch64, platform: linux/arm64 }
          - { image: manylinux_2_28_ppc64le, platform: linux/ppc64le }
          - { image: musllinux_1_2_ppc64le, platform: linux/ppc64le }
          - { image: manylinux_2_28_s390x, platform: linux/s390x }
          - { image: musllinux_1_2_s390x, platform: linux/s390x }
          - { image: manylinux_2_31_armv7l, platform: linux/arm/v7 }
          - { image: musllinux_1_2_armv7l, platform: linux/arm/v7 }
          - { image: manylinux_2_39_riscv64, platform: linux/riscv64 }
          - { image: musllinux_1_2_riscv64, platform: linux/riscv64 }
          - { image: manylinux_2_39_mipsel, platform: linux/amd64 }
          - { image: windows, platform: linux/amd64 }
          - { image: qemu, platform: linux/amd64 }
          - { image: webassembly, platform: linux/amd64 }
    steps:
      - uses: actions/checkout@v7

      # Needed to build a non-amd64 image at all: the `dnf`/`apk` step
      # inside those bases runs foreign binaries.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: docker build docker/${{ matrix.image }}.Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build examples/template (natmod)
        uses: ./
        env:
          # examples/template/cibuildmp.toml now has both [natmod] and
          # [usermod] (natmod/, usermod/ and src/ as siblings, the real
          # downstream layout -- see that file's own header comment), so
          # detect_mode() can no longer infer which table this invocation
          # means. CIBMP_PLATFORM, not a dedicated action.yml input --
          # the same generic env-override every cibuildmp.toml key
          # already has, matching cibuildwheel's own CIBW_BUILD shape.
          CIBMP_PLATFORM: "natmod"
          # Exercises D14's packaging step (extra-files + package.json) on
          # every push -- no real release tag needed for that, this repo
          # ships no module of its own to version.
          CIBMP_VERSION: 0.0.0-ci
        with:
          package-dir: examples/template

      - name: Build examples/wasm2mpy
        uses: ./
        env:
          CIBMP_PLATFORM: "natmod"
          CIBMP_VERSION: 0.0.0-ci
        with:
          package-dir: examples/wasm2mpy

      - name: List built artifacts
        run: |
          ls -laR examples/template/mpyhouse
          ls -laR examples/wasm2mpy/mpyhouse
          cat examples/template/mpyhouse/*/package.json

  # Split from `build` above rather than added as one more step there:
  # dockerrun.ensure_image() (D28's own next step) now backs the usermod
  # side of examples/template by default, so this needs
  # verify-docker-images to actually be worth anything -- without that
  # dependency, this job's own five docker builds would just redo,
  # uncached, on a second GitHub runner with no shared Docker daemon, the
  # exact work verify-docker-images already did *with* a real cache
  # (type=gha) and already pushed to GHCR. `build` above only exercises
  # examples/template's own natmod side plus wasm2mpy, neither of which
  # touches Docker at all, so they stay in their own job rather than
  # getting pulled into this wait too.
  #
  # webassembly is the second usermod port wired to ensure_image()'s
  # Docker path (D26's own "one port, proven live, before the next" --
  # unix was the first slice, above). Docker-only (docs/BACKLOG.md's
  # D30): unlike unix there is no bare-host fallback to fall back to at
  # all here, so this job is what proves build_webassembly() actually
  # works end to end against a real pushed image, not just that the
  # Dockerfile builds.
  #
  # No docker/login-action, no CIBMP_*_DOCKER_IMAGE overrides pointed at
  # verify-docker-images' own pushed :sha-<sha> tags -- the user's own
  # call, checked against cibuildwheel's real source first: cibuildwheel
  # never builds its own manylinux/musllinux images at runtime at all
  # (zero `docker build`/`buildx` anywhere in its repo) -- its container
  # runtime (`oci_container.py`) only ever does a plain `docker pull` of
  # an already-published, digest-pinned image
  # (`resources/pinned_docker_images.cfg`); building one is a rare,
  # out-of-band maintainer task (`bin/update_docker.py`), never part of a
  # consumer's own CI. `PORT_IMAGES` (dockerrun.py) is cibuildmp's own
  # future equivalent of that pinned config -- empty today, since no
  # `v*`-tagged release has populated it yet (D28 step 5) -- so
  # per-commit GHCR sha-tags were never going to be the same thing that
  # config is, just a shape that could be made to resemble it. Real
  # coverage of `image_for()`'s own pull-a-real-image branch belongs to
  # `publish.yml`'s own release-tag-gated job once D28 step 5 lands, not
  # a standing fixture in this dev-branch workflow. ensure_image()'s own
  # local-build fallback (dockerrun.py's own `_build_command()`) already
  # does `docker buildx build --cache-from/--cache-to type=gha,scope=
  # <dockerfile stem>`, the same scope verify-docker-images populates a
  # few minutes earlier in this same workflow run -- `needs:
  # verify-docker-images` stays so that cache is warm before this job
  # starts, not because anything here still pulls what that job pushes.
  build-usermod:
    runs-on: ubuntu-latest
    needs: verify-docker-images
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Records 0043/0044: `unix`'s default targets are native images for
      # their own architectures, so on this amd64 runner the aarch64 and
      # armv7l ones run emulated. cibuildmp deliberately does not install
      # emulation itself -- cibuildwheel's rule, and binfmt registration
      # is a machine-level setting rather than a build input -- so the
      # job that needs it sets it up, exactly as a consumer's own
      # workflow has to. Without this the build stops early with a
      # message naming the missing binfmt, which is the point of
      # `dockerrun._probe_platform()`.
      - uses: docker/setup-qemu-action@v4

      - name: Build examples/template (usermod)
        # No CIBMP_VERSION here -- usermod output has no package.json to
        # version at all (D23: it's a full port binary, not a
        # mip.install()-able .mpy), so the env var would just be unused.
        uses: ./
        env:
          CIBMP_PLATFORM: "usermod"
        with:
          package-dir: examples/template

      - name: List built artifacts
        run: ls -laR examples/template/mpyhouse
