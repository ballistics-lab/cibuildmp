name: Build examples

# cibuildmp's own integration tests: examples/* are real natmod/usermod
# modules, built here with this repo's own root action.yml -- the same
# `uses:` a consumer like bclibc or a7p would write. Green here means the
# actual build path works end to end, not just that --dry-run prints a
# plausible plan. This is also the only real feedback loop for action.yml
# itself: `uses: ./` below runs it for real, something no amount of
# YAML-syntax checking or local shell testing can substitute for. action.yml
# is a composite action (docs/BACKLOG.md's own D28/D30 -- moved off being a
# Docker action so cibuildmp itself can launch sibling per-port containers
# for usermod builds without Docker-in-Docker); its own apt-prerequisites
# step below runs directly on this job's own bare runner now, not inside a
# separate container image.
#
#   template -- natmod/, usermod/ and src/ as siblings under one project,
#               the real downstream layout (micropython-bclibc's and
#               a7p/micropython's own cibuildmp.toml), not a separate
#               example directory per mode. natmod/template.c and
#               usermod/template/template.c both wrap the exact same
#               src/template_core.c (see that file's own header comment)
#               instead of two independent implementations that happen to
#               agree, and src/facade.py is the shared Python-level API
#               above it -- copied alongside template.mpy on the natmod
#               side ([publish] extra-files), frozen into the firmware
#               image on the usermod side (usermod/manifest.py). Built
#               twice, `CIBMP_PLATFORM=natmod` then `=usermod` (the
#               config now has both tables, so detect_mode() cannot infer
#               which one alone) -- natmod's own five bare-host arches
#               below, usermod's own five real unix arches
#               (x64/x86/aarch64/armhf/mipsel, D20/D24) plus webassembly
#               (D26/D30's Docker-only path) in build-usermod, which is
#               what actually proves action.yml's own apt prerequisites
#               (the ports.ubuntu.com mirror fix, gcc-aarch64-linux-gnu,
#               gcc-arm-linux-gnueabihf, gcc-mipsel-linux-gnu, libltdl-dev,
#               libtool) work through the real composite action, not just
#               in a bare dev sandbox.
#   wasm2mpy -- native source is WebAssembly, compiled to C via wasm2c
#               before the normal dynruntime.mk flow takes over (see
#               examples/wasm2mpy/cibuildmp.toml). Proves the natmod
#               contract (D2) is genuinely source-language-agnostic.
#
# push: (no branches: filter) rather than push: branches: [main] -- this
# needs to run on every push to a dev branch too, not just main, the same
# "no PR without explicit permission" reasoning usermod-dev.yml's own
# header already documents.

on:
  push:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

# Same pattern publish.yml's own concurrency block already uses. A real,
# live-caught gap this session: without this, several rapid-fire pushes to
# the same branch left multiple runs of this workflow racing each other,
# all sharing the identical apt-archives-<hash> GHA cache key (D28's own
# apt-cache step) -- every one of them failed to save it ("Failed to save:
# Unable to reserve cache with key ..., another job may be creating this
# cache"), confirmed directly from real job logs, not guessed. Cancelling
# a superseded run outright (rather than merely serializing them) means
# only the latest commit's own run ever gets to actually save that cache.
concurrency:
  group: build-examples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build examples/template (natmod)
        uses: ./
        env:
          # examples/template/cibuildmp.toml now has both [natmod] and
          # [usermod] (natmod/, usermod/ and src/ as siblings, the real
          # downstream layout -- see that file's own header comment), so
          # detect_mode() can no longer infer which table this invocation
          # means. CIBMP_PLATFORM, not a dedicated action.yml input --
          # the same generic env-override every cibuildmp.toml key
          # already has, matching cibuildwheel's own CIBW_BUILD shape.
          CIBMP_PLATFORM: "natmod"
          # Exercises D14's packaging step (extra-files + package.json) on
          # every push -- no real release tag needed for that, this repo
          # ships no module of its own to version.
          CIBMP_VERSION: 0.0.0-ci
        with:
          package-dir: examples/template

      - name: Build examples/wasm2mpy
        uses: ./
        env:
          CIBMP_PLATFORM: "natmod"
          CIBMP_VERSION: 0.0.0-ci
        with:
          package-dir: examples/wasm2mpy

      - name: List built artifacts
        run: |
          ls -laR examples/template/mpyhouse
          ls -laR examples/wasm2mpy/mpyhouse
          cat examples/template/mpyhouse/*/package.json

  # Split from `build` above rather than added as one more step there:
  # the usermod side of examples/template runs every build inside a
  # container (D26/D30), while `build` above exercises only the natmod
  # side plus wasm2mpy, neither of which touches Docker at all. Keeping
  # them separate is what lets the Docker-shaped half fan out per target
  # without dragging the other two into the same wait.
  #
  # The paragraph that used to sit here argued this job needed
  # `verify-docker-images` so its own docker builds would not "redo,
  # uncached, the work that job already did". That is no longer what
  # happens at all: cibuildmp builds no image (record 0033 removed the
  # fallback) and pulls a published digest instead, so there is no local
  # build to share a cache with. See the note on the removed `needs:`
  # below.
  #
  # webassembly is the second usermod port wired to ensure_image()'s
  # Docker path (D26's own "one port, proven live, before the next" --
  # unix was the first slice, above). Docker-only (docs/BACKLOG.md's
  # D30): unlike unix there is no bare-host fallback to fall back to at
  # all here, so this job is what proves build_webassembly() actually
  # works end to end against a real pushed image, not just that the
  # Dockerfile builds.
  #
  # No docker/login-action and no CIBMP_*_DOCKER_IMAGE overrides here --
  # the user's own call, checked against cibuildwheel's real source
  # first: cibuildwheel never builds its own manylinux/musllinux images
  # at runtime at all (zero `docker build`/`buildx` anywhere in its
  # repo); its container runtime only ever does a plain `docker pull` of
  # an already-published, digest-pinned image. cibuildmp does the same,
  # and `resources/pinned_docker_images.toml` is that pin table -- every
  # cell filled from a real publish-docker-images.yml run (record 0044),
  # so these jobs pull published digests anonymously, exactly as a
  # consumer would.
  #
  # **This job used to carry `needs: verify-docker-images`**, and that
  # dependency is gone with the image build-check itself
  # (`.github/workflows/verify-docker-images.yml` now). Worth recording
  # why rather than just deleting it: it was never about ordering
  # correctness. It existed so a GHA build cache would be warm before
  # `ensure_image()`'s own local-build fallback ran `docker buildx build
  # --cache-from/--cache-to type=gha,scope=<dockerfile stem>`. **Record
  # 0033 deleted that fallback** -- there is no `_build_command()` in
  # `dockerrun.py` any more, and no `buildx` anywhere in `src/` -- so the
  # dependency's entire stated reason had been referring to a function
  # that no longer exists. What it still did was serialize: this job could
  # not start until eighteen image build-checks, thirteen of them
  # emulated, had finished.

  # ── usermod: one job per target ─────────────────────────────────────
  #
  # Fanned out rather than one job looping over every target -- the
  # opt-in layout D9 describes, using the `cibuildmp-matrix` action and
  # the `only` input that have existed for exactly this since D20 and
  # never had a caller here.
  #
  # The reason is measured, not stylistic. Records 0043/0044 made every
  # `unix` target a native image for its own architecture, so on an
  # amd64 runner three of the five defaults (`i686`, `aarch64`,
  # `armv7l`) run under emulation -- and an emulated build is roughly
  # 20x a native one on the same machine (0044: 46s native x86_64
  # against 1041s emulated aarch64). Looping makes the run the *sum* of
  # those; fanning out makes it the *maximum*. It also buys per-target
  # failure isolation, which matters more now that ten of the fifteen
  # cells have never been built.
  #
  # What this does not buy: emulation getting any faster. The slowest
  # leg still sets the wall clock. The real fix for that is 0045's
  # `auto`/`native` arch vocabulary (build natively here, everything
  # else opt-in), or a runner that is actually arm64 -- which cibuildmp
  # cannot emit today, since `UsermodTarget.default_runner` is a
  # hardcoded `ubuntu-latest` (0043's own first observation). The matrix
  # already carries `os` per entry precisely so that can change without
  # touching this workflow.
  usermod-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      include: ${{ steps.matrix.outputs.include }}
      optin: ${{ steps.optin.outputs.include }}
    steps:
      - uses: actions/checkout@v7

      - id: matrix
        uses: ./.github/actions/cibuildmp-matrix
        env:
          # examples/template has both [natmod] and [usermod], so
          # detect_mode() cannot infer which one is meant -- the same
          # explicit env this workflow's other usermod steps set.
          CIBMP_PLATFORM: "usermod"
        with:
          package-dir: examples/template

      # The musllinux column, resolved separately because it is not what
      # this config selects. Record 0031 proved the *mechanism* on
      # `musllinux_1_2_x86_64` -- a real musl link, zero GLIBC_ symbols,
      # the C module and the frozen module both running -- but that was
      # one cell, built by hand, and the column has had no CI leg since.
      #
      # These four rather than all seven: they are exactly the musl cells
      # with a runner they are native to (`x86_64`/`i686` on amd64,
      # `aarch64`/`armv7l` on the arm64 runner record 0044 measured).
      # `ppc64le`, `s390x` and `riscv64` are emulated on every runner
      # GitHub offers, and Alpine's own community/micropython excludes
      # the first two outright (`arch="all !ppc64le !s390x"`), so they are
      # a separate decision about cost rather than more of this one.
      #
      # Resolved through the action's own `only` input, not written out as
      # {only, os} pairs here, so the runner still comes from
      # UsermodTarget.default_runner -- see that input's own description.
      - id: optin
        uses: ./.github/actions/cibuildmp-matrix
        env:
          CIBMP_PLATFORM: "usermod"
        with:
          package-dir: examples/template
          only: |
            unix-musllinux_1_2_x86_64
            unix-musllinux_1_2_i686
            unix-musllinux_1_2_aarch64
            unix-musllinux_1_2_armv7l

  build-usermod:
    needs: usermod-matrix
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # One target failing should not cancel the others -- with most of
      # the matrix unproven, the useful outcome of a run is knowing
      # *which* cells work, not stopping at the first that does not.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.usermod-matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v7

      # Records 0043/0044: `unix`'s default targets are native images for
      # their own architectures, so on this amd64 runner the aarch64 and
      # armv7l ones run emulated. cibuildmp deliberately does not install
      # emulation itself -- cibuildwheel's rule, and binfmt registration
      # is a machine-level setting rather than a build input -- so the
      # job that needs it sets it up, exactly as a consumer's own
      # workflow has to. Without this the build stops early with a
      # message naming the missing binfmt, which is the point of
      # `dockerrun._probe_platform()`.
      - uses: docker/setup-qemu-action@v4

      - name: Build examples/template (usermod, ${{ matrix.only }})
        # No CIBMP_VERSION here -- usermod output has no package.json to
        # version at all (D23: it's a full port binary, not a
        # mip.install()-able .mpy), so the env var would just be unused.
        uses: ./
        env:
          CIBMP_PLATFORM: "usermod"
        with:
          package-dir: examples/template
          only: ${{ matrix.only }}

      - name: List built artifacts
        run: ls -laR examples/template/mpyhouse

  # ── usermod: the opt-in cells ───────────────────────────────────────
  #
  # Same job as above in every respect except which identifiers it runs.
  # Split rather than concatenated into one matrix on purpose: these
  # cells were unproven when the job was added, and a red leg here must
  # not be able to hide a regression in the six that are green.
  #
  # **It carried `continue-on-error: true` for exactly one run.** That is
  # the difference between "we know which of these work" and "these are
  # required", and the first run (32960761641) answered the first
  # question: three of four green immediately, and
  # `musllinux_1_2_aarch64` failing on the same gcc 14 `mbedtls_xor`
  # false positive `manylinux_2_28_aarch64` already had a suppression
  # for -- which turned out to be an architecture rule filed as a
  # per-cell one (record 0044's second addendum). With that moved, all
  # four pass (32961216804), so the flag is off and these are required
  # like everything else.
  #
  # The three musl cells that are *not* here -- `ppc64le`, `s390x`,
  # `riscv64` -- are emulated on every runner GitHub offers, and Alpine's
  # own community/micropython excludes the first two outright. They are a
  # decision about cost, not more of this one.
  build-usermod-optin:
    needs: usermod-matrix
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.usermod-matrix.outputs.optin) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - name: Build examples/template (usermod, ${{ matrix.only }})
        uses: ./
        env:
          CIBMP_PLATFORM: "usermod"
        with:
          package-dir: examples/template
          only: ${{ matrix.only }}

      - name: List built artifacts
        run: ls -laR examples/template/mpyhouse
