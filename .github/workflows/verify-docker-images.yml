name: Verify Docker images

# Build-checks every image in `docker/`, on its own trigger.
#
# Split out of build-examples.yml, where it had been a job the example
# builds depended on. Two things made that placement wrong once records
# 0043/0044 landed:
#
#   * **The dependency had lost its reason.** `build-usermod` carried
#     `needs: verify-docker-images` so a GHA build cache would be warm
#     before `ensure_image()`'s own local-build fallback ran `docker
#     buildx build --cache-to type=gha`. Record 0033 deleted that
#     fallback -- cibuildmp never builds an image, it only pulls a pinned
#     digest -- so the dependency served nothing but serialization: the
#     example builds could not start until eighteen image build-checks,
#     thirteen of them emulated, had finished.
#   * **The trigger was wrong.** build-examples.yml runs on every push.
#     These eighteen builds only ever change when a Dockerfile or a
#     pinned base does, so `paths:` below is what stops a docs-adjacent
#     push from re-emulating an s390x `dnf install`.
#
# `pinned_pypa_images.toml` is in `paths:` deliberately: it holds the
# `FROM` digests, so bumping a base changes what these images *are* even
# when no Dockerfile is touched.
#
# Build-only, and on pull_request too -- a fork's own PR included, since
# a build that never pushes needs no registry credentials. Publishing is
# a separate, out-of-band maintainer task
# (.github/workflows/publish-docker-images.yml), pinned by digest into
# resources/pinned_docker_images.toml; nothing here feeds that table.

on:
  push:
    paths:
      - "docker/**"
      - "src/cibuildmp/resources/pinned_pypa_images.toml"
      - ".github/workflows/verify-docker-images.yml"
  pull_request:
    paths:
      - "docker/**"
      - "src/cibuildmp/resources/pinned_pypa_images.toml"
      - ".github/workflows/verify-docker-images.yml"

concurrency:
  group: verify-docker-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-docker-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One arch's upstream base going missing should not cancel the
      # seventeen cells that are fine -- and with emulated builds in the
      # matrix, a cancelled run wastes far more than it saves.
      fail-fast: false
      matrix:
        # Record 0043: same eighteen (image, platform) pairs
        # publish-docker-images.yml pushes, build-checked here on every
        # push instead. The platform matters as much as the file does now
        # -- a `manylinux_2_28_aarch64` that only builds as amd64 is not
        # the image that cell means, and without `platforms:` that is
        # silently what a build on an amd64 runner would produce.
        include:
          - { image: manylinux_2_28_x86_64, platform: linux/amd64 }
          - { image: musllinux_1_2_x86_64, platform: linux/amd64 }
          - { image: manylinux_2_28_i686, platform: linux/386 }
          - { image: musllinux_1_2_i686, platform: linux/386 }
          - { image: manylinux_2_28_aarch64, platform: linux/arm64 }
          - { image: musllinux_1_2_aarch64, platform: linux/arm64 }
          - { image: manylinux_2_28_ppc64le, platform: linux/ppc64le }
          - { image: musllinux_1_2_ppc64le, platform: linux/ppc64le }
          - { image: manylinux_2_28_s390x, platform: linux/s390x }
          - { image: musllinux_1_2_s390x, platform: linux/s390x }
          - { image: manylinux_2_31_armv7l, platform: linux/arm/v7 }
          - { image: musllinux_1_2_armv7l, platform: linux/arm/v7 }
          - { image: manylinux_2_39_riscv64, platform: linux/riscv64 }
          - { image: musllinux_1_2_riscv64, platform: linux/riscv64 }
          - { image: manylinux_2_39_mipsel, platform: linux/amd64 }
          - { image: windows, platform: linux/amd64 }
          - { image: qemu, platform: linux/amd64 }
          - { image: webassembly, platform: linux/amd64 }
    steps:
      - uses: actions/checkout@v7

      # Needed to build a non-amd64 image at all: the `dnf`/`apk` step
      # inside those bases runs foreign binaries.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: docker build docker/${{ matrix.image }}.Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

