name: Verify Docker images

# Build-checks every image in `docker/`, on its own trigger.
#
# Split out of build-examples.yml, where it had been a job the example
# builds depended on. Two things made that placement wrong once records
# 0043/0044 landed:
#
#   * **The dependency had lost its reason.** `build-usermod` carried
#     `needs: verify-docker-images` so a GHA build cache would be warm
#     before `ensure_image()`'s own local-build fallback ran `docker
#     buildx build --cache-to type=gha`. Record 0033 deleted that
#     fallback -- cibuildmp never builds an image, it only pulls a pinned
#     digest -- so the dependency served nothing but serialization: the
#     example builds could not start until eighteen image build-checks,
#     thirteen of them emulated, had finished.
#   * **The trigger was wrong.** build-examples.yml runs on every push.
#     These eighteen builds only ever change when a Dockerfile or a
#     pinned base does, so `paths:` below is what stops a docs-adjacent
#     push from re-emulating an s390x `dnf install`.
#
# `pinned_pypa_images.toml` is in `paths:` deliberately: it holds the
# `FROM` digests, so bumping a base changes what these images *are* even
# when no Dockerfile is touched.
#
# Build-only, and on pull_request too -- a fork's own PR included, since
# a build that never pushes needs no registry credentials. Publishing is
# a separate, out-of-band maintainer task
# (.github/workflows/publish-docker-images.yml), pinned by digest into
# resources/pinned_docker_images.toml; nothing here feeds that table.

on:
  push:
    paths:
      - "docker/**"
      - "src/cibuildmp/resources/pinned_pypa_images.toml"
      - ".github/workflows/verify-docker-images.yml"
  pull_request:
    paths:
      - "docker/**"
      - "src/cibuildmp/resources/pinned_pypa_images.toml"
      - ".github/workflows/verify-docker-images.yml"

concurrency:
  group: verify-docker-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-docker-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One arch's upstream base going missing should not cancel the
      # other cells that are fine.
      fail-fast: false
      matrix:
        # Record 0043: same (image, platform) pairs
        # publish-docker-images.yml pushes, build-checked here on every
        # push instead. The platform matters as much as the file does now
        # -- a mismatched platform is not the image a cell means, and
        # without `platforms:` that is silently what a build on an amd64
        # runner would produce.
        #
        # Every `unix` cell but `mipsel` has no Dockerfile at all any
        # more -- each was verified to be a bare `FROM` and nothing else
        # (the five `manylinux_2_28_*` cells joined the other nine once
        # `MICROPY_STANDALONE=1` went universal and `libffi-devel` stopped
        # being read by anything -- record 0084's own addendum), so
        # `pinned_docker_images.toml` points all fourteen straight at
        # `pinned_pypa_images.toml`'s own digest instead. Nothing here
        # builds them because there is nothing of cibuildmp's own to
        # build-check.
        include:
          - { image: manylinux_2_41_mipsel, platform: linux/amd64 }
          - { image: windows, platform: linux/amd64 }
          - { image: webassembly, platform: linux/amd64 }
          # The five toolchain-group images record 0058 splits
          # natmod.Dockerfile/qemu.Dockerfile into -- see
          # publish-docker-images.yml's own matrix for why each is
          # linux/amd64. `arm_embedded`/`riscv_embedded` merged into
          # `embedded_base` in record 0096.
          - { image: embedded_base, platform: linux/amd64 }
          - { image: xtensa_lx106, platform: linux/amd64 }
          - { image: xtensa_esp, platform: linux/amd64 }
          - { image: natmod_host, platform: linux/amd64 }
          - { image: ppc64le_linux, platform: linux/amd64 }
          - { image: esp_idf_base, platform: linux/amd64 }
    steps:
      - uses: actions/checkout@v7

      # No `docker/setup-qemu-action` here any more: every remaining
      # matrix entry is `linux/amd64` (the five `manylinux_2_28_*` rows
      # were the only non-amd64 ones -- see the matrix's own comment).
      - uses: docker/setup-buildx-action@v4

      # `docker build` alone did not used to catch the incident
      # docs/records/0068's third correction and 0058's own correction
      # describe -- `apt install gcc-13-multilib` succeeded regardless of
      # which gcc `build-essential` actually resolved to, so the
      # `ubuntu:24.04` -> `ubuntu:26.04` bump built clean here while every
      # real `-m32` link needing a libgcc symbol failed outright
      # downstream. Fixed at the source rather than with a second check
      # bolted on here: `docker/natmod_host.Dockerfile`'s own `RUN` now
      # compiles and links an explicit 64-bit multiply (no native i386
      # instruction for it, so it unconditionally needs `__muldi3` from
      # libgcc) through both of `x86`'s toolchains before the layer
      # finishes, so `docker build` itself fails the moment either one
      # stops actually linking -- here, in a local build, and in
      # `publish-docker-images.yml`, not only in a job that happens to
      # run the image afterward.
      - name: docker build docker/${{ matrix.image }}.Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

