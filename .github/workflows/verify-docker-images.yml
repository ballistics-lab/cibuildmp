name: Verify Docker images

# Build-checks every image in `docker/`, on its own trigger.
#
# Split out of build-examples.yml, where it had been a job the example
# builds depended on. Two things made that placement wrong once records
# 0043/0044 landed:
#
#   * **The dependency had lost its reason.** `build-usermod` carried
#     `needs: verify-docker-images` so a GHA build cache would be warm
#     before `ensure_image()`'s own local-build fallback ran `docker
#     buildx build --cache-to type=gha`. Record 0033 deleted that
#     fallback -- cibuildmp never builds an image, it only pulls a pinned
#     digest -- so the dependency served nothing but serialization: the
#     example builds could not start until eighteen image build-checks,
#     thirteen of them emulated, had finished.
#   * **The trigger was wrong.** build-examples.yml runs on every push.
#     These eighteen builds only ever change when a Dockerfile or a
#     pinned base does, so `paths:` below is what stops a docs-adjacent
#     push from re-emulating an s390x `dnf install`.
#
# `pinned_pypa_images.toml` is in `paths:` deliberately: it holds the
# `FROM` digests, so bumping a base changes what these images *are* even
# when no Dockerfile is touched.
#
# Build-only, and on pull_request too -- a fork's own PR included, since
# a build that never pushes needs no registry credentials. Publishing is
# a separate, out-of-band maintainer task
# (.github/workflows/publish-docker-images.yml), pinned by digest into
# resources/pinned_docker_images.toml; nothing here feeds that table.

on:
  push:
    paths:
      - "docker/**"
      - "src/cibuildmp/resources/pinned_pypa_images.toml"
      - ".github/workflows/verify-docker-images.yml"
  pull_request:
    paths:
      - "docker/**"
      - "src/cibuildmp/resources/pinned_pypa_images.toml"
      - ".github/workflows/verify-docker-images.yml"

concurrency:
  group: verify-docker-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-docker-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One arch's upstream base going missing should not cancel the
      # other cells that are fine -- and with emulated builds in the
      # matrix, a cancelled run wastes far more than it saves.
      fail-fast: false
      matrix:
        # Record 0043: same (image, platform) pairs
        # publish-docker-images.yml pushes, build-checked here on every
        # push instead. The platform matters as much as the file does now
        # -- a `manylinux_2_28_aarch64` that only builds as amd64 is not
        # the image that cell means, and without `platforms:` that is
        # silently what a build on an amd64 runner would produce.
        #
        # armv7l's `manylinux_2_31`, riscv64's `manylinux_2_39`, and every
        # `musllinux_1_2` cell have no Dockerfile at all any more -- each
        # was verified to be a bare `FROM` and nothing else, so
        # `pinned_docker_images.toml` points those nine cells straight at
        # `pinned_pypa_images.toml`'s own digest instead. Nothing here
        # builds them because there is nothing of cibuildmp's own to
        # build-check.
        include:
          - { image: manylinux_2_28_x86_64, platform: linux/amd64 }
          - { image: manylinux_2_28_i686, platform: linux/386 }
          - { image: manylinux_2_28_aarch64, platform: linux/arm64 }
          - { image: manylinux_2_28_ppc64le, platform: linux/ppc64le }
          - { image: manylinux_2_28_s390x, platform: linux/s390x }
          - { image: manylinux_2_41_mipsel, platform: linux/amd64 }
          - { image: windows, platform: linux/amd64 }
          - { image: webassembly, platform: linux/amd64 }
          # The six toolchain-group images record 0058 splits
          # natmod.Dockerfile/qemu.Dockerfile into -- see
          # publish-docker-images.yml's own matrix for why each is
          # linux/amd64.
          - { image: arm_embedded, platform: linux/amd64 }
          - { image: riscv_embedded, platform: linux/amd64 }
          - { image: xtensa_lx106, platform: linux/amd64 }
          - { image: xtensa_esp, platform: linux/amd64 }
          - { image: natmod_host, platform: linux/amd64 }
          - { image: ppc64le_linux, platform: linux/amd64 }
          - { image: esp_idf_base, platform: linux/amd64 }
    steps:
      - uses: actions/checkout@v7

      # Needed to build a non-amd64 image at all: the `dnf`/`apk` step
      # inside those bases runs foreign binaries.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: docker build docker/${{ matrix.image }}.Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: ${{ matrix.image == 'natmod_host' }}
          tags: cibuildmp-${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # `docker build` alone never caught the incident docs/records/0068's
      # third correction and 0058's own correction describe: `apt install
      # gcc-13-multilib` succeeds regardless of which gcc `build-essential`
      # actually resolves to, so a base-image bump that moves that default
      # (ubuntu:24.04's gcc 13 -> ubuntu:26.04's gcc 15) built clean here
      # while every real `-m32` link needing a libgcc symbol (soft-float,
      # 64-bit arithmetic) failed outright downstream. Neither
      # `examples/template` nor upstream's own `examples/natmod/features0`
      # exercises this either -- both link clean on `x86` regardless,
      # verified live: `mpy_ld.py` only loads libgcc.a when an actual
      # undefined symbol sends it looking, and neither module's C ever
      # produces one. A module choosing to exercise this by accident is
      # not something to depend on, so this probes the toolchain directly:
      # an explicit 64-bit multiply has no native i386 instruction and
      # unconditionally needs `__muldi3` from libgcc, on both halves of
      # this image's own dual `x86` toolchain ([0058]) -- the `-m32` path
      # this incident broke, and the self-contained `i686-linux-gnu-`
      # cross path that stayed fine throughout it.
      - name: Probe natmod_host's x86 toolchains actually link 64-bit arithmetic
        if: matrix.image == 'natmod_host'
        run: |
          set -eu
          echo 'long long mul64(long long a, long long b) { return a * b; }' > /tmp/probe.c
          docker run --rm -v /tmp/probe.c:/tmp/probe.c cibuildmp-natmod_host \
            gcc -m32 -shared -fPIC /tmp/probe.c -o /tmp/probe-m32.so
          docker run --rm -v /tmp/probe.c:/tmp/probe.c cibuildmp-natmod_host \
            i686-linux-gnu-gcc -shared -fPIC /tmp/probe.c -o /tmp/probe-cross.so

