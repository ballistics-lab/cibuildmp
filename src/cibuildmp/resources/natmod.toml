# Pinned data for natmod builds. Kept out of the Python source on purpose,
# the same way cibuildwheel keeps build-platforms.toml and
# pinned_docker_images.cfg out of its own: everything here goes stale on
# someone else's schedule -- a MicroPython release, an xpack release, an
# Espressif toolchain drop -- so bumping it should be a data edit that a
# script or a bot can make and a human can review as a diff, not a patch to
# resolver logic.
#
# Three tables, three different upstreams:
#   [arch]      transcribed from MicroPython's py/dynruntime.mk
#   [mpy-abi]   transcribed from MicroPython's py/persistentcode.h, per tag
#   [[toolchain]]  third-party toolchain releases, pinned by sha256

# ── Architectures ─────────────────────────────────────────────────────────
# The ten ARCH values py/dynruntime.mk accepts, each mapped to the CROSS
# prefix it hardcodes and the toolchain that supplies it. Ten arches, five
# toolchains.
#
# `native-code` is the MP_NATIVE_ARCH_* value tools/mpy_ld.py bakes into
# every native .mpy's header (byte 2, arch in bits 2-5): the verification
# step reads it back out of the produced file and checks it against the
# identifier that was supposed to build it, the natmod equivalent of
# auditwheel.
#
# No aarch64: dynruntime.mk has no ARCH=aarch64 branch at all as of
# MicroPython v1.28, so natmod cannot target it under any configuration.
[arch]
x86       = { cross = "",   native-code = 1 }
x64       = { cross = "",                native-code = 2 }
armv6m    = { cross = "arm-none-eabi-",   native-code = 4 }
armv7m    = { cross = "arm-none-eabi-",   native-code = 5 }
armv7emsp = { cross = "arm-none-eabi-",   native-code = 7 }
armv7emdp = { cross = "arm-none-eabi-",   native-code = 8 }
xtensa    = { cross = "xtensa-lx106-elf-", native-code = 9 }
xtensawin = { cross = "xtensa-esp32-elf-",  native-code = 10 }
rv32imc   = { cross = "riscv64-unknown-elf-",  native-code = 11 }
rv64imc   = { cross = "riscv64-unknown-elf-",  native-code = 12 }

# ── RISC-V arch-flags (rv32imc only) ───────────────────────────────────────
# Transcribed from tools/mpy_ld.py's RV32_EXTENSIONS. Only rv32imc accepts
# ARCH_FLAGS= -- mpy_ld.py's own validate_arch_flags() raises for every other
# arch, and py/persistentcode.h's mp_raw_code_load() only validates
# arch_flags for MP_NATIVE_ARCH_RV32IMC too (any other arch with the
# arch-flags bit set is an unconditional "incompatible .mpy file" on load).
# Required ⊆ available at install time (a variant that does not need an
# extension must still install on hardware that has it) -- see
# micropython/micropython#19479 -- but that subset match is mip's job, not
# cibuildmp's: what cibuildmp verifies is narrower and exact -- did the
# linker actually encode the arch-flags the config asked for.
[arch-flags.rv32imc]
zba = 1    # 1 << 0
zcmp = 2   # 1 << 1

# ── .mpy ABI per MicroPython tag ──────────────────────────────────────────
# "<MPY_VERSION>.<MPY_SUB_VERSION>" from py/persistentcode.h at that tag.
#
# This is the compatibility axis, and deliberately not the release tag: a
# native .mpy loads into any runtime where both numbers match, and ABI 6.3
# alone spans v1.23.0 through v1.29.0. Pinning a matrix to a release
# tag would claim far narrower compatibility than the artifact has.
#
# A tag missing here is not an error -- see `latest` below.
[mpy-abi]
latest = "6.3"     # assumed for any tag not listed; the built .mpy's own
                   # header is checked against it before anything ships
"v1.20.0" = "6.1"
"v1.21.0" = "6.1"
"v1.22.0-preview" = "6.1"
"v1.22.0" = "6.2"
"v1.22.1" = "6.2"
"v1.22.2" = "6.2"
"v1.23.0-preview" = "6.2"
"v1.23.0" = "6.3"
"v1.24.0-preview" = "6.3"
"v1.24.0" = "6.3"
"v1.24.1" = "6.3"
"v1.25.0-preview" = "6.3"
"v1.25.0" = "6.3"
"v1.26.0-preview" = "6.3"
"v1.26.0" = "6.3"
"v1.26.1" = "6.3"
"v1.27.0-preview" = "6.3"
"v1.27.0" = "6.3"
"v1.28.0-preview" = "6.3"
"v1.28.0" = "6.3"
"v1.29.0-preview" = "6.3"
"v1.29.0" = "6.3"          # released 2026-08-24; read from py/persistentcode.h
                          # at that tag, not inferred from the preview
