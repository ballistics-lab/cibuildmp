# Pinned data for natmod builds. Kept out of the Python source on purpose,
# the same way cibuildwheel keeps build-platforms.toml and
# pinned_docker_images.cfg out of its own: everything here goes stale on
# someone else's schedule -- a MicroPython release, an xpack release, an
# Espressif toolchain drop -- so bumping it should be a data edit that a
# script or a bot can make and a human can review as a diff, not a patch to
# resolver logic.
#
# Two tables, both transcribed from MicroPython's own source, neither
# gated by tag (see below for the table that is):
#   [arch]              py/dynruntime.mk's own ARCH= vocabulary
#   [arch-flags.rv32imc]  tools/mpy_ld.py's own RV32_EXTENSIONS

# ── Architectures ─────────────────────────────────────────────────────────
# The ten ARCH values py/dynruntime.mk accepts.
#
# Only `native-code` now. Each row used to carry the `CROSS` prefix
# dynruntime.mk hardcodes and the toolchain that supplied it; record 0050
# deleted the toolchain resolver, and v1.29.0 then made the prefixes
# wrong as well -- `x86` moved from an empty prefix to `i686-linux-gnu-`
# and `x64` to `x86_64-linux-gnu-`. Neither was read by anything but a
# display column, and a prefix printed beside a make command that does
# not contain it was never worth keeping accurate.
#
# `native-code` is the MP_NATIVE_ARCH_* value tools/mpy_ld.py bakes into
# every native .mpy's header (byte 2, arch in bits 2-5): the verification
# step reads it back out of the produced file and checks it against the
# identifier that was supposed to build it, the natmod equivalent of
# auditwheel.
#
# No aarch64: dynruntime.mk has no ARCH=aarch64 branch at all as of
# MicroPython v1.28, so natmod cannot target it under any configuration.
[arch]
x86       = { native-code = 1 }
x64       = { native-code = 2 }
armv6m    = { native-code = 4 }
armv7m    = { native-code = 5 }
armv7emsp = { native-code = 7 }
armv7emdp = { native-code = 8 }
xtensa    = { native-code = 9 }
xtensawin = { native-code = 10 }
rv32imc   = { native-code = 11 }
rv64imc   = { native-code = 12 }

# ── RISC-V arch-flags (rv32imc only) ───────────────────────────────────────
# Transcribed from tools/mpy_ld.py's RV32_EXTENSIONS. Only rv32imc accepts
# ARCH_FLAGS= -- mpy_ld.py's own validate_arch_flags() raises for every other
# arch, and py/persistentcode.h's mp_raw_code_load() only validates
# arch_flags for MP_NATIVE_ARCH_RV32IMC too (any other arch with the
# arch-flags bit set is an unconditional "incompatible .mpy file" on load).
# Required ⊆ available at install time (a variant that does not need an
# extension must still install on hardware that has it) -- see
# micropython/micropython#19479 -- but that subset match is mip's job, not
# cibuildmp's: what cibuildmp verifies is narrower and exact -- did the
# linker actually encode the arch-flags the config asked for.
[arch-flags.rv32imc]
zba = 1    # 1 << 0
zcmp = 2   # 1 << 1

# ── .mpy ABI per MicroPython tag -- moved (record 0052, Track C) ──────────
#
# Used to live here as `[mpy-abi]` (tag -> "<MPY_VERSION>.<MPY_SUB_VERSION>"
# from py/persistentcode.h), with an unlisted tag silently assumed to be
# `latest`. That fallback is gone, not just moved: an unrecognised tag is
# now a loud `UnknownTagError` (platforms/natmod/targets.py), not a guess
# a real build might or might not catch later.
#
# The table itself now lives in resources/build-platforms.toml's own
# `[natmod].identifiers` rows (one row per independently-verified
# `(tag, arch)` pair, `mpy` field) -- confirmed, not assumed, to already
# agree with every tag this table used to know about before the table was
# removed. It also answers the question this table could not: which arches
# a given tag's own dynruntime.mk source tree actually has (`rv32imc` is
# not available before v1.24.0, `rv64imc` not before v1.27.0 -- both
# verified live against the real tags in that table) -- a fact with no
# per-tag home at all until build-platforms.toml existed.
