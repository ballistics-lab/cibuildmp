    { tag = "v1.20.0", date = "2023-04-26", idf_version = "v4.4", board = "ESP32_S2_WROVER", mcu = "esp32s2", product = "ESP32-S2 WROVER", vendor = "Espressif", variants = [], identifier = "v1.20.0-esp32-ESP32_S2_WROVER" },
