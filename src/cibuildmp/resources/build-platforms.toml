# Board list verified live per tag (bin/refresh_usermod_boards.py mimxrt
# <tags...>). Real counts: 11 boards v1.20.0, 12 v1.21.0..v1.24.1, 13
# v1.25.0..v1.27.0, 14 v1.28.0..v1.30.0-preview -- present, and roughly
# stable, across the full 15-tag range (no naming-scheme break like
# esp32's GENERIC*->ESP32_GENERIC* switch).
#
# mcu is always "mimxrt" -- board.json's own field genuinely does not
# distinguish the real MCU (MIMXRT1010 vs MIMXRT1060, etc. -- that lives
# only in the board name itself), verified across every row, not
# collapsed here by choice.
#
# lib/nxp_driver's own per-tag pin (a git submodule, same mechanism as
# rp2's lib/pico-sdk) is likewise NOT recorded as a row field, for the
# same reason rp2's own pico_sdk_version was dropped: it's a pure
# function of the tag/sha already in [tags]. For the record: identical
# (fa5a554c...) from v1.20.0 through v1.26.1, then two bumps (v1.27.0,
# v1.28.0) that hold through v1.30.0-preview -- verified per tag, not
# assumed constant either way. (micropython/nxp_driver is MicroPython's
# own mirror, not upstream NXP, and carries no version tags at all --
# checked live -- so this was always a raw commit sha, never a clean
# "2.3.0"-style label the way pico-sdk's pin had.)
[usermod.mimxrt]
identifier_format = "{tag}-mimxrt-{board}"
artifacts_dir_name = "{name}-{ver}-{identifier}"
post_checkout = "make -C mpy-cross && make -C ports/mimxrt BOARD={board} submodules"
