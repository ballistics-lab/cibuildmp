# The real natmod/usermod build-eligibility fact table (record 0052, Track
# A6). Not yet read by any resolver code -- resources.py has no loader for
# this file yet, and nothing in src/ consumes it. It exists on its own first,
# built up section by section, reviewed before anything is wired to it.
#
# Every row is a verified fact, not a computed cross product. [natmod]'s rows
# come straight from walking each real MicroPython tag's own
# py/persistentcode.h enum and py/dynruntime.mk (bin/refresh_natmod_archs.py,
# re-run against these exact tags -- not hand-written, not extrapolated from a
# sample). [usermod.unix]/[usermod.windows]'s arch lists are flat axes, not
# per-tag rows, because both -- unlike natmod's -- were independently verified
# to be genuine cross products across every one of these tags (no
# dynruntime.mk-style gate found in either one's own port source).
#
# `date` is on every row in every section, not only natmod's or only the
# preview tag's -- a lone preview row is otherwise indistinguishable from a
# stable one except by the "-preview" substring in its own tag; the date is
# what actually orders it against neighboring stable releases. Source: the
# tagged commit's own commit date (`git log -1 --format=%cI`, truncated to
# YYYY-MM-DD) -- not GitHub's separate "release published" timestamp, which
# needs the REST API (unavailable in the session that generated this file;
# the two dates spot-checked against it beforehand matched exactly).
#
# Tags differ by section, on purpose, not by oversight:
#
# [natmod] goes back to v1.12 -- the real floor, not an arbitrary one:
# py/dynruntime.mk returns HTTP 404 at v1.11 and 200 at v1.12 (checked
# directly against every tag in between), so v1.12 is where natmod becomes
# buildable at all, not a cutoff this record picked for convenience. v1.12
# through v1.18 report mpy = "5" (bare, no sub-version -- MPY_SUB_VERSION
# did not exist yet, confirmed by its own absence in each of those tags'
# py/persistentcode.h, not inferred); v1.19/v1.19.1 report "6" already but
# still bare (the two-part "6.1"-style ABI starts at v1.20.0). armv6m's
# `cross` is genuinely absent (not "") through v1.18 -- that tag range's
# own dynruntime.mk has no CROSS line for that branch at all, confirmed
# per tag, not assumed from a neighbor.
#
# [usermod.*] sections still start at v1.20.0 -- each port's own real
# floor has not been walked back the same way natmod's was (esp32 exists
# far earlier than v1.20.0, for one; qemu's is already recorded as
# v1.24.0 within the current range). Extending any of them the way
# [natmod] was extended here is future work, not something this record
# claims is done.
#
# Every tag: only the single newest preview at the current upper edge (an
# older preview is superseded by its own stable release, or by a newer
# preview -- neither is independently useful once that happens); every
# stable release in between is included, none skipped.

