# Board list verified live per tag (bin/refresh_usermod_boards.py samd
# <tags...>). Real counts: 10 boards v1.20.0, 11 v1.21.0..v1.24.1, 16
# v1.25.0, 18 v1.26.0..v1.30.0-preview -- the jump at v1.25.0 (11->16) is
# real, not an artifact, verified per tag.
#
# mcu is samd21 or samd51, board.json's own field genuinely distinguishes
# them here (unlike mimxrt's single bare "mimxrt" value) -- each MCU's
# own natmod-relevant arch, confirmed live in mcu/<mcu>/mpconfigmcu.mk's
# own MPY_CROSS_MCU_ARCH: samd21 -> armv6m (no FPU, -msoft-float), samd51
# -> armv7m -- NOT armv7emsp, despite samd51 boards having a real hardware
# FPU (-mfpu=fpv4-sp-d16 -mfloat-abi=hard) -- MicroPython deliberately
# targets the FPU-less ABI here, one universal M4 target rather than
# splitting per FPU config. Both armv6m/armv7m already exist in [natmod]
# above; no new natmod work is implied by adding this port.
#
# asf4_sha is the per-tag pin of lib/asf4 (github.com/adafruit/asf4,
# branch "circuitpython" -- Adafruit's own maintained fork of Microchip's
# ASF4 HAL, not upstream Microchip directly; no explanation for this
# specific choice found anywhere in MicroPython's own repo). Same raw-sha
# fallback as mimxrt's nxp_driver_sha: adafruit/asf4 carries no version
# tags either (checked live). Unlike nxp_driver's two bumps, this pin is
# genuinely identical across all 15 tags here, verified per tag rather
# than assumed from the endpoints.
