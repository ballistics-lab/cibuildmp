# ports/nrf/boards/*/board.json arrived at v1.18, the same boundary
# already found for esp8266/cc3200 (404 at v1.17, 200 at v1.18 for
# pca10056/board.json, checked live) -- v1.12..v1.17 correctly
# contribute zero rows for the "port existed, pre-board.json convention"
# reason already documented for those two ports. 21 boards at v1.18;
# two more (seeed_xiao_nrf52, arduino_nano_33_ble_sense) appear by
# v1.20.0, for 23 -- stable at 23 through v1.30.0-preview, no further
# board added or removed.
#
# All 23 board directories were renamed from lowercase to uppercase at
# v1.21.0 (pca10001 -> PCA10001, evk_nina_b1 -> EVK_NINA_B1, etc) with
# no board added, removed, or otherwise renamed in the same tag -- a
# pure key-casing change, verified by diffing the exact board set
# before/after rather than assumed from a handful of examples. product/
# vendor strings for twelve of those boards were separately cleaned up
# from a lowercase slug (often identical to the old board key, e.g.
# product="actinius_icarus") to a proper display name (product="Icarus")
# at v1.26.0 -- a later, unrelated change to the same boards, not
# folded into the v1.21.0 key rename. DVK_BL652 additionally changed
# vendor at that same v1.26.0 tag (Laird Connectivity -> Ezurio, a real
# corporate rename, not a typo fix). The nine PCA10xxx boards, plus
# FEATHER52/MICROBIT/PARTICLE_XENON, never had their product string
# touched by that cleanup -- PCA10xxx's own product stays the lowercase
# slug ("pca10001") at every tag through v1.30.0-preview, kept exactly
# as board.json has it rather than normalized to match the other
# twelve.
[usermod.nrf]
identifier_format = "{tag}-nrf-{board}"
artifacts_dir_name = "{name}-{ver}-{identifier}"
post_checkout = "make -C mpy-cross && make -C ports/nrf BOARD={board} submodules"
identifiers = [
