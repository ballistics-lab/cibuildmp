# Board list verified live per tag (bin/refresh_usermod_boards.py mimxrt
# <tags...>). Real counts: 11 boards v1.20.0, 12 v1.21.0..v1.24.1, 13
# v1.25.0..v1.27.0, 14 v1.28.0..v1.30.0-preview -- present, and roughly
# stable, across the full 15-tag range (no naming-scheme break like
# esp32's GENERIC*->ESP32_GENERIC* switch).
#
# mcu is always "mimxrt" -- board.json's own field genuinely does not
# distinguish the real MCU (MIMXRT1010 vs MIMXRT1060, etc. -- that lives
# only in the board name itself), verified across every row, not
# collapsed here by choice.
#
# nxp_driver_sha is the per-tag pin of lib/nxp_driver (a git submodule,
# same mechanism as rp2's lib/pico-sdk) -- but micropython/nxp_driver is
# MicroPython's own mirror of NXP's driver code, not upstream NXP
# directly, and carries no version tags at all (checked: git ls-remote
# --tags returns nothing), so there is no clean "2.3.0"-style label to
# resolve to the way pico-sdk's pin had -- the raw commit sha is recorded
# instead, the same honest fallback natmod's own `sha` field already
# uses. The pin barely moves: identical (fa5a554c...) from v1.20.0
# through v1.26.1, then two bumps (v1.27.0, v1.28.0) that hold through
# v1.30.0-preview -- verified per tag, not assumed constant either way.
