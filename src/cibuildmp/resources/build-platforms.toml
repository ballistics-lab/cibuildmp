# arch is "pyemscripten_6_0_8_wasm32" -- the real wheel platform tag,
# verified against packaging.tags._emscripten_platforms() itself (the
# reference implementation pip resolves against, not cibuildwheel's own
# "pyodide" tag, which is a different thing): it literally builds
# `f"pyemscripten_{PYEMSCRIPTEN_PLATFORM_VERSION}_wasm32"`. Two earlier
# guesses in this same table's history were both wrong -- "pyemscripten"
# alone was dismissed as not real without checking `packaging` itself
# (it is real, and is the correct prefix), and "emscripten_wasm32" was
# invented as a compromise once "pyodide" was ruled out for meaning the
# wrong thing (Pyodide's own CPython-in-wasm distribution, not what this
# port builds -- verified live in cibuildwheel's own architecture.py/
# logger.py, still true).
#
# The version segment is emsdk's own pinned "6.0.8" (docker/
# webassembly.Dockerfile), dots replaced with underscores -- platform
# tags don't carry literal dots (the same reason manylinux_2_28 is not
# manylinux_2.28). Same value on every row (the toolchain pin is a global
# constant here, not a per-tag fact -- see below), so this is a constant
# component of the tag, not something that varies row to row the way
# esp32's idf_version does.
#
# `variant` ("pyscript", the only one build_webassembly() currently
# produces) is NOT a row field here at all -- it's something the user
# picks in their own config once it's a real config axis, not a fact
# about what this table records being buildable.
#
# emsdk's own pinned version is not a *separate* row field either, unlike
# unix's manylinux/musllinux glibc floor: it's one global toolchain pin
# baked into a single Docker image and used identically for every tag,
# not a consumer-facing ABI tier that varies per build the way a glibc
# floor does -- it only shows up embedded in arch/identifier above.
[usermod.webassembly]
identifiers = [
    { tag = "v1.20.0", date = "2023-04-26", arch = "pyemscripten_6_0_8_wasm32", identifier = "v1.20.0-pyemscripten_6_0_8_wasm32" },
