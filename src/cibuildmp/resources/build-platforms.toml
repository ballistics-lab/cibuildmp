# Board list AND naming scheme both verified live per tag, not assumed
# stable -- real counts (bin/refresh_usermod_boards.py esp32 <tags...>,
# reusing the vendored mpbuild Database from platforms/usermod/boards.py --
# not a hand `ls` count, which earlier gave wrong numbers for this exact
# table): 20-26 boards
# v1.20.0..v1.23.0 (bare GENERIC* naming), 29-45 v1.24.0..v1.30.0-preview
# (ESP32_GENERIC* naming, switched at v1.24.0). Growth is not monotonic in
# a way that lets any tag's count be inferred from a neighbor -- v1.21.0
# actually has fewer boards than v1.20.0 (20 vs 26).
#
# mcu/product/vendor/variants come straight from each board's own real
# board.json. variants is metadata (board.json's own name list, e.g.
# ["SPIRAM", "OTA"]) -- not a selector axis, same reasoning as
# [usermod.webassembly]'s own variant field: usermod/build.py's
# Esp32BuildOptions has no variant parameter today, only board.
#
# idf_version is a per-row fact, NOT a constant like webassembly's emsdk --
# verified per tag against tools/ci.sh / ports/esp32/lockfiles/
# dependencies.lock.esp32: v1.21.0 v5.0.2, v1.22.0-v1.23.0 v5.0.4,
# v1.24.0-v1.25.0 v5.2.2, v1.26.0-v1.26.1 v5.4.2, v1.27.0-v1.28.0 v5.5.1,
# v1.29.0-v1.30.0-preview v5.5.2. v1.20.0 is even per-MCU, not just
# per-tag (tools/ci.sh has two setup functions: ci_esp32_idf402_setup,
# v4.0.2, for the base `esp32` MCU only; ci_esp32_idf44_setup, v4.4, for
# whichever of esp32c3/esp32s2/esp32s3's own IDF components exist in that
# checkout) -- this table's own idf_version follows the MCU, not the tag,
# for that one release. cibuildmp's own current Esp32BuildOptions.idf_version
# default ("v5.5.1", platforms/usermod/build.py) only actually matches
# v1.27.0/v1.28.0 -- a real, pre-existing mismatch for every other tag this
# table now makes visible, not something this record fixes.
#
# identifier keeps the "esp32" segment (tag-esp32-board), same choice as
# [usermod.qemu].
[usermod.esp32]
identifier_format = "{tag}-esp32-{board}"
artifacts_dir_name = "{name}-{ver}-{identifier}[-{variant}]"
pre_checkout = "git clone -b {idf_version} --recursive https://github.com/espressif/esp-idf.git && cd esp-idf && ./install.sh esp32"
post_checkout = "idf.py -D UPDATE_SUBMODULES=1 reconfigure"
identifiers = [
    { tag = "v1.20.0", idf_version = "v4.4", board = "ESP32_S2_WROVER", mcu = "esp32s2", product = "ESP32-S2 WROVER", vendor = "Espressif", variants = [], docker_image = "esp_idf", identifier = "v1.20.0-esp32-ESP32_S2_WROVER" },
