# arch is plain "wasm32", not a versioned "pyemscripten_X_Y_Z_wasm32"
# tag -- corrects this table's own earlier entry, which embedded emsdk's
# own version into arch as if it were a stable, real fact. It is not:
# tools/ci.sh, checked live at every tag this section covers (v1.20.0
# through v1.30.0-preview), always runs `./emsdk install latest &&
# ./emsdk activate latest` -- MicroPython's own CI has never pinned a
# specific emsdk version, at any point in this table's whole tag range.
# There is no stable per-tag (or global) version to embed here; the
# earlier "6.0.8" value was this table's own prior Docker image pin
# (docker/webassembly.Dockerfile), not an upstream fact -- citing this
# project's own already-made implementation choice as if it were
# something MicroPython itself declared, the same mistake already
# corrected once this session for esp32's pre_checkout.
#
# This "always latest" policy is a real, documented liability, not a
# harmless default: micropython#19380 (open) reports the `standard`
# variant broken on modern Emscripten (>=3.1.68 / emsdk 6.0.1+) --
# `library.js`'s wrong ccall ABI for mp_hal_get_interrupt_char (fixed,
# micropython#19382, merged) and `api.js`'s missing `{async: true}` for
# Asyncify-instrumented mp_js_do_exec (still open at the time this was
# checked -- maintainers' own suggested workaround is the `pyscript`
# variant instead, which sidesteps Asyncify entirely; a real fix needs
# JSPI support, micropython#19594, not yet merged). Which emsdk version
# actually builds a given MicroPython tag successfully is therefore a
# real per-tag compatibility question this table does not yet answer --
# genuinely open, not glossed over as "6.0.8 always works".
#
# emsdk is deliberately NOT baked into any Docker image as a fixed
# version, unlike the arm-none-eabi-gcc-family images -- there is no
# stable version to bake, per the above.
#
# `variant` ("pyscript", the only one build_webassembly() currently
# produces) is NOT a row field here at all -- it's something the user
# picks in their own config once it's a real config axis, not a fact
# about what this table records being buildable.
[usermod.webassembly]
identifier_format = "{tag}-{arch}"
artifacts_dir_name = "{name}-{ver}-{identifier}"
identifiers = [
    { tag = "v1.20.0", arch = "wasm32", docker_image = "webassembly", identifier = "v1.20.0-wasm32" },
    { tag = "v1.21.0", arch = "wasm32", docker_image = "webassembly", identifier = "v1.21.0-wasm32" },
    { tag = "v1.22.0", arch = "wasm32", docker_image = "webassembly", identifier = "v1.22.0-wasm32" },
