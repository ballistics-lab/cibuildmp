    { tag = "v1.22.2", arch = "wasm32", docker_image = "webassembly", identifier = "v1.22.2-wasm32" },
    { tag = "v1.23.0", arch = "wasm32", docker_image = "webassembly", identifier = "v1.23.0-wasm32" },
