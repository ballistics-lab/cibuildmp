# Newest port of any covered here -- ports/psoc-edge did not exist before
# v1.29.0 (verified live: 404 on every earlier tag's own Makefile,
# checked directly, not inferred from v1.28.0 alone), so v1.20.0..v1.28.0
# correctly contribute zero rows, not an empty-board placeholder. Exactly
# one board known so far (KIT_PSE84_AI), unchanged between its only two
# tags.
[usermod.psoc-edge]
identifier_format = "{tag}-psoc-edge-{board}"
artifacts_dir_name = "{name}-{ver}-{identifier}"
pre_checkout = "sudo apt-get install gcc-arm-none-eabi libnewlib-arm-none-eabi"
post_checkout = "make -C mpy-cross && make -C ports/psoc-edge BOARD={board} submodules"
identifiers = [
    { tag = "v1.29.0", board = "KIT_PSE84_AI", mcu = "PSE846GPS2DBZC4", product = "KIT_PSE84_AI", vendor = "Infineon Technologies", variants = [], cross = "arm-none-eabi-", docker_image = "arm_embedded", identifier = "v1.29.0-psoc-edge-KIT_PSE84_AI" },
    { tag = "v1.30.0-preview", board = "KIT_PSE84_AI", mcu = "PSE846GPS2DBZC4", product = "KIT_PSE84_AI", vendor = "Infineon Technologies", variants = [], cross = "arm-none-eabi-", docker_image = "arm_embedded", identifier = "v1.30.0-preview-psoc-edge-KIT_PSE84_AI" },
]

# ports/alif did not exist before v1.26.0 -- v1.20.0..v1.24.1 correctly
# contribute zero rows because the port didn't exist at all (checked live,
# not inferred); v1.25.0 is a real, distinct case: the port already
# existed there but with zero board.json files yet, also verified live,
# also zero rows -- a different reason for the same absence, not
