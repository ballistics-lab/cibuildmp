    { tag = "v1.22.0", date = "2023-12-27", arch = "pyemscripten_6_0_8_wasm32", identifier = "v1.22.0-pyemscripten_6_0_8_wasm32" },
    { tag = "v1.22.1", date = "2024-01-05", arch = "pyemscripten_6_0_8_wasm32", identifier = "v1.22.1-pyemscripten_6_0_8_wasm32" },
