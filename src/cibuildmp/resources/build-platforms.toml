# Board list verified live per tag (bin/refresh_usermod_boards.py stm32
# <tags...>). Real counts: 63 boards v1.20.0, 64 v1.21.0, 65
# v1.22.0..v1.23.0, 66 v1.24.0..v1.24.1, 67 v1.25.0..v1.26.1, 71
# v1.27.0, 73 v1.28.0, 76 v1.29.0..v1.30.0-preview -- the largest board
# list of any port here by a wide margin, and it keeps growing at the
# newest end rather than settling, unlike mimxrt/samd.
#
# mcu genuinely spans 14 distinct chip families (stm32f0/f4/f7/g0/g4/h5/
# h7/l0/l1/l4/u5/wb/wl, plus a separate stm32f411 family alongside
# stm32f4), board.json's own field distinguishing them directly --
# confirmed, not assumed uniform the way mimxrt's mcu turned out to be.
#
# lib/stm32lib's own per-tag pin (a git submodule) is deliberately NOT a
# row field, same reasoning as rp2/mimxrt/samd's own dropped submodule
# fields -- it's a pure function of the tag/sha already in [tags]. Worth
# flagging here specifically: unlike the other three ports, stm32lib's
# own branch name encodes a DIFFERENT HAL version per chip family in one
# string (e.g. "F0-1.9.0+F4-1.16.0+F7-1.7.0+G0-1.5.1+G4-1.3.0+H7-1.6.0+
# L0-1.11.2+L1-1.10.3+L4-1.17.0+WB-1.10.0+WL-1.1.0" as of v1.29.0), not
# one version per tag the way pico-sdk/nxp_driver/asf4 are -- dropping
# it here is a bigger simplification for this port than for the other
# three, and per-family HAL versions are NOT reconstructed anywhere in
# this table; a reader who needs one has to read that tag's own
# .gitmodules directly.
[usermod.stm32]
identifier_format = "{tag}-stm32-{board}"
artifacts_dir_name = "{name}-{ver}-{identifier}[-{variant}]"
post_checkout = "make -C mpy-cross && make -C ports/stm32 BOARD={board} submodules"
identifiers = [
    { tag = "v1.20.0", board = "ADAFRUIT_F405_EXPRESS", mcu = "stm32f4", product = "F405 Express", vendor = "Adafruit", variants = [], cross = "arm-none-eabi-", docker_image = "arm_embedded", identifier = "v1.20.0-stm32-ADAFRUIT_F405_EXPRESS" },
