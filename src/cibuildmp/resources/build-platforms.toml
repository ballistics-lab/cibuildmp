# `ports/qemu` did not exist before v1.24.0 -- v1.20.0..v1.23.0 correctly
# contribute zero rows here, not an empty-board placeholder. Board count
# grows across the remaining tags (verified per-tag, not extrapolated from
# the newest one): 5 boards through v1.26.1, 8 from v1.27.0 (+MPS2_AN500,
# MPS3_AN547, VIRT_RV64), 9 from v1.29.0 (+POWERNV9).
#
# Every real board in ports/qemu/boards/ is listed, not only the three
# (MPS2_AN385/VIRT_RV32/VIRT_RV64) cibuildmp's own QEMU_BOARD_CROSS
# currently has a toolchain prefix for (platforms/usermod/build.py) --
# the gap is a real, visible TODO for that dict, not something to hide by
# under-reporting this table.
#
# cross comes from each board's own QEMU_ARCH (ports/qemu/Makefile's
# CROSS_COMPILE ?= branches, keyed by QEMU_ARCH, not by board directly --
# verified stable across v1.24.0..v1.29.0 for every board present in both):
# arm boards (MICROBIT/MPS2_AN385/MPS2_AN500/MPS3_AN547/NETDUINO2/SABRELITE)
# -> arm-none-eabi-, VIRT_RV32/VIRT_RV64 -> riscv64-unknown-elf-, POWERNV9
# (QEMU_ARCH=ppc64) -> powerpc64le-linux-gnu- -- a toolchain
# QEMU_BOARD_CROSS doesn't even have an entry for today.
[usermod.qemu]
identifier_format = "{tag}-qemu-{board}"
artifacts_dir_name = "{name}-{ver}-{identifier}"
post_checkout = "make -C mpy-cross && make -C ports/qemu BOARD={board} submodules"
identifiers = [
    { tag = "v1.24.0", board = "MICROBIT", cross = "arm-none-eabi-", docker_image = "qemu", identifier = "v1.24.0-qemu-MICROBIT" },
    { tag = "v1.24.0", board = "MPS2_AN385", cross = "arm-none-eabi-", docker_image = "qemu", identifier = "v1.24.0-qemu-MPS2_AN385" },
