# Board list and naming scheme verified live per tag (bin/refresh_usermod_boards.py
# rp2 <tags...>, the same generalized version of refresh_esp32_boards.py's own
# script -- Database's own port_filter was already port-agnostic, so this port
# needed no new parsing logic, only a --port argument on the existing tool).
# Real counts: 16 boards v1.20.0..v1.21.0, 19 v1.22.0..v1.24.1, 29
# v1.25.0..v1.27.0, 36 v1.28.0, 38 v1.29.0..v1.30.0-preview.
#
# mcu is rp2040 or rp2350 -- RP2350 (Pico 2) boards first appear at v1.24.0,
# verified per tag, not assumed from release timing. RP2350 is also a real
# dual-architecture chip: ARM by default, RISC-V via variants = ["RISCV"] --
# the same variants-as-metadata treatment esp32 already gets (no variant
# axis in cibuildmp's own code for either port yet).
#
# lib/pico-sdk's own per-tag pin (a git submodule) is NOT recorded here as
# a pico_sdk_version field -- an earlier version of this table had one,
# but a submodule pin is itself a pure function of the tag/sha already in
# [tags] above (dropped once pointed out: checking it out is one `git
# ls-tree HEAD lib/pico-sdk` against that same commit away, not a second
# fact worth storing on every row). For the record, since it was resolved
# once and is easy to lose: v1.21.0-v1.23.0 pico-sdk 1.5.1,
# v1.24.0-v1.24.1 2.0.0, v1.25.0 2.1.1, v1.26.0-v1.27.0
# 2.1.1-correct-picotool, v1.28.0 2.2.0, v1.29.0-v1.30.0-preview 2.3.0;
# v1.20.0's own pin (f396d05f...) predates pico-sdk's first tag (1.5.1)
# and resolves to no tag at all.
[usermod.rp2]
identifier_format = "{tag}-rp2-{board}"
artifacts_dir_name = "{name}-{ver}-{identifier}[-{variant}]"
post_checkout = "make -C mpy-cross && make -C ports/rp2 BOARD={board} submodules"
