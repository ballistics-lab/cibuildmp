# Real, verified (url, sha256) pairs for the tarball cross toolchains
# [0086]'s `toolchain_fetch.fetch_script()` downloads at container time --
# the second half of what a row's own `toolchain_version`/`gcc` field
# (`build-platforms.toml`) names as a bare version string.
#
# ── Keyed by `cross`, not by `image` ────────────────────────────────────
#
# `cross` is `build-platforms.toml`'s own existing per-row field (each
# port's real `CROSS_COMPILE` prefix -- `bin/refresh_usermod_boards.py`'s
# `parse_cross_compile()`, `bin/refresh_natmod_archs.py`'s
# `parse_cross_prefixes()`), e.g. `"arm-none-eabi-"`,
# `"riscv64-unknown-elf-"` -- used here **verbatim**, trailing dash
# included, so this table's own key is never a derived spelling that could
# drift from the fact it is keyed on. Until now `cross` was read by
# nothing outside `bin/refresh_docs.py`'s own docs table; this file is its
# first real, runtime reader.
#
# Not keyed by `image` (`embedded_base` since record 0096; was
# `arm_embedded`/`riscv_embedded`, record 0058): that name is a
# Docker-packaging fact -- which container currently holds this
# toolchain -- and [0096] is exactly the repackaging this table's own
# design already anticipated: `embedded_base` now holds *both* toolchain
# families [0087]/[0089] fetch, and an `image` key could no longer tell
# them apart even if this table were keyed on it. `cross` is a fact about
# the compiler itself: an `arm-none-eabi-gcc` never builds RISC-V
# firmware regardless of which container runs it, so it is the axis that
# survives any repackaging of the images, this one included.
#
# ── Keyed by (cross, version), not by (tag, port) ───────────────────────
#
# `build-platforms.toml` already carries `toolchain_version`/`gcc` per
# row, and many rows share one value -- a table keyed by `(tag, port)`
# would repeat the same `{url, sha256}` pair dozens of times over, the
# duplication record 0010 already argues against and the same shape
# `pinned_docker_images.toml`'s own `[image_group]`/`tag_cflags.toml`
# avoid by keying on the value that actually varies. One `[cross]` table
# genuinely holds more than one version at once -- normal, not a
# modelling gap: which version a given `(tag, port)` resolves to is
# decided one level up, in `build-platforms.toml`'s own per-row field
# (not yet resolved through any lookup function), never here.
#
# ── Verified, not copied blind ──────────────────────────────────────────
#
# Every `sha256` here must be checked against the publisher's own sidecar
# (xpack's `<asset>.sha`, Arm's own `.sha256asc` at
# `gitlab.arm.com/tooling/gnu-toolchains-for-arm`, record 0094) before it
# lands. `"15.2.1-1.1"`/`"15.2.0-1"` are transcribed verbatim from the
# exact `ARG TOOLCHAIN_URL`/`ARG TOOLCHAIN_SHA256` pair each of the two
# separate Dockerfiles this table was first written against pinned
# (`arm_embedded.Dockerfile`, `riscv_embedded.Dockerfile` -- both gone,
# merged by record 0096 into `docker/embedded_base.Dockerfile`, which by
# then baked neither `ARG` any more, [0087]/[0089] having already moved
# both to this table) -- this table started truthful about what was
# already running, not aspirational about what [0087]/[0089] would
# eventually need.
#
# The rest were fetched and checked live this session, against each
# release's own `.sha` sidecar (`curl -fsSL <asset>.sha`, diffed against
# a local `sha256sum` of the downloaded tarball) -- not copied from
# `build-platforms.toml`'s own `gcc` values on faith. Doing that caught a
# real mismatch: `natmod`'s own `rv32imc`/`rv64imc` rows record
# `gcc = "14.3.0-1.1"`, but `riscv-none-elf-gcc-xpack`'s real release list
# (`gh api repos/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases`) has
# no such tag -- riscv's own xpack suffix scheme is bare `-1`/`-2`, not
# arm-none-eabi's `-1.1`; the real tag is `v14.3.0-1`. `pinned` here uses
# the corrected string; `build-platforms.toml`'s own rows still say
# `"14.3.0-1.1"` and need the same fix, tracked separately.
#
# `riscv64-unknown-elf-` (not `riscv-none-elf-`, the xpack package's own
# name): a symlink step maps the tarball's real `riscv-none-elf-*`
# binaries onto the `riscv64-unknown-elf-*` names `py/dynruntime.mk`/
# `ports/qemu` actually invoke -- the key here is the prefix code looks up
# by, not the tarball's own internal one. That step used to run at
# image-build time, inside what was then `riscv_embedded.Dockerfile`'s own
# `for` loop; [0087]/[0089] moved it into the container-time fetch script
# instead (`toolchain_fetch.rename_prefix_script()`, since
# `dockerrun.run()` always runs as the host's own non-root uid and a
# build-time loop into `/usr/local/bin` cannot survive that), which is
# also why record 0096 could merge the two Dockerfiles at all -- there was
# no build-time behavior left on either side for the merge to have to
# reconcile.
#
# ── What this does not fix ───────────────────────────────────────────────
#
# `build-platforms.toml` itself still repeats `gcc`/`toolchain_version`
# on every one of 2380 rows for only 5 distinct `(cross, version)` pairs
# among them (measured directly) -- the same kind of duplication `[tags]`
# already eliminated for `sha`/`date`, not yet done for this fact. That is
# a schema change to `build-platforms.toml` itself, out of scope for
# [0086]'s own fetch mechanism -- a follow-up, not fixed here.

["arm-none-eabi-"]
"15.2.1-1.1" = { url = "https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v15.2.1-1.1/xpack-arm-none-eabi-gcc-15.2.1-1.1-linux-x64.tar.gz", sha256 = "da6a49ad4003944b823c6c93702a8787c922ab34bd7e918ec0eaf6933a9b1ff6" }
"14.2.1-1.1" = { url = "https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/xpack-arm-none-eabi-gcc-14.2.1-1.1-linux-x64.tar.gz", sha256 = "ed8c7d207a85d00da22b90cf80ab3b0b2c7600509afadf6b7149644e9d4790a6" }
"13.3.1-1.1" = { url = "https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v13.3.1-1.1/xpack-arm-none-eabi-gcc-13.3.1-1.1-linux-x64.tar.gz", sha256 = "006c89337eced277fdf4c1c3bf3aebe55c85e8d52cba8d412009717fb781b959" }

["riscv64-unknown-elf-"]
"15.2.0-1" = { url = "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz", sha256 = "aaaa8060c914851a3e5ee1ba82cc3d6f80972f90638a05c6e823a37557a33758" }
"14.3.0-1" = { url = "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v14.3.0-1/xpack-riscv-none-elf-gcc-14.3.0-1-linux-x64.tar.gz", sha256 = "be1768ef22789f4d9c41384e0261996f51724b84c2efa940d975dd7d9938c726" }

# `xtensa-esp32-elf-` (natmod's `xtensawin` arch, record 0058's
# `xtensa_esp` image): one version only, deliberately -- not an
# oversight the way `arm-none-eabi-`'s single Dockerfile pin was.
# Verified live this session: built `examples/natmod/features0` for
# `ARCH=xtensawin` against this exact toolchain (no host Docker needed --
# it is a plain x86_64 Linux tarball, run directly) across five tags
# spanning the entire matrix (`v1.18`, `v1.20.0`, `v1.25.0`, `v1.26.0`,
# `v1.29.0`), including the exact `v1.25.0`/`v1.26.0` boundary that
# breaks `arm_embedded`/`riscv_embedded` -- all five built clean, no
# `CFLAGS_EXTRA` relaxation needed. `build-platforms.toml`'s own
# `natmod.xtensawin` rows carry no `gcc`/`toolchain_version` field at all
# and should not gain one: a per-row fact only earns its keep where the
# value actually varies (record 0085's own `arm_embedded` floor/ceiling
# collision), and here it does not -- adding one would be exactly the
# duplication this file's own header argues against, for a fact with
# nothing to disambiguate.
["xtensa-esp32-elf-"]
"16.1.0_20260609" = { url = "https://github.com/espressif/crosstool-NG/releases/download/esp-16.1.0_20260609/xtensa-esp-elf-16.1.0_20260609-x86_64-linux-gnu.tar.xz", sha256 = "f708752ebb35cab21f184b2574114ed1187619db0edb8a4ba913c06ca2fa675e" }

# `xtensa-lx106-elf-` (`usermod.esp8266`, `natmod.xtensa`) is not here
