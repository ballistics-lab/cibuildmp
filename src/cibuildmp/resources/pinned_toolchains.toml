# `xtensa_lx106.Dockerfile` pins
# `https://micropython.org/resources/xtensa-lx106-elf-standalone.tar.gz`
# -- a URL with no version segment anywhere in it, published under a
# fixed name with nothing upstream calls a release. This table's own
# `[cross]."version"` shape has nothing real to put in the version slot
# for it. Espressif's own `crosstool-NG` releases (the same registry
# `xtensa-esp32-elf-` above comes from) ship a versioned
# `xtensa-esp-elf-<ver>-x86_64-linux-gnu-esp8266-multilib.tar.gz` asset
# that *may* be a real, versioned replacement -- unverified: not yet
# checked for the right binary prefix or a real `ports/esp8266` build.
