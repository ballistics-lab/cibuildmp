# through `build-platforms.toml`'s own `images.<arch>`/`images.<board>`
# map, the same way ten usermod ports already do. Published by
# `publish-docker-images.yml` run 33175380705 (2026-08-28), each one
# verified live before that run -- see record 0058's own "built and
# verified" table for what each was tested against.
arm_embedded = "ghcr.io/ballistics-lab/arm_embedded@sha256:9cc51bdf7d1189dd6e7126c32b876e0e178db2206e119498d31c00dfbf9563d8"
riscv_embedded = "ghcr.io/ballistics-lab/riscv_embedded@sha256:17e6e4fe15787e97b635b22043fc8050bd153ac7dfc4ec0bdcbc9a523d66ef9f"
xtensa_lx106 = "ghcr.io/ballistics-lab/xtensa_lx106@sha256:fb11daaf73ba8d1742a4d6adbc6703d756671e3cf2002af2700e6b1feb0c546b"
xtensa_esp = "ghcr.io/ballistics-lab/xtensa_esp@sha256:f6c25dad7c7b8fb209635a5cc1addbab6e7f9f85ee5065f8db8a6b9eb5f2adf3"
natmod_host = "ghcr.io/ballistics-lab/natmod_host@sha256:ec45bd4cf3b188ea14fbb2124db8093e0b514c0a25a685c6f966d7defe995ebc"
