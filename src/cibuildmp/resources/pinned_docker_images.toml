# riscv64 is the newest arch upstream and carries the highest floor:
# `manylinux_2_39` (Rocky Linux 10/dnf) is the only manylinux image pypa
# publishes for it.
[image.riscv64]
manylinux_2_39 = "quay.io/pypa/manylinux_2_39_riscv64@sha256:9fa1bc388ea2494e457eec44e7c16a9e66fff892d73da8af3621009e76167949"
musllinux_1_2 = "quay.io/pypa/musllinux_1_2_riscv64@sha256:c81bcd3275ce4372b3ceb59ad132619ffe3e7c591193c2d5f2ed97aba198ec51"

# mipsel is cibuildmp's own architecture, not one of cibuildwheel's
# seven, and the one documented exception to record 0043's model: pypa
# publishes no image for it, PEP 600 defines no `manylinux_*_mipsel` tag,
# and there is no Docker official image for 32-bit mipsel either -- there
# is nothing to be native to. It stays a cross-compile from an amd64
# host on a plain `ubuntu:24.04` its own Dockerfile names, which is why
# it has no `pinned_pypa_images.toml` entry: that base is not one of
# pypa's.
#
# Its floor is real all the same, and named the same way as every other
# cell rather than given a private spelling. PEP 600's tag is
# `manylinux_${GLIBCMAJOR}_${GLIBCMINOR}_${ARCH}` with the architecture
# being whatever the platform reports -- it defines a *form*, not a
# closed list of architectures, so `manylinux_2_39_mipsel` is a
# well-formed tag that simply has no pypa image behind it. `2_39` is
# checked, not assumed: `libc6-dev-mipsel-cross` on `ubuntu:24.04` is
# glibc `2.39-0ubuntu8cross2` (`apt-cache policy`, run in the real
# image). Recording it beats claiming nothing -- record 0031 found that
# even this arch's static build still reaches glibc's own `dlopen`-based
# NSS at runtime, so "no floor" would be the less honest of the two.
[image.mipsel]
manylinux_2_39 = "ghcr.io/ballistics-lab/manylinux_2_39_mipsel@sha256:740276d70517fc1041d8949871440ac919a66b14a325806e3f0ec03d772fa307"


# ══ cross-compiling ports -- no arch axis, amd64 hosts ═══════════════
#
# Outside record 0043's scope entirely and unchanged by it: these target
# Windows, WASM and bare metal, which no Linux container is ever "native"
# to, so cibuildwheel has no equivalent and no opinion. Each is a single
# amd64 image holding a cross toolchain, and `linux/amd64` (stated in
# `dockerrun.py`, since it is a property of the image rather than of any
# build target) is what now lets them run on an arm64 host at all --
# emulated, instead of failing with `exec format error`.
#
# Digests move here verbatim from `dockerrun.PORT_IMAGES`:
# `qemu`/`webassembly` from publish-docker-images.yml's own run
# 32895072172 (2026-08-25), `windows` from the later by-hand push of the
# rebuilt llvm-mingw image (record 0042). Nothing about these images
# changed, so unlike the `unix` cells their pins carry over intact --
# still under their old `cibuildmp-`-prefixed names, which is simply
# where those digests live. They lose the prefix at their next publish,
# alongside the `unix` cells above; renaming a published image means
# republishing it, not editing a string here.

[port]
# natmod is not a usermod port and sits here anyway: this table is "what
# a build pulls", and after record 0049 natmod pulls one too. Its shape
# is the cross-compiling one -- a single `linux/amd64` image holding all
# ten `dynruntime.mk` toolchains, for the reasons `natmod.Dockerfile`'s
# own header gives.
#
# **Republished by `publish-docker-images.yml` itself, finally** -- the
# first two digests for this image were both pushed by hand (`docker
# push`, not `docker/build-push-action`), which carries no
# `org.opencontainers.image.source` label: GHCR created the package
# unlinked from the repository, private until the visibility was flipped
# by hand in the settings UI, and -- discovered only when this republish
# was attempted -- **not linked for Actions write access either**, so
# `publish-docker-images.yml`'s own `packages: write` token was denied
# with `permission_denied: write_package` until the package was
# connected to this repository and granted Write under "Manage Actions
# access" (both settings-UI-only, no REST endpoint for either). This
# digest is the first one that is a real, workflow-published OCI index
# with provenance/attestation, not a bare manifest -- the actual
# closing of record 0050's own "no CI run has ever exercised
# natmod-in-a-container" gap.
#
# Content is unchanged from the second (hand-pushed) digest: all ten
# `dynruntime.mk` arches still verify against it (record 0050),
# `--platform linux/amd64` still stated explicitly rather than inherited
# from whichever machine pushed. Only the publishing path changed, which
# is why the digest itself changed even though no Dockerfile instruction
# did -- `docker/build-push-action`'s own multi-platform/attestation
# export produces a different digest than a plain `docker push` for
# byte-identical build instructions.
#
# Local work still goes through `CIBMP_NATMOD_DOCKER_IMAGE=<local tag>`.
natmod = "ghcr.io/ballistics-lab/natmod@sha256:d3f6c4316db529a2f811a6388958e3e2e08d692e230a34a0f6249da82a6580f9"

windows = "ghcr.io/ballistics-lab/windows@sha256:7caab34597a3cb2d9f4a412549d4a806134a17a1411aeb612ff61bbbcc151fcd"
