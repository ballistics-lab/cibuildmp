# The container images cibuildmp itself publishes and runs builds in --
# the table `dockerrun.py` resolves against, and cibuildmp's own
# equivalent of cibuildwheel's `resources/pinned_docker_images.cfg`.
#
# It was a `PORT_IMAGES` dict literal inside `dockerrun.py` until record
# 0043: the one pinned table that had escaped **record 0010** ("pinned
# data lives in `resources/`, not in Python"). Every value here goes
# stale on somebody else's schedule -- pypa rebuilds a base, this repo
# republishes its layer -- so bumping one is a reviewable data diff
# rather than a patch to resolver logic.
#
# **Base images are not here.** `resources/pinned_pypa_images.toml`
# mirrors upstream's own pinned list and is the only thing a Dockerfile's
# `FROM` refers to. This file is the other half: what those bases become
# once cibuildmp has added the handful of dev packages a build actually
# needs, and what a build then pulls.
#
# ── One flat table, keyed by image group ────────────────────────────────
#
# **Record 0058.** Before this, `unix` was keyed two levels deep
# (`[image.<arch>].<floor>`) and every other port sat in a separate
# `[port]` table keyed by port name. Both were really the same question --
# "which published image does this build need" -- with two different
# answers for what a build's own *key* is. Record 0058 moved that key out
# of this file entirely: `resources/build-platforms.toml` now names, at
# each port's own table level, which **image group** a build resolves to
# (a scalar `image = "..."` for a port with no per-build image axis, an
# `images.<...>` map for one that has one -- `unix`'s own map is an
# identity, since that is the one port whose image axis and build-target
# axis coincide). This file only has to answer the second half: what a
# named group is pinned to. `dockerrun.image_for()` reads both in
# sequence and never branches on the port name itself.
#
# Ten of the fifteen usermod ports and four of natmod's ten arches share
# one `arm-none-eabi`/`riscv64-unknown-elf`/etc toolchain -- see record
# 0058 for the full mapping -- so a group is very often pulled in by more
# than one (port, target) pair. `unix`'s own fifteen cells stay an
# identity map for the reason record 0058 gives: every cell there is
# built natively for itself, so the image axis and the target axis are
# one fact, not two.
#
# ── Names ─────────────────────────────────────────────────────────────
#
# `unix`'s own group names reuse **pypa's own names**, with no
# `cibuildmp-` prefix and no private dialect:
#
#   pypa base    quay.io/pypa/manylinux_2_41_mipsel  (this one isn't real --
#                                                     see the `mipsel` entry
#                                                     below, its own real
#                                                     base is `ubuntu:26.04`)
#   cibuildmp    ghcr.io/ballistics-lab/manylinux_2_41_mipsel
#   Dockerfile   docker/manylinux_2_41_mipsel.Dockerfile
#   identifier   v1.29.0-manylinux_2_41_mipsel   (no `unix-` segment --
#                                                 unix/windows/webassembly
#                                                 identifiers are {tag}-{arch})
#
# `mipsel` is the *only* one of the fifteen with a cibuildmp-published
# image left, for the reason its own entry below gives -- every other
# cell resolves straight to a `quay.io/pypa/...` reference, no
# `ghcr.io/ballistics-lab/...` layer at all.
#
# `<floor>_<arch>` is a real PEP 600 / PEP 656 platform tag, which is the
# whole point: record 0031 recorded that "manylinux" here used to mean
# nothing more than "whatever glibc `ubuntu:24.04` happens to ship",
# changing silently underneath every image with no floor recorded
# anywhere. Now the floor *is* the name. It also closes 0043's step 4 --
# `x86_64` not `x64`, `i686` not `x86`, `armv7l` not `armhf` -- because
# parity in the matrix is worth little if the labels still need
# translating at every comparison.
#
# The five toolchain groups record 0058 introduced (`embedded_base` --
# `arm_embedded`/`riscv_embedded` before record 0096 merged them,
# `xtensa_lx106`, `xtensa_esp`, `natmod_host`, `ppc64le_linux`) and
# `esp_idf_base` are named for what they hold, since none of them is a
# PEP 600 tag -- there is no upstream naming convention to reuse for a
# bare-metal cross toolchain.
#
# A key with an **empty value** is a declared group with nothing
# published for it yet. It is still real: `unix_targets()` (and, for
# every other port, `build-platforms.toml`'s own `images`/`image` key)
# lists the target that resolves to it, and asking to build that target
# fails with "no image registered", not with "unknown architecture".
# Those are different errors, and conflating them is how a half-published
# matrix quietly starts looking like a smaller one.
#
# Fill an empty one in from a real `publish-docker-images.yml` run,
# copying its "Record the pinned digest" step output in a real PR -- or
# run `bin/update_docker.py --images`, which re-reads every digest
# straight off GHCR (record 0033: cibuildmp never builds one of these
# itself, it only ever pulls one). Until then, local work goes through
# the documented per-target override
# (`CIBMP_UNIX_MANYLINUX_2_28_X86_64_DOCKER_IMAGE=<local tag>`), which is
# what that knob has always been for.
#
# `@sha256:...`, never `:latest`, for cibuildwheel's own reason: an
# immutable reference makes "already cached" and "still correct" the same
# fact, so `dockerrun.run()`'s `--pull missing` never has to guess
# whether a locally-cached image is stale.
#
# ── Every `unix` cell but `mipsel` points straight at pypa, no cibuildmp
#    layer at all ───────────────────────────────────────────────────────
#
# `armv7l`'s `manylinux_2_31`, `riscv64`'s `manylinux_2_39`, and every
# `musllinux_1_2` cell (all seven arches) never got a `libffi-devel`
# layer at all -- verified by diffing each `docker/*.Dockerfile` against
# a bare `FROM`: those nine files were byte-for-byte a `FROM` line and
# nothing else, so publishing, pulling and caching a second copy of an
# image cibuildmp adds nothing to was pure overhead.
#
# The five `manylinux_2_28_*` cells joined them once `MICROPY_STANDALONE=1`
# went universal for `unix` (see `build_unix.py`'s own `UNIX_ARCH_SETTINGS`
# header): `ports/unix/Makefile` now always takes the "build `lib/libffi`
# from source" branch and never reaches `pkg-config --cflags/libs libffi`,
# so `libffi-devel` -- the one layer `docker/manylinux_2_28_*.Dockerfile`
# ever added, and the only reason those five images were published at
# all -- stops being read by anything. Live-verified against a bare
# `quay.io/pypa/manylinux_2_28_x86_64` (no `libffi-devel` installed,
# `pkg-config --exists libffi` failing as expected): a real `ports/unix`
# build, `deplibs` included, still succeeds end to end.
#
# So all fourteen non-`mipsel` cells now share the same shape. Every
# value here is copied verbatim from `pinned_pypa_images.toml`'s own
# matching `[<arch>]` `<floor>` cell (a `quay.io/pypa/...` reference, not
# `ghcr.io/...`) -- `image_for()` does not care which registry a group
# name resolves to. `bin/update_docker.py --images` mirrors any group
# whose current value is not a `ghcr.io/...` reference straight from
# `pinned_pypa_images.toml` instead of querying GHCR for it, already
# general enough that the five joining this rule needed no code change,
# only data. Their own Dockerfiles and `publish-docker-images.yml` matrix
# rows are deleted, not kept idle -- a Dockerfile that is only ever `FROM
# <x>` is not a build step, it is a second name for `<x>`.

[image_group]

# ── unix -- one native image per (arch, libc floor), identity-keyed ────
manylinux_2_28_x86_64 = "quay.io/pypa/manylinux_2_28_x86_64@sha256:39df0042d5cc900b085aa25a0659368b42a0006c54c474299b785b44c1b4ff82"
musllinux_1_2_x86_64 = "quay.io/pypa/musllinux_1_2_x86_64@sha256:ff786af69d772d7ac3e318c00a2b682428a352cc822d6175f6a0d4b431c0d44d"

manylinux_2_28_i686 = "quay.io/pypa/manylinux_2_28_i686@sha256:87695e5924495f642fc93847768e749d5ce4d044494b69899af2e4d5ec40d86f"
musllinux_1_2_i686 = "quay.io/pypa/musllinux_1_2_i686@sha256:1dd91376182cb65bd594fec2043ed7045a0482dee5b4c7685dcc743dc6259a9d"

manylinux_2_28_aarch64 = "quay.io/pypa/manylinux_2_28_aarch64@sha256:f5f03dedf61b47d69d0742d36047db78adeee3bdb7a9910ff52304750ecf2514"
musllinux_1_2_aarch64 = "quay.io/pypa/musllinux_1_2_aarch64@sha256:09c35642d008faa6d43a45809ff068e22f37bba801f7d75faf19431aefed579d"

manylinux_2_28_ppc64le = "quay.io/pypa/manylinux_2_28_ppc64le@sha256:eb0aa5905c8ed5169db4b07e9e9156341677a762cc572cf16c766973205215f2"
musllinux_1_2_ppc64le = "quay.io/pypa/musllinux_1_2_ppc64le@sha256:37cac257191867a26d9593b45bd0b8183384657c917216929a1be4d04f0daf8f"

manylinux_2_28_s390x = "quay.io/pypa/manylinux_2_28_s390x@sha256:c64d9390efad901ed09ca959df4bc441468c65478f5750e37197813a6017a49c"
musllinux_1_2_s390x = "quay.io/pypa/musllinux_1_2_s390x@sha256:cdb216b2d50e775b024179862f0b413dcece273c2ee73a45fe933443fc86d74b"

# armv7l's manylinux line starts at `_2_31` upstream (Ubuntu 20.04/apt,
# unlike the AlmaLinux 8/dnf `_2_28` images) -- `_2_31` is the lower,
# more compatible of the two floors pypa offers, and cibuildwheel makes
# the same default choice.
manylinux_2_31_armv7l = "quay.io/pypa/manylinux_2_31_armv7l@sha256:5b1b07fbff38d153bb0f7c25ec5c7437ead95ffed0d29ef281162e4fa748236d"
musllinux_1_2_armv7l = "quay.io/pypa/musllinux_1_2_armv7l@sha256:2a2b44f4b40cfd73133e67a872479b5f1250a20740fe4a5f1f4e433f5d2d6db8"

# riscv64 is the newest arch upstream and carries the highest floor:
# `manylinux_2_39` (Rocky Linux 10/dnf) is the only manylinux image pypa
# publishes for it.
manylinux_2_39_riscv64 = "quay.io/pypa/manylinux_2_39_riscv64@sha256:101258e23c486e00cdfa8d83bb6da407fe99713cafb3ebd64a5abff0107a98f6"
musllinux_1_2_riscv64 = "quay.io/pypa/musllinux_1_2_riscv64@sha256:33af64ac6b613797e9135a2acc35c448e03799bb6ce87c6d491661876e71103f"

# mipsel is cibuildmp's own architecture, not one of cibuildwheel's
# seven, and the one documented exception to record 0043's model: pypa
# publishes no image for it, PEP 600 defines the tag *form* but no architecture list, so
# `manylinux_*_mipsel` is well-formed and simply has no pypa image,
# and there is no Docker official image for 32-bit mipsel either -- there
# is nothing to be native to. It stays a cross-compile from an amd64
# host on a plain `ubuntu:26.04` its own Dockerfile names, which is why
# it has no `pinned_pypa_images.toml` entry: that base is not one of
# pypa's.
#
# Its floor is real all the same, and named the same way as every other
# cell rather than given a private spelling. PEP 600's tag is
# `manylinux_${GLIBCMAJOR}_${GLIBCMINOR}_${ARCH}` with the architecture
# being whatever the platform reports -- it defines a *form*, not a
# closed list of architectures, so `manylinux_2_41_mipsel` is a
# well-formed tag that simply has no pypa image behind it. `2_39` was
# checked, not assumed: `libc6-dev-mipsel-cross` on `ubuntu:24.04` was
# glibc `2.39-0ubuntu8cross2` (`apt-cache policy`, run in the real
# image). Recording it beats claiming nothing -- record 0031 found that
# even this arch's static build still reaches glibc's own `dlopen`-based
# NSS at runtime, so "no floor" would be the less honest of the two.
#
# That `2_39` reading is why this cell is now `manylinux_2_41_mipsel`:
# `docker/manylinux_2_41_mipsel.Dockerfile` no longer installs that apt
# cross-toolchain at all -- Debian 13 "Trixie" dropped the mipsel port and
# took `gcc-mipsel-linux-gnu`/`libc6-dev-mipsel-cross` out of Ubuntu's
# archive with it, so the toolchain is a pinned Bootlin tarball now (gcc
# 14.3.0, glibc `2.41-70`, sha256-checked; record 0068). Renamed rather
# than repointed, on record 0031's own principle: a real PEP 600 tag must
# not keep claiming a floor its image no longer has.
#
# Published under the new package name 2026-09-01 and pinned here from that
# run's own job summary, the same manual-but-deliberate step every other row
# in this table takes (record 0033). It sat empty between the rename and that
# publish -- a GHCR digest is per *package* name, so the pre-rename digest
# was not a reference this row could carry, and
# `dockerrun.image_for()`'s own empty-group handling ("this target exists,
# nothing published for it yet") raised a clean "no image registered" rather
# than pointing at something that did not exist under this name.
manylinux_2_41_mipsel = "ghcr.io/ballistics-lab/manylinux_2_41_mipsel@sha256:cda4d18de7abe304560ffdd3a6579d6ad98f45aff4540712dc8fba1f150c703a"

# ── cross-compiling ports with no image axis of their own ─────────────
#
# Outside record 0043's scope entirely and unchanged by it: these target
# Windows and wasm, which no Linux container is ever "native" to, so
# cibuildwheel has no equivalent and no opinion. Each is a single amd64
# image holding a cross toolchain, and `linux/amd64` (stated in
# `dockerrun.py`, since it is a property of the image rather than of any
# build target) is what lets them run on an arm64 host at all -- emulated,
# instead of failing with `exec format error`.
windows = "ghcr.io/ballistics-lab/windows@sha256:ffd88f1a33dd79ba338b0ecaecfdb60f755c3e7192958232cbe9c712a8ea20a6"
webassembly = "ghcr.io/ballistics-lab/webassembly@sha256:452dd18eb34a70be198ec7bc962c9585b1838280181a618baeb332459a27e373"

