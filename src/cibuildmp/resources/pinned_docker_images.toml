# The container images cibuildmp itself publishes and runs builds in --
# the table `dockerrun.py` resolves against, and cibuildmp's own
# equivalent of cibuildwheel's `resources/pinned_docker_images.cfg`.
#
# It was a `PORT_IMAGES` dict literal inside `dockerrun.py` until record
# 0043: the one pinned table that had escaped **record 0010** ("pinned
# data lives in `resources/`, not in Python"). Every value here goes
# stale on somebody else's schedule -- pypa rebuilds a base, this repo
# republishes its layer -- so bumping one is a reviewable data diff
# rather than a patch to resolver logic.
#
# **Base images are not here.** `resources/pinned_pypa_images.toml`
# mirrors upstream's own pinned list and is the only thing a Dockerfile's
# `FROM` refers to. This file is the other half: what those bases become
# once cibuildmp has added the handful of dev packages a build actually
# needs, and what a build then pulls.
#
# ── One flat table, keyed by image group ────────────────────────────────
#
# **Record 0058.** Before this, `unix` was keyed two levels deep
# (`[image.<arch>].<floor>`) and every other port sat in a separate
# `[port]` table keyed by port name. Both were really the same question --
# "which published image does this build need" -- with two different
# answers for what a build's own *key* is. Record 0058 moved that key out
# of this file entirely: `resources/build-platforms.toml` now names, at
# each port's own table level, which **image group** a build resolves to
# (a scalar `image = "..."` for a port with no per-build image axis, an
# `images.<...>` map for one that has one -- `unix`'s own map is an
# identity, since that is the one port whose image axis and build-target
# axis coincide). This file only has to answer the second half: what a
# named group is pinned to. `dockerrun.image_for()` reads both in
# sequence and never branches on the port name itself.
#
# Ten of the fifteen usermod ports and four of natmod's ten arches share
# one `arm-none-eabi`/`riscv64-unknown-elf`/etc toolchain -- see record
# 0058 for the full mapping -- so a group is very often pulled in by more
# than one (port, target) pair. `unix`'s own fifteen cells stay an
# identity map for the reason record 0058 gives: every cell there is
# built natively for itself, so the image axis and the target axis are
# one fact, not two.
#
# ── Names ─────────────────────────────────────────────────────────────
#
# `unix`'s own group names reuse **pypa's own names**, with no
# `cibuildmp-` prefix and no private dialect:
#
#   pypa base    quay.io/pypa/manylinux_2_28_x86_64
#   cibuildmp    ghcr.io/ballistics-lab/manylinux_2_28_x86_64
#   Dockerfile   docker/manylinux_2_28_x86_64.Dockerfile
#   identifier   v1.29.0-manylinux_2_28_x86_64   (no `unix-` segment --
#                                                 unix/windows/webassembly
#                                                 identifiers are {tag}-{arch})
#
# `<floor>_<arch>` is a real PEP 600 / PEP 656 platform tag, which is the
# whole point: record 0031 recorded that "manylinux" here used to mean
# nothing more than "whatever glibc `ubuntu:24.04` happens to ship",
# changing silently underneath every image with no floor recorded
# anywhere. Now the floor *is* the name. It also closes 0043's step 4 --
# `x86_64` not `x64`, `i686` not `x86`, `armv7l` not `armhf` -- because
# parity in the matrix is worth little if the labels still need
# translating at every comparison.
#
# The six toolchain groups record 0058 introduced (`arm_embedded`,
# `riscv_embedded`, `xtensa_lx106`, `xtensa_esp`, `natmod_host`,
# `ppc64le_linux`) and `esp_idf_base` are named for what they hold, since
# none of them is a PEP 600 tag -- there is no upstream naming convention
# to reuse for a bare-metal cross toolchain.
#
# A key with an **empty value** is a declared group with nothing
# published for it yet. It is still real: `unix_targets()` (and, for
# every other port, `build-platforms.toml`'s own `images`/`image` key)
# lists the target that resolves to it, and asking to build that target
# fails with "no image registered", not with "unknown architecture".
# Those are different errors, and conflating them is how a half-published
# matrix quietly starts looking like a smaller one.
#
# Fill an empty one in from a real `publish-docker-images.yml` run,
# copying its "Record the pinned digest" step output in a real PR -- or
# run `bin/update_docker.py --images`, which re-reads every digest
# straight off GHCR (record 0033: cibuildmp never builds one of these
# itself, it only ever pulls one). Until then, local work goes through
# the documented per-target override
# (`CIBMP_UNIX_MANYLINUX_2_28_X86_64_DOCKER_IMAGE=<local tag>`), which is
# what that knob has always been for.
#
# `@sha256:...`, never `:latest`, for cibuildwheel's own reason: an
# immutable reference makes "already cached" and "still correct" the same
# fact, so `dockerrun.run()`'s `--pull missing` never has to guess
# whether a locally-cached image is stale.
#
# ── Nine `unix` cells point straight at pypa, no cibuildmp layer at all ─
#
# Not every `unix` cell needs a `ghcr.io/ballistics-lab/...` image:
# `armv7l`'s `manylinux_2_31`, `riscv64`'s `manylinux_2_39`, and every
# `musllinux_1_2` cell (all seven arches) never got the `libffi-devel`
# layer the `manylinux_2_28` cells need -- verified by diffing each
# `docker/*.Dockerfile` against a bare `FROM`: those nine files were
# byte-for-byte a `FROM` line and nothing else, so publishing, pulling
# and caching a second copy of an image cibuildmp adds nothing to was
# pure overhead. Their value here is copied verbatim from
# `pinned_pypa_images.toml`'s own matching `[<arch>]` `<floor>` cell (a
# `quay.io/pypa/...` reference, not `ghcr.io/...`) -- `image_for()` does
# not care which registry a group name resolves to. `bin/update_docker.py
# --images` mirrors these nine straight from `pinned_pypa_images.toml`
# instead of querying GHCR, since there is no cibuildmp-published image
# to query. Their own Dockerfiles and `publish-docker-images.yml` matrix
# rows are deleted, not kept idle -- a Dockerfile that is only ever `FROM
# <x>` is not a build step, it is a second name for `<x>`.

[image_group]

# ── unix -- one native image per (arch, libc floor), identity-keyed ────
manylinux_2_28_x86_64 = "ghcr.io/ballistics-lab/manylinux_2_28_x86_64@sha256:1ad90a73ed0dce39d0c59694d87b417a1018303c8c8bc45408b895278615875e"
musllinux_1_2_x86_64 = "quay.io/pypa/musllinux_1_2_x86_64@sha256:8900a53ed236d85edd6868387b3e3327c45774156519ad492fe8b1c2a434d1dc"

manylinux_2_28_i686 = "ghcr.io/ballistics-lab/manylinux_2_28_i686@sha256:833f6a528ebacdaa6504b1996e6cf2e022d6488171b897bc932ac4ad4f9eed4f"
musllinux_1_2_i686 = "quay.io/pypa/musllinux_1_2_i686@sha256:e9029eacb01a207fc991eed8abccf55f653900b4b83068e37fb0ea201176a64a"

manylinux_2_28_aarch64 = "ghcr.io/ballistics-lab/manylinux_2_28_aarch64@sha256:813e623f31e5fc711d9b445ee864abd4acec8c0c0f498b466f151a92f0b3a4fe"
musllinux_1_2_aarch64 = "quay.io/pypa/musllinux_1_2_aarch64@sha256:ab0391c77648e2b15d37e3e5b8c3d43a0c4a1ca0fb3ab2f60d252be3474d2975"

manylinux_2_28_ppc64le = "ghcr.io/ballistics-lab/manylinux_2_28_ppc64le@sha256:fd9ebcc5ff2aa63ac54edfedd06ab7265965814ad57d9f247c1825205c789b9f"
musllinux_1_2_ppc64le = "quay.io/pypa/musllinux_1_2_ppc64le@sha256:e745f8e8e8c7c8e02e6379502d0b73f7cc4fd95283e011a78063292740f3cf42"

manylinux_2_28_s390x = "ghcr.io/ballistics-lab/manylinux_2_28_s390x@sha256:53df7d9c279db406d9807676b36c0b9dc1696bfc5bc97e715990c5bf4c3c997b"
