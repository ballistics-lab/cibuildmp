# Upstream pypa container images, pinned by digest -- a faithful mirror of
# cibuildwheel's own `cibuildwheel/resources/pinned_docker_images.cfg`,
# transcribed into this project's TOML (every other pinned table here is
# already TOML, so one loader covers all of them).
#
# **These are base images only.** Nothing runs a build in them directly:
# `resources/pinned_docker_images.toml` holds the images cibuildmp itself
# publishes and builds in, each one a thin `FROM` this file plus the few
# dev packages `ports/unix` needs. Record 0043 has the full argument; the
# short version is that a stock `manylinux_2_28_x86_64` cannot resolve
# `pkg-config --libs libffi` (verified by running it in the real image),
# and cibuildwheel's own answer to that -- a user-configured `before-all`
# `yum install` -- is not a shape cibuildmp wants for its own build
# infrastructure (D28).
#
# Kept as a *mirror*, not a filtered subset: every section and every
# variant upstream pins is here, including the `manylinux2014` /
# `manylinux_2_34` / `manylinux_2_35` floors cibuildmp does not currently
# curate for any arch, and the `pypy_*` sections which have no MicroPython
# meaning at all. Re-syncing is then a diff against one upstream file
# rather than a judgement call per line about what was deliberately
# dropped. Which floor each architecture actually gets is a separate,
# curated decision, and it lives where it takes effect: the keys of
# `[image.<arch>]` in `pinned_docker_images.toml`.
#
# Digests carry upstream's own build date (`2026.08.15-1`) as a trailing
# comment, exactly as upstream writes them, so a bump is visibly a bump.

