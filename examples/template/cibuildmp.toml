# cibuildmp's own integration test bed -- see
# .github/workflows/build-examples.yml. natmod/template.c is a trivial
# module whose only job is to build cleanly, so this config deliberately
# doesn't override archs/skip: every target cibuildmp claims to support
# should build here, or the claim is wrong.
#
# version is deliberately not set here -- CI sets CIBMP_VERSION so every
# push exercises D14's packaging step (extra-files + package.json) too,
# without a version number ever needing to live in this repo's own git
# history the way it would for a real consuming project's tagged release.
#
# Single tag deliberately, not a D13 multi-tag list: an old enough tag to
# land on a different ABI (e.g. v1.21.0, ABI 6.1) fails to build mpy-cross
# under a modern host gcc -- upstream's py/emitinlinethumb.c and
# emitinlinextensa.c initialise fixed-size char arrays without room for the
# trailing NUL ({10, "r10"}), which recent gcc's
# -Werror=unterminated-string-initialization rejects. Nothing cibuildmp can
# fix (mpy-cross is a host build, not a cross-compile), so this CI stays on
# one tag; D13's multi-tag path is covered by tests/test_options.py and
# tests/test_targets.py instead.

micropython = "v1.28.0"

[natmod]
archs = [
    "x64",
    "x86",
    "armv6m",
    "armv7m",
    "armv7emsp",
    "armv7emdp",
    "rv32imc",
    "rv64imc",
    "xtensa",
    "xtensawin",
]

[publish]
# facade.py is not part of natmod/'s own SRC, so dynruntime.mk never merges
# it into template.mpy -- a separate, arch-independent companion (D14),
# copied into every identifier's own directory and listed untagged in that
# identifier's package.json.
extra-files = ["src/facade.py"]
