# cibuildmp's own integration test bed -- see
# .github/workflows/build-examples.yml. natmod/template.c is a trivial
# module whose only job is to build cleanly, so this config deliberately
# doesn't override archs/skip: every target cibuildmp claims to support
# should build here, or the claim is wrong.
#
# Both [natmod] and [usermod] live in this one file, natmod/, usermod/
# and src/ as siblings under this same directory -- the real downstream
# layout (see micropython-bclibc's and a7p/micropython's own
# cibuildmp.toml), not a separate example directory per mode, and not two
# independent module implementations either -- natmod/template.c and
# usermod/template/template.c both wrap the exact same
# src/template_core.c (see that file's own header comment), and
# src/facade.py is the shared Python-level API layer on top: copied
# alongside template.mpy on the natmod side ([publish] extra-files
# below), frozen into the firmware image on the usermod side
# (usermod/manifest.py). Both tables present means detect_mode() can no
# longer infer which one a bare `cibuildmp examples/template` means, so
# build-examples.yml sets CIBMP_PLATFORM explicitly for each -- the same
# generic env-override every cibuildmp.toml key already has (options.py's
# own opt()), not a dedicated action.yml input, matching cibuildwheel's
# own CIBW_BUILD shape.
#
# version is deliberately not set here -- CI sets CIBMP_VERSION so every
# push exercises D14's packaging step (extra-files + package.json) too,
# without a version number ever needing to live in this repo's own git
# history the way it would for a real consuming project's tagged release.
#
# Single tag deliberately, not a D13 multi-tag list: an old enough tag to
# land on a different ABI (e.g. v1.21.0, ABI 6.1) fails to build mpy-cross
# under a modern host gcc -- upstream's py/emitinlinethumb.c and
# emitinlinextensa.c initialise fixed-size char arrays without room for the
# trailing NUL ({10, "r10"}), which recent gcc's
# -Werror=unterminated-string-initialization rejects. Nothing cibuildmp can
# fix (mpy-cross is a host build, not a cross-compile), so this CI stays on
# one tag; D13's multi-tag path is covered by tests/test_options.py and
# tests/test_targets.py instead.

micropython = "v1.28.0"

[natmod]
archs = [
    "x64",
    "x86",
    "armv6m",
    "armv7m",
    "armv7emsp",
    "armv7emdp",
    "rv32imc",
    "rv64imc",
    "xtensa",
    "xtensawin",
]

[publish]
# facade.py is not part of natmod/'s own SRC, so dynruntime.mk never merges
# it into template.mpy -- a separate, arch-independent companion (D14),
# copied into every identifier's own directory and listed untagged in that
# identifier's package.json.
extra-files = ["src/facade.py"]

# usermod/ is the same "template" module as natmod/template.c (see this
# file's own header comment), built as a real USER_C_MODULES module
# across every unix arch cibuildmp claims to support, plus webassembly --
# the same "no overrides, every claimed target actually builds here"
# discipline the natmod side above already holds itself to. archs is
# left at unix's own default, which records 0043/0044 changed from five
# cross-compiled arches to five native platform-tag targets
# (manylinux_2_28_x86_64 / _i686 / _aarch64, manylinux_2_31_armv7l,
# manylinux_2_39_mipsel) -- exactly what proves each published image
# really is native to its own architecture inside the real Docker action,
# rather than only in a bare dev sandbox. Three of those five are
# emulated on an amd64 runner, which is why build-examples.yml's own
# usermod job now sets up binfmt first.
#
# The default is deliberately not the whole fifteen-cell matrix (the
# musllinux column and ppc64le/s390x/riscv64 are opt-in) -- see
# usermod/targets.py's own _UNIX_DEFAULT_TARGETS for why.
# webassembly is named explicitly too since it has no per-build axis of
# its own (usermod/targets.py's own _PORT_AXES) to separately opt into.
#
# module-dir = "." (not cibuildmp's own "usermod" default), matching
# micropython-bclibc's/a7p/micropython's own USER_C_MODULES choice --
# points USER_C_MODULES at this whole project root, not usermod/ alone,
# which both satisfies py.mk's own `$(USER_C_MODULES)/*/micropython.mk`
# glob (usermod/ is that one required subdirectory level) and, unlike
# cibuildmp's own default, gives the build container's own bind mount
# (dockerrun.py only mounts USER_C_MODULES itself) visibility into src/
# too -- required for usermod/micropython.mk's own SRC_USERMOD entry
# pointing at src/template_core.c, a sibling of usermod/, not a
# descendant of it.
[usermod]
module-dir = "."
ports = ["unix", "webassembly", "windows"]
manifest = "usermod/manifest.py"
