# cibuildmp's own usermod integration test -- see
# .github/workflows/build-examples.yml. usermod/mymod is a trivial
# USER_C_MODULES module whose only job is to build cleanly through
# ports/webassembly, the same "no overrides, every claimed target
# actually builds here" discipline examples/usermod-unix already holds
# itself to for unix.
#
# ports = ["webassembly"] -- webassembly has no per-build axis
# (usermod/targets.py's own _PORT_AXES), so there is no `archs`/`boards`
# key to set here at all, unlike examples/usermod-unix's own five arches.
micropython = "v1.28.0"

[usermod]
ports = ["webassembly"]
